<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
  <title>Nicosoft HMS manager</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    /* Users page polish. Keeps the old global styles, but keeps access controls out of account details. */
    .user-stack { display: grid; gap: 12px; }
    .user-card { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) max-content; gap: 18px; align-items: center; padding: 16px 18px; background: var(--paper, #fff); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow-soft); cursor: pointer; }
    .user-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-soft); }
    .user-main { min-width: 0; }
    .user-name { font-weight: 700; color: var(--ink, #102a32); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-meta { color: var(--steel, #6b7780); font-size: .86rem; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-actions { position: static; display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: nowrap; min-width: 0; max-width: 100%; }
    .user-actions select { flex: 0 0 180px; width: 180px !important; min-width: 140px; max-width: 180px; }
    .user-actions .btn { flex: 0 0 auto; white-space: nowrap; }
    .users-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 22px 0 12px; }
    .users-head:first-child { margin-top: 0; }
    .settings-card { display: grid; gap: 12px; }
    .settings-current { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .kv { padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: color-mix(in srgb, var(--paper-2) 48%, var(--paper)); }
    .kv .k { color: var(--steel, #6b7780); font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
    .kv .v { font-weight: 650; margin-top: 3px; overflow-wrap: anywhere; }
    .change-lines { display: grid; gap: 6px; margin-top: 8px; }
    .change-line { font-size: .92rem; }
    .change-line strong { display: inline-block; min-width: 88px; }
    .email-log-item { border-left: 3px solid rgba(26,47,54,.18); padding: 8px 0 8px 12px; margin: 6px 0; }
    .users-tools { display: grid; gap: 10px; margin: 12px 0 14px; }
    .users-filterbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .users-search { width: 100%; }
    @media (max-width: 720px) {
      .user-card { grid-template-columns: 1fr; }
      .user-actions { justify-content: flex-start; flex-wrap: wrap; }
      .user-actions select { flex: 1 1 100%; width: 100% !important; max-width: none; }
      .settings-current { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="screen"></div>

  <script type="module">
  import { db, requireSession, currentProfile, signInWithIdentifier, signUpWithProfile, maskEmail, el, $, fmt, toast, newAuthClient, initTheme, themeToggleButton, connectionStatusDot, initLanguage, languageSelect, currentLanguage, t,
           roleRank, isAdminPlus, isSuperPlus, isSysadmin, canViewChecklistLogs, canAccessVarsling, isSuspended, fileButton } from './config.js';
  import { coursesGroupView, courseBuild, courseResults } from './courses.js';
  import { navigateShell, setupPageTransition, warmAppShell } from './app-shell.js';

  initTheme();
  initLanguage();
  setupPageTransition();
  warmAppShell();
  const screen = $('#screen');
  const state = { profile: null, groups: [], profiles: [], departments: [], userDepartments: new Map(), groupDeleteRequests: [] };
  const DATA_TTL = 30000;
  const cache = {
    profilesAt: 0,
    departmentsAt: 0,
    userDepartmentsAt: 0,
    seriousIds: null,
    seriousIdsAt: 0,
    reportFields: new Map(),
    reportFieldsAt: new Map(),
  };
  const viewStack = [];                 // each entry: { title, render }
  let mobileSidebarOpen = false;
  let sidebarCollapsed = (() => { try { return localStorage.getItem('sidebarCollapsed') === '1'; } catch (e) { return false; } })();

  // ── boot ───────────────────────────────────────────────
  (async function boot() {
    const res = await requireSession({ admin: true });
    if (res.reason === 'no-session') return showAuth();
    if (res.reason === 'not-admin') return showNotAdmin(res.profile);
    if (!res.profile.is_verified) return showNotAdmin(res.profile); // access revoked
    if (res.profile.is_suspended) return showSuspended(res.profile); // under sys-admin review
    state.profile = res.profile;
    await loadProfiles(true);
    await loadDepartments();
    await loadUserDepartments();
    await loadGroupDeleteRequests();
    showApp();
    // Safety reps (verneombud) are limited to the Checklist Logs section.
    go(isAdminPlus(state.profile) ? homeView() : checklistLogsView(), { reset: true });
    if (isAdminPlus(state.profile)) startReportMonitor();
    if (isSysadmin(state.profile)) startSysadminCaseMonitor();
  })();

  // ── report monitor: polls open reports, drives the tile badge + notifications ──
  const monitor = { seen: null, count: 0, emergency: false, timer: null };
  const notifyPref = () => storageValue('notify_reports', 'all');
  const isRedReport = (i) => (i.consequence_ids?.length > 0) || !!i.consequence_other;
  const notificationController = (() => {
    const key = 'seen_notification_ids';
    const read = () => {
      try { return new Set(JSON.parse(sessionStorage.getItem(key) || '[]')); }
      catch (err) { return new Set(); }
    };
    const ids = read();
    const persist = () => {
      try { sessionStorage.setItem(key, JSON.stringify([...ids].slice(-500))); }
      catch (err) { /* storage may be unavailable */ }
    };
    return {
      shouldFire(kind, id) {
        if (!id) return true;
        const token = `${kind}:${id}`;
        if (ids.has(token)) return false;
        ids.add(token);
        persist();
        return true;
      },
    };
  })();

  function updateReportsBadge() {
    const text = monitor.count ? (monitor.emergency ? '🚩 ' : '') + monitor.count : '';
    document.querySelectorAll('.reports-badge').forEach(b => {
      b.textContent = text;
      b.style.display = monitor.count ? 'inline-flex' : 'none';
      b.style.background = monitor.emergency ? 'var(--danger)' : 'var(--steel)';
    });
  }

  function fireReportNotification(red, i) {
    if (!notificationController.shouldFire('incident', i.id)) return;
    const title = red ? '🚩 Emergency report' : 'New report';
    const body = truncate(i.what_happened || 'A new report was submitted.', 80);
    toast(`${title}: ${body}`, red ? 'err' : 'ok');
    try {
      if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body });
    } catch (e) { /* notifications unsupported */ }
  }

  async function pollReports() {
    let q = await db.from('incidents')
      .select('id, status, consequence_ids, consequence_other, report_type, what_happened')
      .eq('archived', false).eq('status', 'open');
    if (q.error) {
      // archive column not present yet — fall back to status only
      q = await db.from('incidents')
        .select('id, status, consequence_ids, consequence_other, report_type, what_happened')
        .eq('status', 'open');
      if (q.error) return;
    }
    const open = q.data || [];
    monitor.count = open.length;
    monitor.emergency = open.some(isRedReport);
    updateReportsBadge();

    const ids = new Set(open.map(i => i.id));
    if (monitor.seen === null) { monitor.seen = ids; return; } // seed on first run, no notifications
    const fresh = open.filter(i => !monitor.seen.has(i.id));
    monitor.seen = ids;

    const pref = notifyPref();
    if (pref === 'off') return;
    for (const i of fresh) {
      const red = isRedReport(i);
      if (pref === 'red' && !red) continue;
      fireReportNotification(red, i);
    }
  }

  function startReportMonitor() {
    if (notifyPref() !== 'off' && 'Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission().catch(() => {});
    }
    pollReports();
    if (monitor.timer) clearInterval(monitor.timer);
    monitor.timer = setInterval(pollReports, 30000);
  }

  // ── sys-admin emergency: pending two-person cases this sysadmin can resolve ──
  const caseMonitor = { seen: new Set(), timer: null, open: false };
  function startSysadminCaseMonitor() {
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
    pollSysadminCases();
    if (caseMonitor.timer) clearInterval(caseMonitor.timer);
    caseMonitor.timer = setInterval(pollSysadminCases, 20000);
  }
  async function fetchResolvableCases() {
    const { data = [] } = await db.from('sysadmin_cases').select('*').eq('status', 'pending')
      .order('created_at', { ascending: false });
    return (data || []).filter(c => c.initiator_id !== state.profile.id && c.target_id !== state.profile.id);
  }
  async function pollSysadminCases() {
    if (!isSysadmin(state.profile)) return;
    const cases = await fetchResolvableCases();
    for (const c of cases) {
      if (!caseMonitor.seen.has(c.id)) {
        caseMonitor.seen.add(c.id);
        if (notificationController.shouldFire('sysadmin_case', c.id) &&
            'Notification' in window && Notification.permission === 'granted')
          new Notification(t('emergencyTitle'), { body: t('emergencyBody') });
      }
    }
    if (cases.length && !caseMonitor.open) showEmergencyModal(cases[0]);
  }
  function nameForCase(id) { const p = state.profiles.find(x => x.id === id); return p ? labelOf(p) : id; }
  function showEmergencyModal(c) {
    caseMonitor.open = true;
    const act = c.action_type === 'role_change' ? `→ ${roleName(c.new_role)}` : t('revoke');
    openModal(t('emergencyTitle'), (body, close) => {
      const finish = () => { caseMonitor.open = false; close(); };
      body.append(
        el('p', { class: 'muted', style: 'margin:0 0 10px' }, t('emergencyBody')),
        el('div', { class: 'detail-grid' }, [
          kv('Initiator', nameForCase(c.initiator_id)),
          kv('Target', nameForCase(c.target_id)),
          kv('Action', act),
          kv(t('reason'), c.reason),
        ]),
        el('div', { style: 'display:flex;gap:8px;margin-top:14px;flex-wrap:wrap' }, [
          el('button', { class: 'btn btn-danger', onclick: () => resolveCase(c.id, 'uphold', finish) }, t('upholdAction')),
          el('button', { class: 'btn btn-primary', onclick: () => resolveCase(c.id, 'revert', finish) }, t('revertAction')),
        ]),
      );
    });
  }
  async function resolveCase(id, verdict, done) {
    if (!confirm(verdict === 'uphold' ? 'Uphold: the target stays suspended (and any role change applies). Continue?'
      : 'Revert: the initiating sys-admin stays suspended instead. Continue?')) return;
    const { error } = await db.rpc('resolve_sysadmin_case', { case_id: id, verdict });
    if (error) return toast(error.message, 'err');
    caseMonitor.seen.delete(id);
    toast(t('caseResolved'));
    if (done) done();
    await loadProfiles(true);
    go(homeView(), { reset: true });
  }

  function fresh(ts) {
    return ts && Date.now() - ts < DATA_TTL;
  }
  function storageJson(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (err) {
      return fallback;
    }
  }
  function setStorageJson(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); }
    catch (err) { /* private mode/quota should not break navigation */ }
  }
  function setStorageValue(key, value) {
    try { localStorage.setItem(key, value); }
    catch (err) { /* storage may be unavailable */ }
  }
  function storageValue(key, fallback = '') {
    try { return localStorage.getItem(key) || fallback; }
    catch (err) { return fallback; }
  }
  function removeStorageValue(key) {
    try { localStorage.removeItem(key); }
    catch (err) { /* storage may be unavailable */ }
  }

  async function loadProfiles(force = false) {
    if (!force && state.profiles.length && fresh(cache.profilesAt)) return state.profiles;
    const { data, error } = await db.from('profiles')
      .select('id, full_name, username, email, mobile_number, role, is_verified, can_access_varsling, is_suspended, suspended_reason')
      .order('full_name');
    if (error) {
      toast(error.message, 'err');
      state.profiles = [];
      return state.profiles;
    }
    state.profiles = (data || []).map(p => ({ ...p, mobile_number: p.mobile_number || '' }));
    cache.profilesAt = Date.now();
    return state.profiles;
  }
  async function loadDepartments(force = false) {
    if (!force && state.departments.length && fresh(cache.departmentsAt)) return state.departments;
    const { data, error } = await db.from('departments').select('*').order('name');
    state.departments = error ? [] : (data || []);
    cache.departmentsAt = Date.now();
    return state.departments;
  }
  async function loadUserDepartments(force = false) {
    if (!force && state.userDepartments.size && fresh(cache.userDepartmentsAt)) return state.userDepartments;
    const { data, error } = await db.from('user_departments').select('user_id,department_id');
    state.userDepartments = new Map();
    if (!error) {
      for (const row of data || []) {
        if (!state.userDepartments.has(row.user_id)) state.userDepartments.set(row.user_id, new Set());
        state.userDepartments.get(row.user_id).add(row.department_id);
      }
    }
    cache.userDepartmentsAt = Date.now();
    return state.userDepartments;
  }
  const departmentName = (id) => state.departments.find(d => d.id === id)?.name || 'Department';
  const generalDepartmentId = () => state.departments.find(d => (d.name || '').toLowerCase() === 'general')?.id || state.departments[0]?.id || null;
  const departmentIdsForUser = (id) => [...(state.userDepartments.get(id) || new Set())];
  const departmentLabelsForUser = (id) => {
    const labels = departmentIdsForUser(id).map(departmentName).filter(Boolean);
    return labels.length ? labels.join(', ') : 'General';
  };
  const normalizeDepartmentIds = (ids) => Array.isArray(ids) ? ids.filter(Boolean) : [];
  function departmentPicker(selectedIds = []) {
    const picked = new Set(normalizeDepartmentIds(selectedIds));
    if (!picked.size) {
      const general = generalDepartmentId();
      if (general) picked.add(general);
    }
    const wrap = el('div', { class: 'department-picker' });
    if (!state.departments.length) {
      wrap.append(el('p', { class: 'muted' }, 'Run the departments migration to enable department visibility.'));
      return { field: el('div', { class: 'field' }, [el('span', {}, t('departments')), wrap]), get: () => [] };
    }
    for (const d of state.departments) {
      const box = el('input', { type: 'checkbox', value: d.id });
      box.checked = picked.has(d.id);
      wrap.append(el('label', { class: 'check-item department-option' }, [box, el('span', {}, d.name)]));
    }
    return {
      field: el('div', { class: 'field' }, [
        el('span', {}, t('visibleToDepartments')),
        wrap,
        el('div', { class: 'muted', style: 'font-size:.78rem' }, t('departmentsHint')),
      ]),
      get: () => [...wrap.querySelectorAll('input:checked')].map(i => i.value),
    };
  }
  // ── item ⇄ group linking ("import") ────────────────────
  // An item belongs to a group when it's owned by it (group_id) or imported into
  // it (group_ids contains the id). These helpers fetch that union, falling back
  // gracefully if the group_ids column isn't there yet (migration not run).
  const isLinkedItem = (item, gid) => item.group_id !== gid; // borrowed, not owned here
  async function fetchGroupItems(table, gid, { desc = false } = {}) {
    const member = `group_id.eq.${gid},group_ids.cs.{${gid}}`;
    return db.from(table)
      .select('*')
      .or(member)
      .order('sort_order')
      .order('created_at', { ascending: !desc });
  }
  async function importItemToGroup(table, item, gid) {
    const next = [...new Set([...(item.group_ids || []), gid])].filter(id => id && id !== item.group_id);
    return db.from(table).update({ group_ids: next }).eq('id', item.id);
  }
  async function unlinkItemFromGroup(table, item, gid) {
    const next = (item.group_ids || []).filter(id => id && id !== gid);
    return db.from(table).update({ group_ids: next }).eq('id', item.id);
  }
  // Modal: pick same-kind items from OTHER groups to import into group `g`.
  // `labelOf` reads an item's display title; `onDone` re-renders the host view.
  function importItemsModal(g, { table, titleOf, onDone }) {
    openModal(t('importTitle'), async (body, close) => {
      body.append(el('p', { class: 'muted', style: 'margin-top:0' }, t('importHint')));
      const host = el('div', {});
      body.append(host);
      host.append(el('p', { class: 'muted' }, '…'));
      const { data: rows = [], error } = await db.from(table).select('*');
      host.innerHTML = '';
      if (error) { host.append(el('p', { class: 'muted' }, error.message)); return; }
      // Candidates: not already owned by, nor imported into, this group.
      const candidates = (rows || []).filter(r =>
        r.group_id !== g.id && !(Array.isArray(r.group_ids) && r.group_ids.includes(g.id)));
      if (!candidates.length) { host.append(el('p', { class: 'muted' }, t('noItemsToImport'))); return; }
      // Group candidates by their home group, label with the group name.
      const byGroup = new Map();
      candidates.forEach(r => {
        if (!byGroup.has(r.group_id)) byGroup.set(r.group_id, []);
        byGroup.get(r.group_id).push(r);
      });
      const picked = new Set();
      for (const [gid, items] of byGroup) {
        const home = state.groups.find(x => x.id === gid);
        host.append(el('div', { class: 'muted', style: 'margin:10px 0 4px;font-weight:600' },
          t('fromGroupLabel', { group: home ? home.name : '—' })));
        items.forEach(r => {
          const box = el('input', { type: 'checkbox', value: r.id });
          box.addEventListener('change', () => box.checked ? picked.add(r) : picked.delete(r));
          host.append(el('label', { class: 'check-item' }, [box, el('span', {}, titleOf(r) || '—')]));
        });
      }
      body.append(el('button', { class: 'btn btn-primary btn-block', style: 'margin-top:14px', onclick: async () => {
        if (!picked.size) return toast(t('selectItemsToImport'), 'err');
        for (const r of picked) {
          const { error: e } = await importItemToGroup(table, r, g.id);
          if (e) return toast(e.message, 'err');
        }
        close();
        toast(t('itemsImported', { count: picked.size }));
        onDone && onDone();
      } }, t('importSelected')));
    });
  }
  const importBtn = (g, opts) => el('button', { class: 'iconbtn', title: t('import'),
    onclick: () => importItemsModal(g, opts) }, '⬇');

  // Emails are masked everywhere in the UI (Giorgio's privacy design); the only
  // way to see one in clear is the audited "Show email" reveal for superusers+.
  // Note: handle_new_user() stores the EMAIL as full_name when no name was
  // given at signup, so an email-shaped full_name must be masked too.
  const displayName = (p) => {
    const fn = (p?.full_name || '').trim();
    return fn && !fn.includes('@') ? fn : '';
  };
  const labelOf = (p) => displayName(p) || p?.username || maskEmail(p?.email || p?.full_name) || 'Unnamed user';
  const nameOf = (id) => { const p = state.profiles.find(x => x.id === id); return p ? labelOf(p) : '—'; };
  const assignableIncidentProfiles = () => state.profiles
    .filter(p => p && p.id && isAdminPlus(p) && (isSysadmin(state.profile) || !isSysadmin(p)))
    .sort((a, b) => labelOf(a).localeCompare(labelOf(b)));
  // Reporter identity for the UI, hidden when the report is anonymous.
  const reporterOf = (inc) => inc.is_anonymous ? 'Anonymous' : labelOf(state.profiles.find(p => p.id === inc.reporter_id));

  // ── auth screens ───────────────────────────────────────
  function showAuth() {
    screen.innerHTML = '';
    let mode = 'login';
    const card = el('div', { class: 'auth-card' });
    const render = () => {
      card.innerHTML = '';
      card.append(
        el('div', { class: 'card-actions' }, themeToggleButton()),
        el('div', { class: 'brand' }, 'Nicosoft HMS manager'),
        languageSelect(render),
        el('div', { class: 'tag' }, mode === 'login' ? t('signInTools') : t('createAccount')),
        ...(mode === 'login'
          ? [labeled(t('usernameOrEmail'), el('input', { type: 'text', id: 'lid', autocomplete: 'username' })),
             labeled(t('password'), el('input', { type: 'password', id: 'pw', autocomplete: 'current-password' }))]
          : [labeled(t('email'), el('input', { type: 'email', id: 'em', autocomplete: 'email' })),
             labeled('Username', el('input', { type: 'text', id: 'un', autocomplete: 'username' })),
             labeled('Full name', el('input', { type: 'text', id: 'fn', autocomplete: 'name' }), true),
             labeled(t('password'), el('input', { type: 'password', id: 'pw', autocomplete: 'new-password' }))]),
        el('button', { class: 'btn btn-primary btn-block', style: 'margin-top:8px', onclick: submit },
          mode === 'login' ? t('signIn') : t('createAccount')),
        el('button', { class: 'btn btn-ghost btn-block', style: 'margin-top:10px',
          onclick: () => { mode = mode === 'login' ? 'signup' : 'login'; render(); } },
          mode === 'login' ? t('createAccount') : t('haveAccount'))
      );
    };
    async function submit() {
      const password = $('#pw').value;
      if (mode === 'signup') {
        const email = $('#em').value.trim(), username = $('#un').value.trim(), full_name = $('#fn').value.trim();
        if (!email || !full_name || !username || !password) return toast(t('nameEmailUsernamePasswordRequired'), 'err');
        const { data: free } = await db.rpc('username_available', { p_username: username });
        if (free === false) return toast(t('usernameTaken'), 'err');
        const { error } = await signUpWithProfile(db, {
          email, password, full_name, username,
          emailRedirectTo: new URL('confirmed.html', location.href).href,
        });
        if (error) return toast(error.message, 'err');
        toast(t('accountCreatedGrantAccess'));
        mode = 'login'; render();
      } else {
        const ident = $('#lid').value.trim();
        if (!ident || !password) return toast(t('enterLogin'), 'err');
        const { error } = await signInWithIdentifier(ident, password);
        if (error) return toast(error.message, 'err');
        location.reload();
      }
    }
    render();
    screen.append(el('div', { class: 'auth-screen' }, card));
  }

  function showNotAdmin(profile) {
    screen.innerHTML = '';
    screen.append(el('div', { class: 'auth-screen' },
      el('div', { class: 'auth-card' },
        el('div', { class: 'brand' }, t('noAdminAccess')),
        el('div', { class: 'tag' }, t('noAdminAccessBody', { name: labelOf(profile) })),
        el('button', { class: 'btn btn-ghost btn-block', onclick: signOut }, t('signOut'))
      )));
  }
  function showSuspended(profile) {
    screen.innerHTML = '';
    screen.append(el('div', { class: 'auth-screen' },
      el('div', { class: 'auth-card' },
        el('div', { class: 'brand' }, '🔒 ' + t('accountSuspended')),
        el('div', { class: 'tag' }, t('accountSuspendedBody')),
        profile.suspended_reason ? el('div', { class: 'tag', style: 'margin-top:8px' }, `${t('reason')}: ${profile.suspended_reason}`) : null,
        el('button', { class: 'btn btn-ghost btn-block', style: 'margin-top:12px', onclick: signOut }, t('signOut'))
      )));
  }
  function goIndex() { navigateShell('./index.html'); }
  async function signOut() {
    if (monitor.timer) clearInterval(monitor.timer);

    folders.sort((a, b) => {
      const getRank = (g) => {
        if (g.name?.trim().toLowerCase() === 'forms') return 4;

    if (contentGroups.length) {
      nav.append(el('div', { class: 'sidebar-section-label' }, t('contentGroups')));
      contentGroups.forEach(g => nav.append(sidebarGroupLink(g, active)));
    }
    if (folders.length) {
      nav.append(el('div', { class: 'sidebar-section-label' }, t('folders')));
      let dragIdx = null;
      let didDrag = false;
      folders.forEach((g, idx) => {
        const btn = sidebarGroupLink(g, active, { draggable: true, onclick: () => { if (didDrag) { didDrag = false; return; } go(groupView(g)); } });
        btn.addEventListener('dragstart', e => { dragIdx = idx; didDrag = true; e.dataTransfer.effectAllowed = 'move'; btn.classList.add('dragging'); });
        btn.addEventListener('dragend', () => { dragIdx = null; btn.classList.remove('dragging'); });
        btn.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
        btn.addEventListener('drop', async e => {
          e.preventDefault();
          if (dragIdx === null || dragIdx === idx) return;
          const [moved] = folders.splice(dragIdx, 1);
          folders.splice(idx, 0, moved);
          dragIdx = null;
          applyExtrasOrder(folders);
          await saveSortOrder('groups', state.groups);
          renderSidebar(active);
        });
        nav.append(btn);
      });
    }
    if (isAdmin) {
      nav.append(sidebarButton({ id: 'add-group', ic: '+', label: t('addGroup'), open: addGroupModal }, active));
      const pendingDeleteCount = pendingGroupDeleteRequests().length;
      nav.append(sidebarButton({ id: 'hidden-groups', ic: '🛇', label: t('hiddenGroups'),
        count: hidden.size || pendingDeleteCount || null,
        countClass: pendingDeleteCount ? 'warn' : '',
        open: hiddenGroupsModal }, active));

    side.append(nav, el('button', {
      class: 'sidebar-footer sidebar-footer-action',
      title: t('settings'),
      onclick: () => go(settingsView(), { reset: true }),
    }, [
      el('div', { class: 'sidebar-avatar' }, userInitial),
      el('div', { class: 'sidebar-user' }, [
        el('div', { class: 'sidebar-user-name' }, userName),
        el('div', { class: 'sidebar-user-meta' }, state.profile?.username ? `@${state.profile.username}` : maskEmail(state.profile?.email)),
      ]),
    ]));

  // Splice a reordered subset (the sidebar content groups) back into the full
  // state.groups list, keeping non-subset groups in their existing slots.
  function applyExtrasOrder(newExtras) {
    const ids = new Set(newExtras.map(g => g.id));
    let i = 0;
    state.groups = state.groups.map(g => ids.has(g.id) ? newExtras[i++] : g);
  }
  function sidebarButton(item, active) {

      el('span', { class: 'ic' }, item.ic),

        ? el('span', { class: 'sidebar-hide', title: t('hideGroup'), onclick: e => { e.stopPropagation(); item.onHide(); } }, '🛇')
        : (item.badge ? el('span', { class: 'badge reports-badge' }, '') : (item.count ? el('span', { class: 'badge ' + (item.countClass || '') }, String(item.count)) : null)),
    ]);
  }
  function firstGroup(kind) {
    return state.groups.find(g => g.kind === kind);
  }
  function checklistHomeGroup(g, existing = null) {
    if (existing?.group_id) return { id: existing.group_id };
    if (g?.id) return g;
    return firstGroup('checklist') || state.groups.find(x => x.kind === 'checklist' && x.id) || null;
  }
  function procedureHomeGroup(g, existing = null) {
    if (existing?.group_id) return { id: existing.group_id };
    if (g?.id) return g;
    return firstGroup('procedures') || state.groups.find(x => x.kind === 'procedures' && x.id) || null;
  }
  function openKind(kind) {

    if (group) go(groupView(group));
    else toast(t('noGroupFound', { kind }), 'err');
  }

  // ── view stack / router ────────────────────────────────
  let routeMotion = 'forward';
  let paintToken = 0;
  const ROUTE_MIN_LOAD = 320; // ms the skeleton stays up on a group switch, so it never flashes
  function go(view, { reset = false } = {}) {
    routeMotion = reset ? 'replace' : 'forward';
    if (reset) viewStack.length = 0;
    viewStack.push(view);
    paint();
  }
  function back() { if (viewStack.length > 1) { routeMotion = 'back'; viewStack.pop(); paint(); } }

  async function paint() {
    const token = ++paintToken;
    const motion = routeMotion;
    routeMotion = 'forward';
    const view = viewStack[viewStack.length - 1];
    const bar = $('#topbar'); bar.innerHTML = '';
    bar.append(el('button', { class: 'iconbtn mobile-menu-btn', title: 'Open navigation', 'aria-label': 'Open navigation', 'aria-expanded': String(mobileSidebarOpen), onclick: toggleMobileSidebar }, '\u2630'));
    if (viewStack.length > 1) bar.append(el('button', { class: 'iconbtn', onclick: back }, '‹'));
    if (view.titleAction) (Array.isArray(view.titleAction) ? view.titleAction : [view.titleAction]).filter(Boolean).forEach(a => bar.append(a));
    bar.append(el('h1', {}, view.title));
    bar.append(connectionStatusDot());
    bar.append(el('span', { class: 'role-pill' }, roleName(state.profile.role)));
    bar.append(themeToggleButton());
    bar.append(el('button', { class: 'iconbtn', title: t('refresh'), onclick: goIndex }, '⟳'));
    bar.append(el('button', { class: 'iconbtn', title: t('signOut'), onclick: signOut }, '⏻'));
    if (view.action) (Array.isArray(view.action) ? view.action : [view.action]).filter(Boolean).forEach(a => bar.append(a));
    const app = $('#app'); app.innerHTML = ''; app.className = 'wrap route-stage';
    const surface = el('div', { class: `route-surface route-${motion}` });
    app.append(surface);
    renderBotnav(view.tab || 'groups');
    renderSidebar(view.side || view.tab || 'analytics');
    syncNavToggle();

    // Entering a group shows the skeleton immediately and holds it for a minimum
    // beat (ROUTE_MIN_LOAD) so the transition reads as deliberate, never a flash.
    // Other views only fall back to a skeleton if they're still empty after 90ms.
    // The skeleton lives outside the surface so the surface's opacity gate can't
    // hide it; the surface is parked (display:none) while it loads.
    let skeleton = null;
    const enterGroup = view.minLoad && motion !== 'refresh';
    const showSkeleton = () => {
      if (token !== paintToken || skeleton || surface.childElementCount) return;
      skeleton = routeSkeleton();
      surface.style.display = 'none';
      app.append(skeleton);
    };
    if (enterGroup) showSkeleton();
    const skeletonTimer = enterGroup ? null : setTimeout(showSkeleton, 90);
    const startedAt = performance.now();
    try {
      const rendered = view.render(surface);
      if (rendered && typeof rendered.then === 'function') await rendered;
    } finally {
      if (skeletonTimer) clearTimeout(skeletonTimer);
      if (token === paintToken) {
        const reduceMotion = !!window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches;
        if (enterGroup && skeleton && !reduceMotion) {
          const elapsed = performance.now() - startedAt;
          if (elapsed < ROUTE_MIN_LOAD) await new Promise(r => setTimeout(r, ROUTE_MIN_LOAD - elapsed));
        }
        if (token === paintToken) {
          const reveal = () => {
            if (token !== paintToken) return;
            surface.style.display = '';
            requestAnimationFrame(() => surface.classList.add('route-live'));
          };
          if (skeleton) {
            // Fade the skeleton fully out first, then bring the content in — a clean
            // sequential swap so the appearing items never push the skeleton around.
            const sk = skeleton;
            sk.classList.add('route-skeleton-leaving');
            setTimeout(() => { sk.remove(); reveal(); }, 210);
          } else {
            reveal();
          }
        }
      }
    }
  }
  function refresh() { routeMotion = 'refresh'; paint(); }

  function routeSkeleton() {
    return el('div', { class: 'route-skeleton', 'aria-hidden': 'true' }, [
      el('div', { class: 'skeleton-line skeleton-title' }),
      el('div', { class: 'skeleton-grid' }, Array.from({ length: 6 }, () =>

  }

  // ════════════════════════════════════════════════════════
  //  HOME — groups grid
  // ════════════════════════════════════════════════════════
  function homeView() {
    return {
      title: 'Executive Analytics', tab: 'groups', side: 'analytics',
      async render(app) {
        // Read-only: the old Forms/Procedures self-repair (rename + auto-insert
        // + move) that ran here on every render was moved into
        // migration_active_user_gate.sql — a dashboard must not write.
        const { data } = await db.from('groups').select('*').order('sort_order');
        state.groups = visibleGroups(data || []);
        await loadProfiles();
        await loadGroupDeleteRequests();

  const kindLabel = (k) => ({ checklist: t('checklists'), reports: t('reports'), documents: t('documents'), procedures: t('procedures'), courses: t('courses') }[k] || k);
  const groupName = (g) => {
    const key = (g.name || '').trim().toLowerCase();
    return ({ checklists: t('checklists'), reports: t('reports'), documents: t('documents'), documentation: t('documents'), procedures: t('procedures') }[key] || g.name);
  };

  function visibleGroups(groups) {
    const seenDefaultKinds = new Set();
    return groups.filter(g => {
      if (g.deleted_at) return false;
      const key = (g.name || '').trim().toLowerCase();
      const isDefault = ['checklists', 'reports', 'documents', 'documentation', 'procedures'].includes(key);
      if (!isDefault) return true;
      if (seenDefaultKinds.has(g.kind)) return false;
      seenDefaultKinds.add(g.kind);
      return true;
    });
  }

  // Hidden groups are a per-admin UI preference, restorable from the sidebar.
  const HIDDEN_GROUPS_KEY = 'adminHiddenGroups';
  function hiddenGroupIds() {
    const value = storageJson(HIDDEN_GROUPS_KEY, []);
    return new Set(Array.isArray(value) ? value : []);
  }
  function setGroupHidden(id, hidden) {

  async function loadGroupDeleteRequests() {
    if (!isAdminPlus(state.profile)) {
      state.groupDeleteRequests = [];

    }
    const { data, error } = await db.from('group_delete_requests')
      .select('*').eq('status', 'pending').order('created_at', { ascending: false });
    state.groupDeleteRequests = error ? [] : (data || []);

  }
  const pendingGroupDeleteRequests = () => state.groupDeleteRequests || [];
  const pendingDeleteForGroup = (groupId) => pendingGroupDeleteRequests().find(r => r.group_id === groupId);
  const trashTypeLabel = (type) => ({
    group: t('groups'),
    report: t('reports'),
    checklist: t('checklists'),
    procedure: t('procedures'),
    document: t('documents'),
    course: t('courses'),
    communication: t('communications'),
    varsling: t('varsling'),
  }[type] || type);
  function trashDaysLeft(row) {
    if (!row.delete_expires_at) return '';
    const days = Math.max(0, Math.ceil((new Date(row.delete_expires_at) - Date.now()) / DAYMS));
    return days === 1 ? t('trashDayLeft') : t('trashDaysLeft', { count: days });
  }
  async function loadTrashItems() {
    if (!isSuperPlus(state.profile)) return { items: [], error: null };
    try { await db.rpc('purge_deleted_items', { p_only_expired: true }); }
    catch (err) { /* migration may not be installed yet */ }
    const { data, error } = await db.from('deleted_items').select('*').order('deleted_at', { ascending: false });
    return { items: error ? [] : (data || []), error };
  }
  function hiddenGroupsModal() {
    openModal(t('hiddenGroups'), async (body, close) => {
      await loadGroupDeleteRequests();
      const trash = await loadTrashItems();
      const hidden = hiddenGroupIds();
      const groups = (state.groups || []).filter(g => hidden.has(g.id));
      const pending = pendingGroupDeleteRequests();
      const visiblePendingIds = new Set(groups.map(g => g.id));
      const pendingOnly = isSuperPlus(state.profile)
        ? pending.filter(r => r.group_id && !visiblePendingIds.has(r.group_id))
        : [];

      if (!groups.length && !pendingOnly.length && !trash.items.length && !isSuperPlus(state.profile)) {
        body.append(el('p', { class: 'muted' }, t('noHiddenGroups')));

      if (groups.length) groups.forEach(g => body.append(hiddenGroupRow(g, pendingDeleteForGroup(g.id), close)));

  async function deleteGroupToTrash(g, close) {

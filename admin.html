  function groupView(g) {
    const mainProcedures = firstGroup('procedures');
    const mainDocuments = firstGroup('documents');
    const mainChecklist = firstGroup('checklist') || state.groups.find(g => g.kind === 'checklist');
    const isMainGroup = g.id === mainProcedures?.id || g.id === mainDocuments?.id || g.id === mainChecklist?.id || g.kind === 'reports' || g.kind === 'courses';

    const view = !isMainGroup
      ? folderGroupView(g)
      : g.kind === 'checklist' ? checklistGroupView(g) :
        g.kind === 'reports' ? reportsGroupView(g) :
        g.kind === 'documents' ? documentsGroupView(g) :
        g.kind === 'courses' ? coursesGroupView(g, { go, back, state, departmentPicker, importBtn }) :
        proceduresGroupView(g);

    const firstReports = firstGroup('reports');
    const firstCourses = firstGroup('courses');
    view.side = (g.id === firstReports?.id) ? 'incidents'
      : (g.id === firstCourses?.id) ? 'courses'
      : `group:${g.id}`;
    view.minLoad = true;
    return view;
  }

  function folderGroupView(g) {
    return {
      title: groupName(g), tab: 'groups',
      titleAction: el('button', { class: 'iconbtn', title: t('edit'), 'aria-label': t('edit'), onclick: () => editFolderModal(g) }, '\u270e'),
      async render(app) {
        await loadDepartments();
        const [checklistsQ, documentsQ, proceduresQ] = await Promise.all([
          fetchGroupItems('checklists', g.id),
          fetchGroupItems('documents', g.id, { desc: true }),
          fetchGroupItems('procedures', g.id)
        ]);
        
        const checklists = checklistsQ.data || [];
        const documents = documentsQ.data || [];
        const procedures = proceduresQ.data || [];
        const totalCount = checklists.length + documents.length + procedures.length;
        
        const listHost = el('div', { class: 'dept-group-container' });
        
        const customImportBtn = (label, table, titleOf) => el('button', {
          class: 'btn btn-ghost',
          style: 'display: flex; align-items: center; gap: 4px;',
          onclick: () => importItemsModal(g, { table, titleOf, onDone: () => go(folderGroupView(g), { reset: true }) })
        }, [el('span', {}, '⬇'), el('span', {}, `${t('import') || 'Import'} ${label}`)]);
        
        const toolbar = el('div', { style: 'display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;' }, [
          customImportBtn(t('checklists') || 'Checklists', 'checklists', c => c.title),
          customImportBtn(t('documents') || 'Documents', 'documents', d => d.name),
          customImportBtn(t('procedures') || 'Procedures', 'procedures', p => p.title),
        ]);
        
        app.append(toolbar, listHost);
        
        if (totalCount === 0) {
          listHost.append(emptyState(t('noEntries') || 'Empty Folder', t('noEntriesHint') || 'Import items using the buttons above.'));
          return;
        }
        
        const grid = el('div', { class: 'library-grid' });
        listHost.append(grid);
        
        const addCard = (item, kind, title, meta, sub, actions) => {
          const card = libraryCard({
            kind,
            title,
            meta,
            sub,
            image: item.image || (kind === 'checklist' ? firstChecklistImage(item) : null),
            icon: item.icon || null,
            hideKind: false,
            actions
          });
          grid.append(card);
        };
        
        checklists.forEach(c => {
          const linked = isLinkedItem(c, g.id);
          addCard(c, 'checklist', c.title, t('items', { count: (c.items || []).length }), linked ? t('linked') : null, [
            el('button', { class: 'btn btn-ghost', onclick: e => { e.stopPropagation(); go(checklistEdit(g, c)); } }, t('edit')),
            linked ? el('button', { class: 'btn btn-ghost', title: t('removeFromGroup'), onclick: async e => {
              e.stopPropagation();
              const { error } = await unlinkItemFromGroup('checklists', c, g.id);
              if (error) return toast(error.message, 'err');
              toast(t('removedFromGroup')); go(folderGroupView(g), { reset: true });
            } }, '×') : null,
          ].filter(Boolean));
        });
        
        documents.forEach(d => {
          const linked = isLinkedItem(d, g.id);
          addCard(d, 'document', d.name, `${(d.size_bytes / 1024 | 0)} KB`, linked ? `${t('linked')} · ${fmt(d.created_at)}` : fmt(d.created_at), [
            el('button', { class: 'btn btn-ghost', onclick: e => { e.stopPropagation(); openDoc(d); } }, t('open')),
            el('button', { class: 'btn btn-danger', title: linked ? t('removeFromGroup') : '', onclick: e => { e.stopPropagation(); removeDoc(d, 'documents'); } }, '×'),
          ]);
        });
        
        procedures.forEach(p => {
          const linked = isLinkedItem(p, g.id);
          addCard(p, 'procedure', p.title, `${(p.fields || []).length} ${t('procedureSteps')}`, linked ? `${t('linked')} · ${p.is_draft ? t('draft') : t('published')}` : (p.is_draft ? t('draft') : t('published')), [
            el('button', { class: 'btn btn-ghost', onclick: e => { e.stopPropagation(); go(submissionsView(p)); } }, t('entries')),
            el('button', { class: 'btn btn-ghost', onclick: e => { e.stopPropagation(); go(procedureBuild(g, p)); } }, t('edit')),
            linked ? el('button', { class: 'btn btn-ghost', title: t('removeFromGroup'), onclick: async e => {
              e.stopPropagation();
              const { error } = await unlinkItemFromGroup('procedures', p, g.id);
              if (error) return toast(error.message, 'err');
              toast(t('removedFromGroup')); go(folderGroupView(g), { reset: true });
            } }, '×') : null,
          ].filter(Boolean));
        });
        
        async function openDoc(d) {
          const { data, error } = await db.storage.from('documents').createSignedUrl(d.storage_path, 60);
          if (error) return toast(error.message, 'err');
          window.open(data.signedUrl, '_blank');
        }
        async function removeDoc(d, table) {
          const linked = isLinkedItem(d, g.id);
          if (linked) {
            const { error } = await unlinkItemFromGroup(table, d, g.id);
            if (error) return toast(error.message, 'err');
            toast(t('removedFromGroup')); go(folderGroupView(g), { reset: true });
            return;
          }
          if (!confirm(`Delete "${d.name}"?`)) return;
          await db.storage.from('documents').remove([d.storage_path]);
          const { error } = await db.from('documents').delete().eq('id', d.id);
          if (error) return toast(error.message, 'err');
          go(folderGroupView(g), { reset: true });
        }
      }
    };
  }

  // ─── CHECKLISTS ─────────────────────────────────────────
  const CHECKLIST_ITEM_TYPES = [
    ['check', 'checklistTypeCheck'],
    ['choice', 'checklistTypeChoice'],
    ['short', 'selectTypeShort'],
    ['text', 'checklistTypeText'],
    ['long', 'selectTypeLong'],
    ['number', 'selectTypeNumber'],
    ['dropdown', 'selectTypeDropdown'],
    ['checkbox', 'selectTypeCheckbox'],
    ['checkboxes', 'selectTypeCheckboxes'],
    ['slider', 'selectTypeSlider'],
  ];
  function checklistGroupView(g) {
    return {
      title: groupName(g), tab: 'groups',
      action: [], // buttons moved into dept row headers
      async render(app) {
        await loadDepartments();
        const q = await fetchGroupItems('checklists', g.id);
        const data = q.data || [];
        const listHost = el('div', { class: 'dept-group-container' });
        app.append(listHost);
        if (!data?.length) {
          const genDept = state.departments.find(d => d.name?.toLowerCase() === 'general') || state.departments[0] || { id: 'general', name: 'General' };
          listHost.append(renderDepartmentRow(
            { id: genDept.id, name: genDept.name, items: [] },
            t('noChecklistsHint') || 'Tap + to build one.',
            [
              importBtn(g, { table: 'checklists', titleOf: c => c.title, onDone: () => go(checklistGroupView(g), { reset: true }) }),
              el('button', { class: 'iconbtn', title: t('newChecklist'), onclick: () => go(checklistEdit(g, null)) }, '+'),
            ]
          ));
          return;
        }
        let rows = data.slice();
        let dragIdx = null;
        const draw = () => {
          listHost.innerHTML = '';
          const depts = state.departments;
          const deptBuckets = depts.map(d => ({ id: d.id, name: d.name, items: [] }));
          const unassignedBucket = { id: 'unassigned', name: t('unassigned') || 'Unassigned', items: [], isUnassigned: true };

          rows.forEach((c, idx) => {
            let itemDepts = normalizeDepartmentIds(c.department_ids);
            if (!itemDepts.length) {
              const genId = generalDepartmentId();
              if (genId) itemDepts = [genId];
            }
            const linked = isLinkedItem(c, g.id);
            const card = libraryCard({
              kind: 'checklist',
              title: c.title,
              meta: t('items', { count: (c.items || []).length }),
              sub: linked ? t('linked') : null,
              className: linked ? 'item-linked' : '',
              image: c.image || firstChecklistImage(c),
              icon: c.icon || null,
              hideKind: true,
              actions: [
                el('button', { class: 'btn btn-ghost', onclick: e => { e.stopPropagation(); go(checklistEdit(g, c)); } }, t('edit')),
                linked ? el('button', { class: 'btn btn-ghost', title: t('removeFromGroup'), onclick: async e => {
                  e.stopPropagation();
                  const { error } = await unlinkItemFromGroup('checklists', c, g.id);
                  if (error) return toast(error.message, 'err');
                  toast(t('removedFromGroup')); go(checklistGroupView(g), { reset: true });
                } }, '×') : null,
              ].filter(Boolean),
            });
            card.setAttribute('draggable', 'true');
            card.addEventListener('dragstart', e => {
              dragIdx = idx;
              e.dataTransfer.effectAllowed = 'move';
              card.classList.add('dragging');
            });
            card.addEventListener('dragend', () => { dragIdx = null; card.classList.remove('dragging'); });
            card.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
            card.addEventListener('drop', async e => {
              e.preventDefault();
              if (dragIdx === null || dragIdx === idx) return;
              const [moved] = rows.splice(dragIdx, 1);
              rows.splice(idx, 0, moved);
              dragIdx = null;
              draw();
              await saveSortOrder('checklists', rows);
            });

            let placed = false;
            if (itemDepts.length) {
              itemDepts.forEach(did => {
                const bucket = deptBuckets.find(b => b.id === did);
                if (bucket) { bucket.items.push(card); placed = true; }
              });
            }
            if (!placed) unassignedBucket.items.push(card);
          });

          const makeRowActions = () => [
            importBtn(g, { table: 'checklists', titleOf: c => c.title, onDone: () => go(checklistGroupView(g), { reset: true }) }),
            el('button', { class: 'iconbtn', title: t('newChecklist'), onclick: () => go(checklistEdit(g, null)) }, '+'),
          ];
          deptBuckets.forEach(b => listHost.append(renderDepartmentRow(b, '', makeRowActions())));
          if (unassignedBucket.items.length > 0) listHost.append(renderDepartmentRow(unassignedBucket, ''));
        };
        draw();
      },
    };
  }

  function checklistEdit(g, existing, draft = null) {
    const existingRecord = existing?.id ? existing : null;
    const source = existingRecord || draft || {};
    return {
      title: existingRecord ? t('editChecklist') : t('newChecklist'), tab: 'groups',
      render(app) {
        const title = el('input', { type: 'text', value: source?.title || '', placeholder: 'Checklist title' });
        const logo = { image: source?.image || null, icon: source?.icon || null };
        let items = (source?.items || []).map(i => ({ ...i }));
        const quota = el('input', { type: 'number', min: '0', step: '1',
          value: source?.daily_quota ?? 0, placeholder: '0' });
        const visibility = departmentPicker(source?.department_ids);

        const freqSel = el('select', {}, [opt('none', t('freqNone')), opt('weekly', t('freqWeekly')), opt('monthly', t('freqMonthly'))]);
        freqSel.value = source?.schedule_frequency || 'none';

        const WEEKDAYS = [['1','Mon'],['2','Tue'],['3','Wed'],['4','Thu'],['5','Fri'],['6','Sat'],['0','Sun']];
        const quotaDays = new Set((source?.quota_weekdays ?? [0,1,2,3,4,5,6]).map(Number));
        const dayRow = el('div', { class: 'weekday-row' }, WEEKDAYS.map(([v, lbl]) => {
          const n = Number(v);
          const b = el('button', { type: 'button', class: 'btn btn-ghost weekday-btn', onclick: () => {
            quotaDays.has(n) ? quotaDays.delete(n) : quotaDays.add(n);
            b.classList.toggle('active');
          } }, lbl);
          if (quotaDays.has(n)) b.classList.add('active');
          return b;
        }));
        let dragIdx = null;
        const list = el('div', {});
        const draw = () => {
          list.innerHTML = '';
          items.forEach((it, idx) => {
            if (!it.type) it.type = 'check';
            if (!it.options) it.options = [];
            if (it.fixOnNo == null && it.type === 'choice' && hasNoOption(it.options)) it.fixOnNo = true;
            const inp = el('input', { type: 'text', value: it.label, placeholder: `Item ${idx + 1}`,
              oninput: e => it.label = e.target.value });
            const typeSel = el('select', { onchange: e => { it.type = e.target.value; draw(); } },
              CHECKLIST_ITEM_TYPES.map(([v, key]) => opt(v, t(key))));
            typeSel.value = it.type;
            const handle = el('span', { class: 'drag-handle', draggable: 'true', title: t('dragReorder') }, '⠿');
            const imageInput = el('input', { type: 'file', accept: 'image/*', onchange: async e => {
              const file = e.target.files?.[0];
              if (!file) return;
              it.image = await fileToDataUrl(file);
              draw();
            } });
            const card = el('div', { class: 'card checklist-builder-card' }, [
              el('div', { class: 'section-head' }, [
                el('div', { style: 'display:flex;align-items:center;gap:8px;min-width:0' }, [
                  handle, el('strong', {}, `${t('checklist')} ${idx + 1}`),
                ]),
                el('button', { class: 'btn btn-danger', onclick: () => { items.splice(idx, 1); draw(); } }, '×'),
              ]),
              labeled(t('label'), inp),
              labeled(t('type'), typeSel),
              labeled(t('itemImage'), fileButton(imageInput)),
            ]);
            if (it.image) {
              card.append(el('div', { class: 'checklist-image-preview' }, [
                el('img', { src: it.image, alt: it.label || t('itemImage'), class: 'incident-photo' }),
                el('button', { class: 'btn btn-danger', onclick: () => { delete it.image; draw(); } }, t('removeImage')),
              ]));
            }
            if (it.type === 'choice' || it.type === 'dropdown' || it.type === 'checkboxes') {
              const optsInp = el('input', { type: 'text', value: (it.options || []).join(', '),
                placeholder: 'Option A, Option B, Option C',
                oninput: e => it.options = e.target.value.split(',').map(s => s.trim()).filter(Boolean) });
              card.append(labeled(t('optionsComma'), optsInp));
            }
            if (it.type === 'slider') {
              if (it.min == null) it.min = 1;
              if (it.max == null) it.max = 5;
              if (it.round == null) it.round = 'nearest';
              const minInp = el('input', { type: 'number', value: it.min, oninput: e => it.min = Number(e.target.value) });
              const maxInp = el('input', { type: 'number', value: it.max, oninput: e => it.max = Number(e.target.value) });
              const leftInp = el('input', { type: 'text', value: it.leftLabel || '',
                placeholder: 'e.g. Not at all', oninput: e => it.leftLabel = e.target.value });
              const rightInp = el('input', { type: 'text', value: it.rightLabel || '',
                placeholder: 'e.g. Very much', oninput: e => it.rightLabel = e.target.value });
              const roundSel = el('select', { onchange: e => it.round = e.target.value }, [
                opt('nearest', t('roundNearest')), opt('up', t('roundUp')),
              ]);
              roundSel.value = it.round;
              card.append(
                el('div', { style: 'display:flex;gap:10px' }, [
                  el('div', { style: 'flex:1' }, labeled(t('sliderMin'), minInp)),
                  el('div', { style: 'flex:1' }, labeled(t('sliderMax'), maxInp)),
                ]),
                labeled(t('sliderLeft'), leftInp),
                labeled(t('sliderRight'), rightInp),
                labeled(t('sliderRound'), roundSel),
              );
            }
            if (it.type === 'choice') {
              const expectedInp = el('input', { type: 'text', value: (it.expectedValues || it.expected?.values || []).join(', '),
                placeholder: 'Yes, OK, Passed',
                oninput: e => it.expectedValues = e.target.value.split(',').map(s => s.trim()).filter(Boolean) });
              const fixOnNo = el('input', { type: 'checkbox', onchange: e => it.fixOnNo = e.target.checked });
              fixOnNo.checked = !!it.fixOnNo;
              card.append(
                labeled(t('expectedValues'), expectedInp),
                labeled(t('fixOnNo'), fixOnNo),
              );
            } else if (it.type === 'number' || it.type === 'slider') {
              const minInp = el('input', { type: 'number', value: it.expectedMin ?? it.expected?.min ?? '',
                oninput: e => it.expectedMin = e.target.value });
              const maxInp = el('input', { type: 'number', value: it.expectedMax ?? it.expected?.max ?? '',
                oninput: e => it.expectedMax = e.target.value });
              card.append(el('div', { class: 'expected-grid' }, [
                labeled(t('expectedMin'), minInp),
                labeled(t('expectedMax'), maxInp),
              ]));
            } else if (['text', 'short', 'long', 'dropdown', 'checkboxes'].includes(it.type)) {
              const expectedInp = el('input', { type: 'text', value: (it.expectedValues || it.expected?.values || []).join(', '),
                placeholder: 'OK, Clean, Complete',
                oninput: e => it.expectedValues = e.target.value.split(',').map(s => s.trim()).filter(Boolean) });
              card.append(labeled(t('expectedValues'), expectedInp));
            } else if (it.type === 'checkbox') {
              const current = it.expectedChecked ?? it.expected?.checked;
              const sel = el('select', { onchange: e => {
                it.expectedChecked = e.target.value === '' ? '' : e.target.value === 'true';
              } }, [
                opt('', '-'),
                opt('true', t('yes')),
                opt('false', t('no')),
              ]);
              sel.value = current === true ? 'true' : current === false ? 'false' : '';
              card.append(labeled(t('expectedChecked'), sel));
            }
            handle.addEventListener('dragstart', e => {
              dragIdx = idx;
              e.dataTransfer.effectAllowed = 'move';
              e.dataTransfer.setData('text/plain', String(idx));
              try { e.dataTransfer.setDragImage(card, 20, 20); } catch (_) {}
              card.classList.add('dragging');
            });
            handle.addEventListener('dragend', () => { card.classList.remove('dragging'); dragIdx = null; });
            card.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
            card.addEventListener('drop', e => {
              e.preventDefault();
              if (dragIdx === null || dragIdx === idx) return;
              const [moved] = items.splice(dragIdx, 1);
              items.splice(idx, 0, moved);
              dragIdx = null;
              draw();
            });
            list.append(card);
          });
        };
        draw();
        app.append(
          labeled(t('title'), title, true),
          labeled(t('profileImage'), logoPicker(logo)),
          visibility.field,
          labeled(t('dailyQuota'), quota),
          labeled(t('quotaDays'), dayRow),
          labeled(t('recurrence'), freqSel),
          list,
          el('button', { class: 'btn btn-ghost btn-block', style: 'margin-bottom:16px',
            onclick: () => { items.push({ id: crypto.randomUUID(), label: '' }); draw(); } }, t('addItem')),
          el('div', { style: 'display:flex;gap:10px;flex-wrap:wrap' }, [
            el('button', { class: 'btn btn-ghost btn-block', onclick: previewChecklist }, 'Preview'),
            el('button', { class: 'btn btn-primary btn-block', onclick: save }, t('saveChecklist')),
          ]),
          existingRecord && g?.id && isLinkedItem(existingRecord, g.id)
            ? el('button', { class: 'btn btn-ghost btn-block', style: 'margin-top:10px', onclick: async () => {
                const { error } = await unlinkItemFromGroup('checklists', existingRecord, g.id);
                if (error) return toast(error.message, 'err');
                toast(t('removedFromGroup')); back();
              } }, t('removeFromGroup'))
            : existingRecord ? el('button', { class: 'btn btn-danger btn-block', style: 'margin-top:10px', onclick: del }, t('deleteChecklist')) : null,
        );
        function cleanItems() {
          return items.filter(i => i.label.trim()).map(i => ({
            id: i.id || crypto.randomUUID(),
            label: i.label.trim(),
            type: i.type || 'check',
            options: ['choice', 'dropdown', 'checkboxes'].includes(i.type) ? (i.options || []).filter(Boolean) : [],
            min: i.type === 'slider' ? Number(i.min ?? 1) : undefined,
            max: i.type === 'slider' ? Number(i.max ?? 5) : undefined,
            leftLabel: i.type === 'slider' ? (i.leftLabel || '') : undefined,
            rightLabel: i.type === 'slider' ? (i.rightLabel || '') : undefined,
            round: i.type === 'slider' ? (i.round || 'nearest') : undefined,
            expected: expectedRule(i),
            fixOnNo: i.type === 'choice' ? (i.fixOnNo ?? hasNoOption(i.options || [])) : false,
            image: i.image || null,
          }));
        }
        function previewChecklist() {
          showChecklistPreview({
            title: title.value.trim() || t('newChecklist'),
            items: cleanItems(),
            daily_quota: Math.max(0, parseInt(quota.value, 10) || 0),
          });
        }
        async function save() {
          const clean = cleanItems();
          if (!title.value.trim() || !clean.length) return toast(t('addTitleAndItem'), 'err');
          const homeGroup = checklistHomeGroup(g, existingRecord);
          if (!homeGroup?.id) return toast('No checklist group found. Create a checklist group first.', 'err');
          const payload = {
            group_id: homeGroup.id, // keep home group when editing a shared/linked item
            title: title.value.trim(),
            items: clean,
            image: logo.image || null,
            icon: logo.icon || null,
            department_ids: visibility.get(),
            daily_quota: Math.max(0, parseInt(quota.value, 10) || 0),
            quota_weekdays: [...quotaDays].sort((a, b) => a - b),
            schedule_frequency: freqSel.value,
          };
          const run = (body) => existingRecord ? db.from('checklists').update(body).eq('id', existingRecord.id)
                             : db.from('checklists').insert(body);
          let { error } = await run(payload);
          if (error && /schedule_frequency/.test(error.message || '')) {
            // Pre-migration DB — save everything else, drop the recurrence field.
            delete payload.schedule_frequency;
            ({ error } = await run(payload));
          }
          if (error) return toast(error.message, 'err');
          toast(t('saved')); back();
        }
        async function del() {
          if (!confirm(t('deleteChecklistConfirm'))) return;
          const { error } = await db.from('checklists').delete().eq('id', existingRecord.id);
          if (error) return toast(error.message, 'err');
          toast(t('deleted')); back();
        }
      },
    };
  }

  function hasNoOption(options) {
    return (options || []).some(o => ['no', 'nei'].includes(String(o).trim().toLowerCase()));
  }

  function expectedRule(item) {
    if (item.type === 'number' || item.type === 'slider') {
      const min = item.expectedMin ?? item.expected?.min;
      const max = item.expectedMax ?? item.expected?.max;
      const rule = {};
      if (min !== '' && min != null && !Number.isNaN(Number(min))) rule.min = Number(min);
      if (max !== '' && max != null && !Number.isNaN(Number(max))) rule.max = Number(max);
      return Object.keys(rule).length ? rule : null;
    }
    if (['choice', 'text', 'short', 'long', 'dropdown', 'checkboxes'].includes(item.type)) {
      const values = (item.expectedValues || item.expected?.values || []).map(v => String(v).trim()).filter(Boolean);
      return values.length ? { values } : null;
    }
    if (item.type === 'checkbox') {
      const checked = item.expectedChecked ?? item.expected?.checked;
      return checked === true || checked === false ? { checked } : null;
    }
    return null;
  }

  // ─── REPORTS / INCIDENTS ────────────────────────────────
  function showChecklistPreview(c) {
    openModal('Preview', (body) => {
      const shell = el('div', { class: 'preview-shell' }, [
        el('h2', { class: 'display preview-title' }, c.title || t('checklist')),
        c.daily_quota ? el('p', { class: 'muted' }, `${t('dailyQuota')}: ${c.daily_quota}`) : null,
      ]);
      const items = c.items || [];
      if (!items.length) {
        shell.append(emptyState(t('noChecklists'), t('addItem')));
      } else {
        shell.append(el('div', { class: 'muted', style: 'margin-bottom:14px' },
          t('checklistProgress', { done: 0, total: items.length })));
        items.forEach((it) => shell.append(checklistPreviewItem(it)));
        shell.append(
          labeled(t('notes'), el('textarea', { placeholder: t('checklistNotesPlaceholder') })),
          el('button', { class: 'btn btn-primary btn-block btn-lg', type: 'button' }, t('completeChecklist')),
        );
      }
      body.append(shell);
    });
  }

  function checklistPreviewItem(it) {
    const type = it.type || 'check';
    const card = el('div', { class: 'card checklist-run-card preview-card' });
    if (it.image) card.append(el('img', { src: it.image, alt: it.label, class: 'checklist-item-image' }));
    if (type === 'check') {
      card.append(el('label', { class: 'check-item' }, [
        el('input', { type: 'checkbox' }),
        el('span', {}, it.label),
      ]));
    } else if (type === 'choice' || type === 'dropdown') {
      card.append(labeled(it.label, el('select', {}, [
        opt('', `- ${t('choose')} -`),
        ...(it.options || []).map(o => opt(o, o)),
      ])));
    } else if (type === 'number') {
      card.append(labeled(it.label, el('input', { type: 'number' })));
    } else if (type === 'short') {
      card.append(labeled(it.label, el('input', { type: 'text' })));
    } else if (type === 'checkbox') {
      card.append(el('label', { class: 'check-item' }, [
        el('input', { type: 'checkbox' }),
        el('span', {}, it.label),
      ]));
    } else if (type === 'checkboxes') {
      card.append(el('div', { class: 'field' }, [
        el('span', {}, it.label),
        el('div', {}, (it.options || []).map(o => el('label', { class: 'check-item' }, [
          el('input', { type: 'checkbox' }),
          el('span', {}, o),
        ]))),
      ]));
    } else if (type === 'slider') {
      card.append(el('div', { class: 'field' }, [
        el('span', {}, it.label),
        previewFieldControl(it),
      ]));
    } else {
      card.append(labeled(it.label, el('textarea', {})));
    }
    card.append(labeled(t('photosOptional'), fileButton(el('input', { type: 'file', accept: 'image/*' }))));
    return card;
  }

  // opts (optional): { reportType, reportTypeName, consequenceId, consequenceName, rootCauseId, rootCauseName } —
  // arriving from a clicked Executive Analytics bar segment; pre-filters the list to
  // reports carrying that type/consequence/root-cause and shows a clearable "Filtered by" chip.
  function reportsGroupView(g, opts = {}) {
    const hasPreset = !!(opts.reportType || opts.consequenceId || opts.rootCauseId);
    return {
      title: groupName(g), tab: 'groups',
      action: isSuperPlus(state.profile) ? el('button', { class: 'iconbtn', title: t('editReportForms'), onclick: () => go(categoriesView()) }, '☰') : null,
      async render(app) {
        await loadProfiles();
        const data = await fetchActiveReports();
        const openByType = { incident: 0, hazard: 0, suggestion: 0 };
        data.filter(i => i.status === 'open').forEach(i => {
          const type = i.report_type || 'incident';
          if (Object.prototype.hasOwnProperty.call(openByType, type)) openByType[type] += 1;
        });
        const canSeeVarsling = isSuperPlus(state.profile) && canAccessVarsling(state.profile);
        const openVarslingCount = canSeeVarsling
          ? await countRows(db.from('varslinger').select('id', { count: 'exact', head: true }).eq('status', 'open'))
          : null;

        const filters = { status: 'all', type: opts.reportType || (hasPreset ? 'all' : 'incident'), assignee: 'all', reporter: 'all' };
        let currentRows = data.slice();

        if (hasPreset) {
          const label = opts.reportTypeName || opts.consequenceName || opts.rootCauseName;
          app.append(el('div', { class: 'kpi-card', style: 'margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap' }, [
            el('span', {}, `${t('filteredBy')}: ${label}`),
            el('button', { class: 'btn btn-ghost', onclick: () => go(reportsGroupView(g), { reset: true }) }, `✕ ${t('clearFilter')}`),
          ]));
        }

        const typeChips = {};
        const typeBar = el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;align-items:center' });
        [
          ['all', t('all')],
          ['incident', t('reportTypeIncidents')],
          ['hazard', t('reportTypeHazards')],
          ['suggestion', t('reportTypeSuggestions')],
        ].forEach(([key, label]) => {
          const chip = el('button', { class: `chip report-type-chip report-type-chip-${key}`, onclick: () => {
            if (opts.reportType && key !== opts.reportType) {
              if (key === 'all') go(reportsGroupView(g), { reset: true });
              else go(reportsGroupView(g, { reportType: key, reportTypeName: label }), { reset: true });
              return;
            }
            filters.type = key; markActive(typeChips, key); apply();
          } }, [label, openByType[key] ? el('span', { class: 'report-type-count' }, String(openByType[key])) : null]);
          typeChips[key] = chip;
          typeBar.append(chip);
        });
        if (canSeeVarsling) {
          typeBar.append(el('button', { class: 'chip report-type-chip report-type-chip-varsling', onclick: () => go(varslingListView()) },
            [t('varsling'), openVarslingCount ? el('span', { class: 'report-type-count' }, String(openVarslingCount)) : null]));
        }

        // Status chips — now with a visible active state.
        const statusChips = {};
        const statusBar = el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' });
        ['all', 'open', 'in_progress', 'resolved'].forEach(s => {
          const chip = el('button', { class: 'chip', onclick: () => {
            filters.status = s; markActive(statusChips, s); apply();
          } }, s === 'all' ? t('all') : statusLabel(s));
          statusChips[s] = chip;
          statusBar.append(chip);
        });

        // Assignee options: only ids that actually appear as an assignee, plus an "unassigned" bucket.
        const assigneeIds = [...new Set(data.map(i => i.assigned_to).filter(Boolean))];
        const assigneeSelect = el('select', { onchange: e => { filters.assignee = e.target.value; apply(); } }, [
          opt('all', t('anyAssignee')),
          opt('unassigned', t('unassigned')),
          ...assigneeIds.map(id => opt(id, labelOf(state.profiles.find(p => p.id === id)))),
        ]);

        // Reporter options: named entries come ONLY from non-anonymous reports, so an
        // anonymous filer is never listed by name. All anonymous reports collapse into
        // one "Anonymous" bucket that can't be traced back to a person.
        const namedReporterIds = [...new Set(data.filter(i => !i.is_anonymous).map(i => i.reporter_id).filter(Boolean))];
        const hasAnon = data.some(i => i.is_anonymous);
        const reporterSelect = el('select', { onchange: e => { filters.reporter = e.target.value; apply(); } }, [
          opt('all', t('anyReporter')),
          ...namedReporterIds.map(id => opt(id, labelOf(state.profiles.find(p => p.id === id)))),
          ...(hasAnon ? [opt('anon', t('anonymous'))] : []),
        ]);

        app.append(el('div', { style: 'display:grid;gap:10px;margin-bottom:14px' }, [
          el('div', { style: 'display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center' }, [
            typeBar,
            el('span', { class: 'filter-divider' }),
            statusBar,
          ]),
          el('div', { style: 'display:flex;gap:10px;flex-wrap:wrap' }, [
            el('div', { style: 'flex:1;min-width:150px' }, labeled(t('filterByAssignee'), assigneeSelect)),
            el('div', { style: 'flex:1;min-width:150px' }, labeled(t('filterByReporter'), reporterSelect)),
          ]),
          el('button', { class: 'btn btn-ghost', style: 'justify-self:start', onclick: () =>
            exportReportsExcel(currentRows, 'reports.xlsx') }, `⬇  ${t('exportExcel')}`),
        ]));

        const listHost = el('div', {});
        app.append(listHost);

        const matchesStatus = (i) => filters.status === 'all' || i.status === filters.status;
        const matchesType = (i) => filters.type === 'all' || (i.report_type || 'incident') === filters.type;
        const matchesAssignee = (i) =>
          filters.assignee === 'all' ? true
            : filters.assignee === 'unassigned' ? !i.assigned_to
              : i.assigned_to === filters.assignee;
        const matchesReporter = (i) =>
          filters.reporter === 'all' ? true
            : filters.reporter === 'anon' ? !!i.is_anonymous
              : (!i.is_anonymous && i.reporter_id === filters.reporter);
        const matchesPreset = (i) =>
          opts.reportType ? (i.report_type || 'incident') === opts.reportType
            : opts.consequenceId ? (i.consequence_ids || []).includes(opts.consequenceId)
            : opts.rootCauseId ? (i.root_cause_ids || []).includes(opts.rootCauseId)
              : true;

        function markActive(group, active) {
          for (const [key, chip] of Object.entries(group)) chip.classList.toggle('on', key === active);
        }

        function apply() {
          currentRows = data.filter(i =>
            matchesStatus(i) && matchesType(i) && matchesAssignee(i) && matchesReporter(i) && matchesPreset(i));
          listHost.innerHTML = '';
          if (!currentRows.length) { listHost.append(el('p', { class: 'muted' }, data.length ? 'Nothing matches these filters.' : t('noIncidentsHint'))); return; }
          for (const i of currentRows) {
            listHost.append(el('div', { class: 'row', onclick: () => go(incidentView(i.id)), style: 'cursor:pointer' }, [
              el('div', { class: 'grow' }, [
                el('div', {}, truncate(i.what_happened, 70)),
                el('div', { class: 'sub' }, `${typeLabel(i.report_type)} · ${reporterOf(i)} · ${fmt(i.created_at)}`),
              ]),
              el('span', { class: `pill ${incidentStatusClass(i)}`, style: incidentStatusStyle(i) }, statusLabel(i.status)),
            ]));
          }
        }

        markActive(typeChips, filters.type);
        markActive(statusChips, 'all');
        apply();
      },
    };
  }
  const typeLabel = (k) => ({ incident: t('incident'), hazard: t('hazard'), suggestion: t('suggestion') }[k] || k || t('incident'));

  // Active (non-archived) reports, with a graceful fallback if the archive column
  // is not present yet (i.e. the migration has not been run).
  async function fetchActiveReports() {
    let q = await db.from('incidents').select('*').eq('archived', false).order('created_at', { ascending: false });
    if (q.error) q = await db.from('incidents').select('*').order('created_at', { ascending: false });
    return (q.data || []).filter(r => !r.deleted_at);
  }
  async function fetchArchivedReports() {
    const q = await db.from('incidents').select('*').eq('archived', true).order('archived_at', { ascending: false });
    return q.error ? [] : (q.data || []).filter(r => !r.deleted_at);
  }

  const REPORT_LOG_COLUMNS = [
    'Type', 'Status', 'What happened', 'Needs fixing', 'Root causes', 'Consequences',
    'Reporter', 'Assigned to', 'Location', 'Occurred', 'Submitted', 'Resolved', 'Archived',
  ];
  const USER_COLUMNS = [
    'Full name', 'Username', 'Email', 'Mobile number', 'Role', 'Approved', 'Temporary password',
  ];

  async function loadXlsx() {
    let XLSX;
    try { XLSX = await import('https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs'); }
    catch (e) { toast(t('excelLibraryLoadFailed'), 'err'); return null; }
    return XLSX;
  }

  function assertExcelHeaders(rows, columns, label) {
    const headers = Object.keys(rows[0] || {});
    const same = headers.length === columns.length && columns.every((c, i) => headers[i] === c);
    if (!same) {
      toast(`${label} import needs these columns, in order: ${columns.join(', ')}`, 'err');
      return false;
    }
    return true;
  }

  async function readExcelRows(file, columns, label) {
    const XLSX = await loadXlsx();
    if (!XLSX) return null;
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: false });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
    if (!rows.length) { toast(t('spreadsheetEmpty'), 'err'); return null; }
    if (!assertExcelHeaders(rows, columns, label)) return null;
    return rows;
  }

  function writeExcel(rows, sheetName, filename) {
    return loadXlsx().then(XLSX => {
      if (!XLSX) return;
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
      XLSX.writeFile(wb, filename);
    });
  }

  // Export a set of reports to a real .xlsx. Reporter identity respects anonymity exactly as the UI does.
  async function exportReportsExcel(rows, filename) {
    if (!rows.length) return toast(t('nothingToExport'), 'err');
    const { data: cats } = await db.from('incident_categories').select('*');
    const catName = (id) => (cats || []).find(c => c.id === id)?.name || id;
    const joinCats = (ids, other) => {
      const names = (ids || []).map(catName);
      if (other) names.push(`${other} (other)`);
      return names.join(', ');
    };
    const sheet = rows.map(i => ({
      Type: typeLabel(i.report_type),
      Status: statusLabel(i.status),
      'What happened': i.what_happened || '',
      'Needs fixing': i.what_wrong || '',
      'Root causes': joinCats(i.root_cause_ids, i.root_cause_other),
      Consequences: joinCats(i.consequence_ids, i.consequence_other),
      Reporter: reporterOf(i),
      'Assigned to': i.assigned_to ? nameOf(i.assigned_to) : '',
      Location: i.location || '',
      Occurred: i.occurred_at ? fmt(i.occurred_at) : '',
      Submitted: fmt(i.created_at),
      Resolved: i.resolved_at ? fmt(i.resolved_at) : '',
      Archived: i.archived_at ? fmt(i.archived_at) : '',
    }));
    await writeExcel(sheet, 'Reports', filename);
  }

  async function importReportLogsExcel(file, refreshView) {
    const rows = await readExcelRows(file, REPORT_LOG_COLUMNS, 'Report logs');
    if (!rows) return;
    await loadProfiles(true);
    const profileByLabel = new Map();
    state.profiles.forEach(p => {
      [p.email, p.full_name, p.username, labelOf(p)].filter(Boolean)
        .forEach(v => profileByLabel.set(String(v).trim().toLowerCase(), p));
    });
    const statusFromLabel = (v) => {
      const s = String(v || '').trim().toLowerCase();
      if (!s || s === t('open').toLowerCase()) return 'open';
      if (s === t('inProgress').toLowerCase() || s === 'in progress') return 'in_progress';
      if (s === t('resolved').toLowerCase()) return 'resolved';
      return ['open', 'in_progress', 'resolved'].includes(s) ? s : null;
    };
    const typeFromLabel = (v) => {
      const s = String(v || '').trim().toLowerCase();
      if (!s || s === t('incident').toLowerCase()) return 'incident';
      if (s === t('hazard').toLowerCase()) return 'hazard';
      if (s === t('suggestion').toLowerCase()) return 'suggestion';
      return ['incident', 'hazard', 'suggestion'].includes(s) ? s : null;
    };
    const isoOrNull = (v) => {
      const raw = String(v || '').trim();
      if (!raw) return null;
      const d = new Date(raw);
      return Number.isNaN(d.getTime()) ? null : d.toISOString();
    };
    const payload = [];
    for (const [idx, r] of rows.entries()) {
      const report_type = typeFromLabel(r.Type);
      const status = statusFromLabel(r.Status);
      if (!report_type || !status || !String(r['What happened'] || '').trim()) {
        return toast(`Row ${idx + 2} has an invalid type, status, or missing "What happened".`, 'err');
      }
      const reporterKey = String(r.Reporter || '').trim().toLowerCase();
      const assigneeKey = String(r['Assigned to'] || '').trim().toLowerCase();
      const reporter = profileByLabel.get(reporterKey);
      const assignee = profileByLabel.get(assigneeKey);
      payload.push({
        reporter_id: reporter?.id || state.profile.id,
        report_type,
        status,
        what_happened: String(r['What happened'] || '').trim(),
        what_wrong: String(r['Needs fixing'] || '').trim() || null,
        root_cause_ids: [],
        consequence_ids: [],
        root_cause_other: String(r['Root causes'] || '').trim() || null,
        consequence_other: String(r.Consequences || '').trim() || null,
        assigned_to: assignee?.id || null,
        location: String(r.Location || '').trim() || null,
        occurred_at: isoOrNull(r.Occurred),
        created_at: isoOrNull(r.Submitted) || new Date().toISOString(),
        resolved_at: isoOrNull(r.Resolved),
        archived: true,
        archived_at: isoOrNull(r.Archived) || new Date().toISOString(),
        archived_by: state.profile.id,
        is_anonymous: reporterKey === t('anonymous').toLowerCase(),
      });
    }
    const { error } = await db.from('incidents').insert(payload);
    if (error) return toast(error.message + ' - run migration_report_types_archive.sql if archive columns are missing.', 'err');
    toast(`${payload.length} report log${payload.length === 1 ? '' : 's'} imported.`);
    refreshView();
  }
  const statusLabel = (s) => ({ open: t('open'), in_progress: t('inProgress'), resolved: t('resolved') }[s] || s);
  function incidentStatusClass(inc) {
    const hasConsequences = (inc.consequence_ids || []).length > 0 || !!inc.consequence_other;
    return inc.status === 'open' && hasConsequences ? 'open-consequence' : inc.status;
  }
  function incidentStatusStyle(inc) {
    const colors = {
      resolved: ['#2f9e5b', '#ffffff'],
      in_progress: ['#2f80ed', '#ffffff'],
      open: ['#f2c94c', '#17212b'],
      open_consequence: ['#d43c32', '#ffffff'],
    };
    const key = incidentStatusClass(inc).replace('-', '_');
    const [bg, fg] = colors[key] || ['#8a94a6', '#ffffff'];
    return `background:${bg};color:${fg};border-color:${bg}`;
  }

  async function renderIncidentPhotos(host, inc) {
    const paths = inc.photo_paths || [];
    if (!paths.length) return;
    const grid = el('div', { class: 'photo-grid' });
    host.append(el('div', { class: 'card' }, [
      el('h3', {}, t('attachments')),
      grid,
    ]));
    const urls = await signedUrls('incident-photos', paths, 300);
    for (const path of paths) {
      const src = urls.get(path);
      if (src) grid.append(el('img', { src, alt: t('attachments'), class: 'incident-photo' }));
    }

  async function appendIncidentActionPhotos(host, paths = []) {
    if (!paths.length) return;
    const grid = el('div', { class: 'photo-grid photo-grid-compact' });
    host.append(grid);
    const urls = await signedUrls('incident-photos', paths, 300);
    for (const path of paths) {
      const src = urls.get(path);
      if (src) grid.append(el('img', { src, alt: t('attachments'), class: 'incident-photo' }));
    }
  }

  function customFieldsCard(values) {
    const entries = Object.entries(values || {}).filter(([, v]) => Array.isArray(v) ? v.length : v !== null && v !== undefined && v !== '');
    if (!entries.length) return null;
    return el('div', { class: 'card' }, [
      el('h3', {}, t('customFields')),
      ...entries.map(([key, value]) => el('div', { class: 'report-custom-line' }, [
        el('span', { class: 'muted' }, key),
        el('strong', {}, Array.isArray(value) ? value.join(', ') : value === true ? 'Yes' : value === false ? 'No' : String(value)),
      ])),
    ]);
  }

  function incidentView(id) {
    return {
      title: t('reports'), tab: 'groups',
      async render(app) {
        const { data: inc, error: incErr } = await db.from('incidents').select('*').eq('id', id).single();
        if (incErr || !inc) return app.append(emptyState(t('error'), t('noReports')));
        const { data: cats } = await db.from('incident_categories').select('*');
        const catName = (cid) => (cats || []).find(c => c.id === cid)?.name || '—';
        const { data: actions } = await db.from('incident_actions').select('*').eq('incident_id', id).order('created_at');

        // summary card
        app.append(el('div', { class: 'card' }, [
          el('div', { class: 'section-head' }, [
            el('h3', {}, typeLabel(inc.report_type)),
            el('span', { class: `pill ${incidentStatusClass(inc)}`, style: incidentStatusStyle(inc) }, statusLabel(inc.status)),
          ]),
          el('p', {}, inc.what_happened),
          inc.what_wrong ? el('h3', { style: 'margin-top:14px' }, t('whatNeedsFixing')) : null,
          inc.what_wrong ? el('p', {}, inc.what_wrong) : null,
          tagLine(t('rootCause'), (inc.root_cause_ids || []).map(catName), inc.root_cause_other),
          tagLine(t('consequence'), (inc.consequence_ids || []).map(catName), inc.consequence_other),
          el('hr', { class: 'soft' }),
          el('div', { class: 'muted', style: 'font-size:.82rem;line-height:1.7' }, [
            el('div', {}, `Reported by: ${reporterOf(inc)}`),
            el('div', {}, `Occurred: ${inc.occurred_at ? fmt(inc.occurred_at) : '—'}`),
            el('div', {}, `Location: ${inc.location || '—'}`),
            el('div', {}, `Submitted: ${fmt(inc.created_at)}`),
          ]),
        ]));
        const customCard = customFieldsCard(inc.custom_fields);
        if (customCard) app.append(customCard);
        await renderIncidentPhotos(app, inc);

        // processing controls — status as open/close buttons
        const setStatus = async (next) => {
          const patch = { status: next,
            resolved_at: next === 'resolved' ? new Date().toISOString() : null };
          const { error } = await db.from('incidents').update(patch).eq('id', id);
          if (error) return toast(error.message, 'err');
          toast(next === 'resolved' ? t('resolved') : t('open')); refresh();
        };
        const statusBtn = (next, label) => el('button', {
          class: 'btn ' + (inc.status === next ? 'btn-primary' : 'btn-ghost'),
          onclick: () => setStatus(next),
        }, label);

        const assigneeOptions = assignableIncidentProfiles();
        const canSeeCurrentAssignee = !inc.assigned_to || assigneeOptions.some(p => p.id === inc.assigned_to);
        const assign = el('select', {}, [opt('', `— ${t('unassigned')} —`), ...assigneeOptions.map(p => opt(p.id, labelOf(p)))]);
        assign.value = inc.assigned_to || '';
        app.append(el('div', { class: 'card' }, [
          el('h3', {}, t('processing')),
          el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px' }, [
            statusBtn('open', t('open')),
            statusBtn('in_progress', t('inProgress')),
            statusBtn('resolved', t('closeCase')),
          ]),
          labeled(t('assignedTo'), assign),
          el('button', { class: 'btn btn-ghost', onclick: async () => {
            if (!canSeeCurrentAssignee && !assign.value) return toast(t('chooseVisibleAssignee'), 'err');
            const { error } = await db.from('incidents').update({ assigned_to: assign.value || null }).eq('id', id);
            if (error) return toast(error.message, 'err');
            toast(t('assignmentSaved'));
          } }, t('saveAssignment')),
          el('button', { class: 'btn btn-ghost', style: 'margin-left:8px', onclick: () => actionModal(null, {
            title: (inc.what_wrong || '').slice(0, 120),
            description: inc.what_happened,
            source_kind: 'incident', source_id: id,
            assigned_to: inc.assigned_to || '',
          }) }, t('createAction')),
        ]));

        // action log
        const note = el('textarea', { placeholder: t('actionNotePlaceholder') });
        const log = el('div', {});
        for (const a of actions || []) {
          const item = el('div', { class: `timeline-note${a.user_addendum ? ' user-addendum' : ''}` }, [
            el('div', { class: 'when' }, `${nameOf(a.author_id)} · ${fmt(a.created_at)}${a.user_addendum ? ` · ${t('workerAddendum')}` : ''}`),
            el('div', {}, a.note),
          ]);
          log.append(item);
          await appendIncidentActionPhotos(item, a.photo_paths || []);
        }
        if (!actions?.length) log.append(el('p', { class: 'muted' }, t('noActionsLoggedYet')));
        app.append(el('div', { class: 'card' }, [
          el('h3', {}, t('actionLog')), log, el('hr', { class: 'soft' }),
          labeled(t('addActionNote'), note),
          el('button', { class: 'btn btn-ghost', onclick: async () => {
            if (!note.value.trim()) return;
            const { error } = await db.from('incident_actions').insert({
              incident_id: id, author_id: state.profile.id, note: note.value.trim() });
            if (error) return toast(error.message, 'err');
            refresh();
          } }, t('addToLog')),
        ]));

        // final report
        const fr = el('textarea', { placeholder: t('outcomePlaceholder'), style: 'min-height:140px' });

  const REPORT_FORM_TYPES = [
    ['incident', 'reportIncident'],
    ['hazard', 'reportHazard'],
    ['suggestion', 'reportSuggestion'],
    ['varsling', 'varsling'],
  ];
  function reportFormStorageKey(type) { return `reportForm:${type}`; }
  function readLocalReportFields(type) {
    const value = storageJson(reportFormStorageKey(type), []);
    return Array.isArray(value) ? value : [];
  }
  async function loadReportFormFields(type) {
    if (cache.reportFields.has(type) && fresh(cache.reportFieldsAt.get(type))) return cache.reportFields.get(type);
    const { data, error } = await db.from('report_form_configs').select('fields').eq('report_type', type).maybeSingle();
    if (error) {
      if (!missingOptionalTable(error)) toast(error.message, 'err');
      return readLocalReportFields(type);
    }
    const fields = Array.isArray(data?.fields) ? data.fields : readLocalReportFields(type);
    cache.reportFields.set(type, fields);
    cache.reportFieldsAt.set(type, Date.now());
    return fields;
  }
  async function saveReportFormFields(type, fields) {
    setStorageJson(reportFormStorageKey(type), fields);
    const payload = {
      report_type: type,
      fields,
      updated_by: state.profile.id,
      updated_at: new Date().toISOString(),
    };
    const { error } = await db.from('report_form_configs').upsert(payload, { onConflict: 'report_type' });
    if (error) {
      if (missingOptionalTable(error)) {
        toast(t('reportFormMigrationNeeded'), 'err');
        return true;
      }
      toast(error.message, 'err');
      return false;
    }
    cache.reportFields.set(type, fields);
    cache.reportFieldsAt.set(type, Date.now());
    return true;
  }

        type: f.type || 'short',
        label: f.label.trim(),
        required: !!f.required,
        options: f.type === 'dropdown' || f.type === 'checkboxes' ? (f.options || []) : [],
        min: f.type === 'slider' ? Number(f.min ?? 1) : undefined,
        max: f.type === 'slider' ? Number(f.max ?? 5) : undefined,
        leftLabel: f.type === 'slider' ? (f.leftLabel || '') : undefined,
        rightLabel: f.type === 'slider' ? (f.rightLabel || '') : undefined,
        round: f.type === 'slider' ? (f.round || 'nearest') : undefined,
        expected: expectedRule(f),
      }));

  function previewFieldControl(f) {
    if (f.type === 'long') return el('textarea', {});

      return el('select', {}, [opt('', `- ${t('choose')} -`), ...(f.options || []).map(o => opt(o, o))]);

    if (f.type === 'checkbox') {

        el('span', {}, f.label + (f.required ? ' *' : '')),

    if (f.type === 'checkboxes') {

        el('input', { type: 'checkbox' }),
        el('span', {}, o),

    if (f.type === 'slider') {

      const valueOut = el('div', { style: 'font-weight:750;font-size:1.25rem;text-align:center;margin-bottom:4px' }, String(round(min)));

  function reportFormDesignerView() {

              el('button', { class: 'btn btn-primary', onclick: save }, t('saveReportForm')),

  // ─── DOCUMENTS ──────────────────────────────────────────
  function documentsGroupView(g) {

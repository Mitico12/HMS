            el('div', { class: 'section-head', style: 'margin-bottom:8px; display:flex; justify-content:space-between; align-items:center' }, [
              el('div', { style: 'display:flex; align-items:center' }, [
                iconEl,
                el('h3', { style: 'margin:0; font-size:1.15rem; font-weight:600' }, d.name)
              ]),
              el('div', { style: 'display:flex; gap:6px; align-items:center' }, [
                isGeneral ? el('span', { class: 'pill', style: 'background:var(--primary);color:var(--primary-ink);margin-right:4px' }, t('defaultDepartment')) : null,
                el('button', {
                  class: 'btn btn-ghost btn-sm',
                  style: 'padding:4px 8px;font-size:0.82rem;font-weight:600',
                  onclick: () => openDepartmentVisibilityModal(d)
                }, t('visibility')),
                !isGeneral ? el('button', {
                  class: 'btn btn-ghost btn-sm',
                  style: 'color:var(--danger);padding:4px 8px;font-size:0.82rem;font-weight:600',
                  title: t('deleteDepartment'),
                  onclick: () => deleteDept(d)
                }, t('deleteAction')) : null
              ])
            ]),
            el('p', { class: 'muted', style: 'font-size:0.84rem; margin:0 0 12px 0; line-height:1.4' }, isGeneral ? t('generalDepartmentHint') : t('departmentMembershipHint')),
            usersList,
            assignBtn
          ]);

          grid.append(card);
        }
      },
    };
  }

  // Map any role (incl. legacy super_admin) to its colour-class suffix.
  const roleClass = (r) => 'role-' + (r === 'super_admin' ? 'sysadmin' : r);

  function userCard(p) {
    const meta = [
      maskEmail(p.email) || 'No email',
      p.username ? `@${p.username}` : null,
      p.mobile_number || null,
      departmentLabelsForUser(p.id),
      roleName(p.role).toLowerCase(),
      p.role === 'user' ? (p.is_verified ? 'approved' : 'awaiting approval') : null,
    ].filter(Boolean).join(' · ');
    return el('div', { class: `user-card ${roleClass(p.role)}`, onclick: () => go(userDetailView(p.id)) }, [
      el('div', { class: 'user-main' }, [
        el('div', { class: 'user-name' }, [
          el('span', { class: `role-dot ${roleClass(p.role)}`, title: roleName(p.role) }),
          labelOf(p),
        ]),
        el('div', { class: 'user-meta' }, meta),
      ]),
      el('div', { class: 'user-actions' }, accessControls(p)),
    ]);
  }

  function roleLegend() {
    const items = [['user', t('roleUser')], ['verneombud', t('roleVerneombud')], ['admin', t('roleAdmin')],
      ['superuser', t('roleSuperuser')], ...(isSysadmin(state.profile) ? [['sysadmin', t('roleSysadmin')]] : [])];
    return el('div', { class: 'role-legend' }, items.map(([r, label]) =>
      el('span', {}, [el('i', { class: `role-dot ${roleClass(r)}` }), label])));
  }

  function roleName(r) {
    return ({ user: t('roleUser'), verneombud: t('roleVerneombud'), admin: t('roleAdmin'),
      superuser: t('roleSuperuser'), sysadmin: t('roleSysadmin'), super_admin: t('roleSysadmin') }[r] || r);
  }
  // Roles the current user may assign: strictly below own rank (sys-admins may assign any).
  function assignableRoles() {
    const all = ['user', 'verneombud', 'admin', 'superuser', 'sysadmin'];
    if (isSysadmin(state.profile)) return all;
    return all.filter(r => roleRank(r) < roleRank(state.profile));
  }

  function accessControls(p) {
    const me = state.profile;
    const controls = [];
    if (p.id === me.id) {
      controls.push(el('span', { class: 'pill you' }, 'you'));
      return controls;
    }

    // Suspended accounts (under sys-admin review) show a badge; any sys-admin may recover them.
    if (isSuspended(p)) {
      controls.push(el('span', { class: 'pill', style: 'background:#a32d2d;color:#fff;border-color:#a32d2d' }, t('suspended')));
      if (isSysadmin(me)) controls.push(el('button', { class: 'btn btn-primary', onclick: e => {
        e.stopPropagation();
        if (confirm(`Lift the suspension on ${labelOf(p)}? Only do this once their account is confirmed secure.`))
          setSuspension(p, false);
      } }, t('unsuspend')));
      return controls;
    }

    // May I change this person's role? Only on strictly-lower-ranked targets
    // (sys-admins may manage anyone), and the options are what I'm allowed to assign.
    const canManage = isSysadmin(me) || (isAdminPlus(me) && roleRank(me) > roleRank(p));
    const options = assignableRoles();
    if (canManage && options.length) {
      const choices = options.includes(p.role) ? options : [p.role, ...options];
      const sel = el('select', { onclick: e => e.stopPropagation(), onchange: e => setProfileRole(p, e.target.value) },
        choices.map(r => opt(r, roleName(r))));
      sel.value = p.role;
      controls.push(sel);
    } else {
      controls.push(el('span', { class: 'muted', style: 'font-size:.85rem' }, roleName(p.role)));
    }

    // Approve / revoke access only for strictly-lower-ranked accounts (same gate
    // as role changes) so peers can't revoke each other (admin lockout). Sys-admins
    // may act on anyone; a sys-admin↔sys-admin action routes to the review flow.
    if (canManage) {
      const revoking = p.is_verified;
      controls.push(el('button', {
        class: 'btn ' + (revoking ? 'btn-danger' : 'btn-primary'),
        onclick: e => {
          e.stopPropagation();
          if (revoking && !confirm(`Revoke access for ${labelOf(p)}? They will lose access to both apps.`)) return;
          setProfileVerification(p, !p.is_verified);
        },
      }, revoking ? 'Revoke' : 'Approve'));
    }
    return controls;
  }

  // A sys-admin acting on a fellow sys-admin must go through the two-person review.
  const isSysadminPair = (p) => isSysadmin(state.profile) && isSysadmin(p) && p.id !== state.profile.id;

  function openSysadminReasonModal(p, actionType, newRole) {
    openModal(t('sysadminReviewTitle'), (body, close) => {
      const reason = el('textarea', { rows: 3 });
      body.append(
        el('p', { class: 'muted', style: 'margin:0 0 8px' }, t('sysadminReviewBody')),
        labeled(t('reason'), reason, true),
        el('button', { class: 'btn btn-danger btn-block', style: 'margin-top:8px', onclick: async () => {
          if (!reason.value.trim()) return toast(t('reason'), 'err');
          const { error } = await db.rpc('request_sysadmin_action', {
            target: p.id, action_type: actionType, new_role: newRole || null, reason: reason.value.trim() });
          if (error) return toast(error.message, 'err');
          close(); toast(t('bothSuspended'));
          location.reload(); // the initiator is now suspended → lands on the suspended screen
        } }, actionType === 'role_change' ? `${roleName(newRole)}` : t('revoke')),
      );
    });
  }

  async function setProfileRole(p, newRole) {
    if (isSysadminPair(p)) return openSysadminReasonModal(p, 'role_change', newRole);
    const { error } = await db.rpc('set_role', { target: p.id, new_role: newRole });
    if (error) return toast(error.message, 'err');
    toast(`${labelOf(p)} → ${roleName(newRole)}.`);
    await loadProfiles(true); refresh();
  }
  async function setProfileVerification(p, verified) {
    if (!verified && isSysadminPair(p)) return openSysadminReasonModal(p, 'revoke', null);
    const { error } = await db.rpc('set_verification', { target: p.id, verified });
    if (error) return toast(error.message, 'err');
    toast(verified ? 'Account approved.' : 'Access revoked.');
    await loadProfiles(true); refresh();
  }
  async function setSuspension(p, suspended) {
    const { error } = await db.rpc('set_suspension', { target: p.id, suspended });
    if (error) return toast(error.message, 'err');
    toast(suspended ? t('suspended') + '.' : t('unsuspend') + '.');
    await loadProfiles(true); refresh();
  }
  async function setVarslingAccess(p, v) {
    const { error } = await db.rpc('set_varsling_access', { target: p.id, v });
    if (error) return toast(error.message, 'err');
    toast(v ? t('varslingAccessGranted') : t('varslingAccessRevoked'));
    await loadProfiles(true); refresh();
  }

  function userDetailView(id) {
    return {
      title: 'User', tab: 'groups',
      async render(app) {
        await loadProfiles();
        const p = state.profiles.find(x => x.id === id);
        if (!p) return app.append(emptyState('User not found', 'The account may have been removed.'));
        const pending = await loadProfileChangeRequests(id, true);
        const allRequests = await loadProfileChangeRequests(id, false);
        const logs = await loadEmailLog(id);
        const courseStatus = await loadUserCourseStatus(id);
        const checklistStatus = await loadUserChecklistStatus(id);

        app.append(el('div', { class: 'card' }, [
          el('div', { class: 'section-head' }, [el('h3', {}, labelOf(p)), ...accessControls(p)]),
          el('div', { class: 'detail-grid' }, [
            kv('Name', displayName(p) || (p.full_name ? maskEmail(p.full_name) : '—')),
            kv('Username', p.username ? `@${p.username}` : '—'),
            emailKv(p),
            kv('Mobile', p.mobile_number || '—'),
            kv(t('departments'), departmentLabelsForUser(p.id)),
            kv('Access', `${roleName(p.role)}${p.role === 'user' ? (p.is_verified ? ' · approved' : ' · awaiting approval') : ''}`),
          ]),
        ]));

        // Varsling access — superusers+ may grant it to admin-and-above accounts.
        if (isSuperPlus(state.profile) && isAdminPlus(p) && p.id !== state.profile.id) {
          const toggle = el('input', { type: 'checkbox' });
          toggle.checked = !!p.can_access_varsling;
          toggle.addEventListener('change', () => setVarslingAccess(p, toggle.checked));
          app.append(el('div', { class: 'card' }, [
            el('h3', {}, t('varslingAccess')),
            el('p', { class: 'muted', style: 'margin:4px 0 10px' }, t('varslingDesc')),
            el('label', { class: 'check-item' }, [toggle, el('span', {}, t('varslingAccess'))]),
          ]));
        }

        app.append(userCoursesCard(p, courseStatus));
        app.append(userChecklistsCard(p, checklistStatus));

        app.append(el('div', { class: 'card' }, [
          el('h3', {}, 'Pending profile changes'),
          pending.length ? null : el('p', { class: 'muted' }, 'No pending changes.'),
          ...pending.map(r => changeRequestCard(r, { embedded: true })),
        ]));

        app.append(el('div', { class: 'card' }, [
          el('h3', {}, 'Previous emails'),
          logs.length ? null : el('p', { class: 'muted' }, 'No previous email changes recorded.'),
          ...logs.map(l => el('div', { class: 'email-log-item' }, [
            el('div', {}, `${maskEmail(l.old_email) || '—'} → ${maskEmail(l.new_email) || '—'}`),
            el('div', { class: 'sub' }, `${fmt(l.changed_at)}${l.source ? ` · ${l.source}` : ''}`),
          ])),
        ]));

        const past = allRequests.filter(r => r.status !== 'pending').slice(0, 8);
        if (past.length) app.append(el('div', { class: 'card' }, [
          el('h3', {}, 'Change request history'),
          ...past.map(r => changeRequestCard(r, { embedded: true, readOnly: true })),
        ]));
      },
    };
  }

  async function loadUserCourseStatus(userId) {
    const { data: courses = [] } = await db.from('courses').select('*').order('title');
    const { data: submissions = [] } = await db.from('course_submissions')
      .select('*').eq('user_id', userId).order('created_at', { ascending: false });
    let assignments = [];
    const assignQ = await db.from('course_assignments').select('*').eq('user_id', userId).order('assigned_at', { ascending: false });
    if (!assignQ.error) assignments = assignQ.data || [];
    return { courses: courses || [], submissions: submissions || [], assignments };
  }

  function latestSubmissionByCourse(submissions) {
    const map = new Map();
    submissions.forEach(s => { if (!map.has(s.course_id)) map.set(s.course_id, s); });
    return map;
  }

  function userCoursesCard(user, status) {
    const { courses, submissions, assignments } = status;
    const latest = latestSubmissionByCourse(submissions);
    const assignedIds = new Set(assignments.map(a => a.course_id));
    const completed = submissions.filter(s => s.passed);
    const unassigned = courses.filter(c => !assignedIds.has(c.id));
    const select = el('select', {}, [
      opt('', courses.length ? 'Choose course' : 'No courses available'),
      ...unassigned.map(c => opt(c.id, c.title)),
    ]);
    const rows = courses.map(c => {
      const sub = latest.get(c.id);
      const assigned = assignments.find(a => a.course_id === c.id);
      return el('div', { class: 'row' }, [
        el('div', { class: 'grow' }, [
          el('div', {}, c.title),
          el('div', { class: 'sub' }, [
            assigned ? `Assigned ${fmt(assigned.assigned_at)}` : 'Not assigned',
            sub ? `Latest: ${sub.score}% ${sub.passed ? 'passed' : 'failed'} · ${fmt(sub.created_at)}` : 'No attempts',
          ].join(' - ')),
        ]),
        sub?.passed ? el('span', { class: 'pill', style: 'background:#2f9e5b;color:#fff;border-color:#2f9e5b' }, 'Completed') : null,
        assigned ? el('button', { class: 'btn btn-ghost', onclick: () => unassignCourse(user.id, assigned.id) }, 'Unassign') : null,
      ]);
    });
    return el('div', { class: 'card' }, [
      el('div', { class: 'section-head' }, [
        el('h3', {}, 'Courses'),
        el('span', { class: 'muted' }, `${completed.length} completed`),
      ]),
      el('div', { class: 'kpi-grid', style: 'margin-bottom:12px' }, [
        metricCard({ label: 'Assigned', value: assignments.length }),
        metricCard({ label: t('completedCourses'), value: new Set(completed.map(s => s.course_id)).size }),
        metricCard({ label: 'Attempts', value: submissions.length }),
        metricCard({ label: t('courses'), value: courses.length }),
      ]),
      el('div', { style: 'display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px' }, [
        el('div', { style: 'flex:1;min-width:180px' }, labeled('Assign course', select)),
        el('button', { class: 'btn btn-primary', onclick: () => assignCourse(user.id, select.value) }, 'Assign'),
      ]),
      rows.length ? el('div', {}, rows) : el('p', { class: 'muted' }, 'No courses found.'),
    ]);
  }

  async function assignCourse(userId, courseId) {
    if (!courseId) return toast(t('chooseCourseFirst'), 'err');
    const { error } = await db.from('course_assignments').insert({ user_id: userId, course_id: courseId, assigned_by: state.profile.id });
    if (error) return toast(error.message + ' - run migration_course_assignments.sql first.', 'err');
    toast(t('courseAssigned'));
    refresh();
  }

  async function unassignCourse(userId, assignmentId) {
    if (!confirm('Remove this course assignment?')) return;
    const { error } = await db.from('course_assignments').delete().eq('id', assignmentId);
    if (error) return toast(error.message, 'err');
    toast(t('assignmentRemoved'));
    refresh();
  }

  async function loadUserChecklistStatus(userId) {
    const { data: checklists = [] } = await db.from('checklists')
      .select('id,title,daily_quota,quota_weekdays').order('title');
    const { data: runs = [] } = await db.from('checklist_runs')
      .select('id,checklist_id,submitted_at,completed')
      .eq('user_id', userId).not('submitted_at', 'is', null)
      .order('submitted_at', { ascending: false });
    let assignments = [];
    const aq = await db.from('checklist_assignments').select('*')
      .eq('user_id', userId).order('assigned_at', { ascending: false });
    if (!aq.error) assignments = aq.data || [];
    return { checklists: checklists || [], runs: runs || [], assignments };
  }

  function userChecklistsCard(user, status) {
    const { checklists, runs, assignments } = status;
    const titleOf = (id) => checklists.find(c => c.id === id)?.title || '—';
    const today = localDateString(new Date());
    const completedRuns = runs.filter(r => r.completed);
    const dailyComplete = completedRuns.filter(r => localDateString(new Date(r.submitted_at)) === today).length;
    const assignedIds = new Set(assignments.map(a => a.checklist_id));
    const unassigned = checklists.filter(c => !assignedIds.has(c.id));

    // Left half — what this user has been assigned to do, plus an "assign more" popup.
    const assignedPanel = el('div', { class: 'kpi-card' });
    assignedPanel.append(el('div', { class: 'section-head', style: 'margin-bottom:8px' }, [
      el('div', { class: 'kpi-label' }, t('assignedToDo')),
      el('button', { class: 'btn btn-ghost btn-sm', onclick: () => openAssignChecklistsModal(user.id, unassigned) }, `+ ${t('assign')}`),
    ]));
    if (!assignments.length) assignedPanel.append(el('p', { class: 'miss-sub' }, t('nothingAssignedYet')));
    else assignments.forEach(a => {
      const last = runs.find(r => r.checklist_id === a.checklist_id);
      assignedPanel.append(el('div', { class: 'miss-row' }, [
        el('div', { class: 'miss-top' }, [
          el('span', { style: 'flex:1' }, titleOf(a.checklist_id)),
          el('button', { class: 'btn btn-ghost btn-sm', onclick: () => unassignChecklist(a.id) }, t('deleteAction')),
        ]),
        el('p', { class: 'miss-sub' }, `${t('assigned')} ${fmt(a.assigned_at)}${last ? ` · ${t('lastSubmitted')} ${fmt(last.submitted_at)}` : ` · ${t('noSubmissions')}`}`),
      ]));
    });

    // Right half — the user's most recent submissions.
    const latestPanel = el('div', { class: 'kpi-card' });
    latestPanel.append(el('div', { class: 'kpi-label', style: 'margin-bottom:8px' }, t('latestSubmitted')));
    if (!runs.length) latestPanel.append(el('p', { class: 'miss-sub' }, t('noSubmissionsYet')));
    else runs.slice(0, 8).forEach(r => latestPanel.append(el('div', { class: 'miss-row' }, [
      el('div', { class: 'miss-top' }, [
        el('span', { style: 'flex:1' }, titleOf(r.checklist_id)),
        el('span', { class: 'time-pill' }, fmt(r.submitted_at)),
      ]),
      el('p', { class: 'miss-sub' }, r.completed ? `✓ ${t('completed')}` : t('inProgress')),
    ])));

    return el('div', { class: 'card' }, [
      el('div', { class: 'section-head' }, [
        el('h3', {}, 'Checklists'),
        el('span', { class: 'muted' }, `${completedRuns.length} completed`),
      ]),
      el('div', { class: 'kpi-grid', style: 'margin-bottom:4px' }, [
        metricCard({ label: 'Assigned', value: assignments.length }),
        metricCard({ label: 'Daily complete', value: dailyComplete }),
        metricCard({ label: 'Total complete', value: completedRuns.length }),
      ]),
      el('div', { class: 'profile-split' }, [assignedPanel, latestPanel]),
    ]);
  }

  function openAssignChecklistsModal(userId, unassigned) {
    openModal('Assign checklists', (body, close) => {
      if (!unassigned.length) {
        body.append(el('p', { class: 'muted', style: 'margin-top:0' }, 'All checklists are already assigned.'));
        return;
      }
      body.append(el('p', { class: 'muted', style: 'margin-top:0' }, 'Pick the checklists this user should complete.'));
      const picked = new Set();
      unassigned.forEach(c => {
        const box = el('input', { type: 'checkbox', value: c.id });
        box.addEventListener('change', () => box.checked ? picked.add(c.id) : picked.delete(c.id));
        body.append(el('label', { class: 'check-item' }, [box, el('span', {}, c.title)]));
      });
      body.append(el('button', { class: 'btn btn-primary btn-block', style: 'margin-top:14px', onclick: () => {
        if (!picked.size) return toast('Choose at least one checklist', 'err');
        close();
        assignChecklists(userId, [...picked]);
      } }, 'Assign selected'));
    });
  }

  async function assignChecklists(userId, checklistIds) {
    if (!checklistIds.length) return toast('Choose at least one checklist', 'err');
    const rows = checklistIds.map(id => ({ user_id: userId, checklist_id: id, assigned_by: state.profile.id }));
    const { error } = await db.from('checklist_assignments').insert(rows);
    if (error) return toast(error.message + ' — run migration_checklist_assignments.sql first.', 'err');
    db.functions.invoke('send-push', { body: {
      user_ids: [userId], title: t('newChecklistAssigned'), url: './user.html',
    } }).then(() => {}, () => {});
    toast('Checklist assigned');
    refresh();
  }

  async function unassignChecklist(assignmentId) {
    if (!confirm('Remove this checklist assignment?')) return;
    const { error } = await db.from('checklist_assignments').delete().eq('id', assignmentId);
    if (error) return toast(error.message, 'err');
    toast('Assignment removed');
    refresh();
  }

  function kv(k, v) {
    return el('div', { class: 'kv' }, [el('div', { class: 'k' }, k), el('div', { class: 'v' }, v)]);
  }

  // Email cell for another user's detail view: masked by default; superusers+
  // may un-mask via the reveal_email RPC, which writes the audited
  // email_reveal_log row (sysadmins watch that log in Settings).
  function emailKv(p) {
    const value = el('div', { class: 'v' }, maskEmail(p.email) || '—');
    const box = el('div', { class: 'kv' }, [el('div', { class: 'k' }, 'Email'), value]);
    if (isSuperPlus(state.profile) && p.email) {
      const revealBtn = el('button', {
        class: 'btn btn-ghost btn-sm', style: 'margin-top:8px',
        title: t('emailAccessLogged'),
        onclick: async () => {
          const { data, error } = await db.rpc('reveal_email', { target: p.id, p_context: 'user-detail' });
          if (error) return toast(error.message + ' - run migration_email_privacy.sql first.', 'err');
          value.textContent = data || '—';
          revealBtn.remove();
        },
      }, `👁 ${t('showEmail')}`);
      box.append(revealBtn);
    }
    return box;
  }

  function changeRequestCard(r, { compact = false, embedded = false, readOnly = false } = {}) {
    const user = state.profiles.find(p => p.id === r.user_id);
    const lines = profileChangeLines(r);
    const actions = [];
    if (r.status === 'pending' && !readOnly) {
      actions.push(el('button', { class: 'btn btn-primary', onclick: e => { e.stopPropagation(); approveProfileChange(r); } }, 'Approve'));
      actions.push(el('button', { class: 'btn btn-danger', onclick: e => { e.stopPropagation(); rejectProfileChange(r); } }, 'Reject'));
    } else {
      actions.push(el('span', { class: `pill ${r.status || ''}` }, r.status || 'pending'));
    }
    const body = [
      el('div', { class: 'user-main' }, [
        el('div', { class: 'user-name' }, compact ? `Profile change · ${labelOf(user)}` : 'Profile change request'),
        el('div', { class: 'user-meta' }, `${labelOf(user)} · ${fmt(r.requested_at)}`),
        el('div', { class: 'change-lines' }, lines.length ? lines : [el('span', { class: 'muted' }, 'No visible changes')]),
      ]),
      el('div', { class: 'user-actions' }, actions),
    ];
    return el('div', {
      class: embedded ? 'row' : 'user-card',
      onclick: embedded ? null : () => go(userDetailView(r.user_id)),
      style: embedded ? 'align-items:flex-start' : null,
    }, body);
  }

  function profileChangeLines(r) {
    // Emails compare on the raw values (so a change is still detected) but
    // render masked — reveal goes through the audited user-detail button.
    const pairs = [
      ['Name', r.current_full_name, r.requested_full_name, null],
      ['Username', r.current_username, r.requested_username, null],
      ['Email', r.current_email, r.requested_email, maskEmail],
      ['Mobile', r.current_mobile_number, r.requested_mobile_number, null],
    ];
    return pairs
      .filter(([, a, b]) => (a || '') !== (b || ''))
      .map(([label, a, b, fmtVal]) => el('div', { class: 'change-line' }, [
        el('strong', {}, label),
        document.createTextNode(`${(fmtVal ? fmtVal(a) : a) || '—'} → ${(fmtVal ? fmtVal(b) : b) || '—'}`),
      ]));
  }

  async function approveProfileChange(r) {
    const rpc = await db.rpc('approve_profile_change_request', { p_request: r.id });
    if (rpc.error && !missingOptionalRpc(rpc.error)) return toast(rpc.error.message, 'err');
    if (rpc.error) {
      const patch = {};
      if ((r.current_full_name || '') !== (r.requested_full_name || '')) patch.full_name = r.requested_full_name || null;
      if ((r.current_username || '') !== (r.requested_username || '')) patch.username = r.requested_username || null;
      if ((r.current_email || '') !== (r.requested_email || '')) patch.email = r.requested_email || null;
      if ((r.current_mobile_number || '') !== (r.requested_mobile_number || '')) patch.mobile_number = r.requested_mobile_number || null;
      const { error: upErr } = await db.from('profiles').update(patch).eq('id', r.user_id);
      if (upErr) return toast(upErr.message + ' — run the SQL patch if this table/function is missing.', 'err');
      if (patch.email) await db.from('profile_email_log').insert({
        user_id: r.user_id, old_email: r.current_email, new_email: r.requested_email,
        changed_by: state.profile.id, source: 'admin approval', request_id: r.id,
      });
      await db.from('profile_change_requests').update({
        status: 'approved', reviewed_by: state.profile.id, reviewed_at: new Date().toISOString(),
      }).eq('id', r.id);
    }
    toast(t('profileChangeApproved'));
    await loadProfiles(true); refresh();
  }
  async function rejectProfileChange(r) {
    const note = prompt('Reason for rejection (optional):') || '';
    const rpc = await db.rpc('reject_profile_change_request', { p_request: r.id, p_note: note });
    if (rpc.error && !missingOptionalRpc(rpc.error)) return toast(rpc.error.message, 'err');
    if (rpc.error) {
      const { error } = await db.from('profile_change_requests').update({
        status: 'rejected', reviewed_by: state.profile.id, reviewed_at: new Date().toISOString(), admin_note: note || null,
      }).eq('id', r.id);
      if (error) return toast(error.message + ' — run the SQL patch if this table/function is missing.', 'err');
    }
    toast(t('profileChangeRejected')); refresh();
  }

  function addUserModal() {
    openModal('Add user', (body, close) => {
      const email = el('input', { type: 'email', autocomplete: 'off', placeholder: 'name@example.com' });
      const username = el('input', { type: 'text', autocomplete: 'off', placeholder: 'username' });
      const fullName = el('input', { type: 'text', autocomplete: 'off', placeholder: 'Full name' });
      const mobile = el('input', { type: 'tel', autocomplete: 'off', placeholder: '+47 ...' });
      const password = el('input', { type: 'text', autocomplete: 'off' });
      password.value = makeTempPassword();
      const role = el('select', {}, assignableRoles().map(r => opt(r, roleName(r))));
      const verified = el('input', { type: 'checkbox' });
      verified.checked = true;
      body.append(
        labeled('Email', email, true),
        labeled('Username', username, true),
        labeled('Full name', fullName, true),
        labeled('Mobile number', mobile),
        labeled('Temporary password', password, true),
        labeled('Role', role),
        el('label', { class: 'check-item' }, [verified, el('span', {}, 'Approve immediately')]),
        el('p', { class: 'muted', style: 'font-size:.82rem' }, 'The account is created with a separate auth client, so your admin session stays intact.'),
        el('button', { class: 'btn btn-primary btn-block', onclick: async () => {
          const em = email.value.trim();
          const un = username.value.trim();
          const fn = fullName.value.trim();
          const mob = mobile.value.trim();
          const pw = password.value.trim();
          if (!em || !fn || !un || !pw) return toast(t('nameEmailUsernameTempPasswordRequired'), 'err');
          if (pw.length < 6) return toast(t('passwordMinLength'), 'err');
          const { data: free, error: freeErr } = await db.rpc('username_available', { p_username: un });
          if (!freeErr && free === false) return toast(t('usernameTaken'), 'err');

          const auth = newAuthClient();
          const { data, error } = await signUpWithProfile(auth, {
            email: em, password: pw, full_name: fn, username: un, mobile_number: mob,
            emailRedirectTo: new URL('confirmed.html', location.href).href,
          });
          await auth.auth.signOut();
          if (error) return toast(error.message, 'err');
          const id = data?.user?.id;
          if (!id) return toast(t('userCreatedNoId'), 'err');
          // The profile row is created by the handle_new_user trigger (name /
          // username / email / mobile come from the sign-up metadata). Role and
          // approval go through the rank-checked RPCs so the privileged columns
          // are never written directly from the browser (audit V3).
          if (role.value !== 'user') {
            const { error: rErr } = await db.rpc('set_role', { target: id, new_role: role.value });
            if (rErr) return toast(rErr.message, 'err');
          } else if (verified.checked) {
            const { error: vErr } = await db.rpc('set_verification', { target: id, verified: true });
            if (vErr) return toast(vErr.message, 'err');
          }
          const general = generalDepartmentId();
          if (general) await db.from('user_departments').insert({ user_id: id, department_id: general });
          toast(t('userAddedTempPassword'));
          close(); await loadProfiles(true); await loadUserDepartments(true); refresh();
        } }, 'Create user'),
      );
    });
  }
  function makeTempPassword() {
    const a = new Uint32Array(3); crypto.getRandomValues(a);
    return 'HMS-' + [...a].map(n => n.toString(36)).join('-').slice(0, 16);
  }


  // ── small ui helpers ───────────────────────────────────
  function emptyState(title, sub) {
    return el('div', { class: 'empty' }, [el('div', { class: 'big' }, '—'),
      el('div', {}, title), el('div', { class: 'sub' }, sub)]);
  }
  function truncate(s, n) { return s && s.length > n ? s.slice(0, n) + '…' : (s || ''); }

  // ── COMMUNICATIONS (admin: compose News, safety or regular; see read receipts) ──
  // The set of users a communication targets — drives the read-statistic denominator.
  function communicationTargetUsers(comm) {
    if (comm.audience === 'all') return state.profiles.map(p => p.id);
    const want = new Set(comm.department_ids || []);
    return state.profiles.filter(p => departmentIdsForUser(p.id).some(d => want.has(d))).map(p => p.id);
  }
  function commAudienceText(comm) {
    if (comm.audience === 'all') return t('audienceEveryone');
    const names = (comm.department_ids || []).map(id => (state.departments.find(d => d.id === id) || {}).name).filter(Boolean);
    return names.join(', ') || t('sentToDepartments');
  }
  const commFileIcon = (a) => /image\//.test(a.type || '') ? '🖼️' : /\.pdf$/i.test(a.name || '') ? '📕' : /\.(xlsx?|csv)$/i.test(a.name || '') ? '📊' : '📄';

  function communicationsView() {
    return {
      title: t('communications'), tab: 'groups', side: 'communications',
      async render(app) {
        await loadProfiles(); await loadDepartments(); await loadUserDepartments();
        app.append(el('div', { class: 'card section-head comm-compose-bar' }, [
          el('h3', {}, t('communications')),
          el('div', { class: 'comm-compose-actions' }, [
            el('button', { class: 'btn btn-primary', onclick: () => go(communicationCompose()) }, '＋ ' + t('newNews')),
          ]),
        ]));
        const res = await db.from('communications').select('*').eq('kind', 'news').order('created_at', { ascending: false });
        if (res.error) { app.append(emptyState(t('communications'), t('runCommunicationsMigration'))); return; }
        const comms = res.data || [];
        const ids = comms.map(c => c.id);
        const { data: readRows = [] } = ids.length
          ? await db.from('communication_reads').select('communication_id,user_id').in('communication_id', ids)
          : { data: [] };
        const readByComm = new Map();
        (readRows || []).forEach(r => {
          if (!readByComm.has(r.communication_id)) readByComm.set(r.communication_id, new Set());
          readByComm.get(r.communication_id).add(r.user_id);
        });
        const thumbs = await signedUrls('communications', comms.map(c => c.image_path), 600);
        const active = comms.filter(c => !c.archived_at);
        renderCommAdminSection(app, t('safetyNews'), active.filter(c => c.is_safety), readByComm, thumbs);
        renderCommAdminSection(app, t('news'), active.filter(c => !c.is_safety), readByComm, thumbs);
        const archived = comms.filter(c => c.archived_at);
        if (archived.length) renderCommAdminSection(app, t('archivedNews'), archived, readByComm, thumbs);
      },
    };
  }

  function renderCommAdminSection(app, title, list, readByComm, thumbs) {
    app.append(el('div', { class: 'kpi-section-h' }, title));
    if (!list.length) { app.append(el('div', { class: 'kpi-card' }, el('p', { class: 'miss-sub' }, t('noCommunications')))); return; }
    const wrap = el('div', { class: 'comm-admin-list' });
    list.forEach(c => {
      const target = communicationTargetUsers(c);
      const read = readByComm.get(c.id) || new Set();
      const readCount = target.filter(id => read.has(id)).length;
      const url = thumbs.get(c.image_path);
      wrap.append(el('div', { class: 'comm-admin-row' + (c.is_safety ? ' comm-safety' : ''), onclick: () => go(communicationDetailAdmin(c)) }, [
        el('div', { class: 'comm-thumb' }, url ? el('img', { src: url, alt: '' }) : el('span', { class: 'comm-thumb-ico' }, c.is_safety ? '🚨' : '📰')),
        el('div', { class: 'comm-main' }, [
          el('div', { class: 'comm-title' }, c.title || (c.body || '').slice(0, 60) || t('news')),
          el('div', { class: 'comm-sub' }, `${commAudienceText(c)} · ${fmt(c.created_at)}`),
        ]),
        el('span', { class: 'comm-read-pill' }, t('readByCount', { read: readCount, total: target.length })),
      ]));
    });
    app.append(wrap);
  }

  function communicationDetailAdmin(comm) {
    return {
      title: comm.title || t('news'), tab: 'groups', side: 'communications',
      async render(app) {
        await loadProfiles();
        const media = await signedUrls('communications', [comm.image_path, ...(comm.attachments || []).map(a => a.path)], 600);
        const card = el('div', { class: 'card comm-detail' + (comm.is_safety ? ' comm-safety' : '') });
        if (comm.image_path && media.get(comm.image_path)) card.append(el('img', { src: media.get(comm.image_path), class: 'comm-detail-img', alt: '' }));
        if (comm.is_safety) card.append(el('span', { class: 'pill comm-safety-pill' }, t('safetyNews')));
        if (comm.title) card.append(el('h2', { class: 'comm-detail-title' }, comm.title));
        if (comm.body) card.append(el('p', { class: 'comm-detail-body' }, comm.body));
        if ((comm.attachments || []).length) {
          card.append(el('div', { class: 'comm-attach-list' }, comm.attachments.map(a =>
            el('button', { class: 'btn btn-ghost comm-attach', onclick: () => { const u = media.get(a.path); if (u) window.open(u, '_blank'); } }, [
              el('span', {}, commFileIcon(a)), el('span', {}, a.name || 'file'),
            ]))));
        }
        app.append(card);

        // News can be archived (moved to the Communications log + hidden from workers).
        const archived = !!comm.archived_at;
        const archiveBtn = el('button', { class: 'btn ' + (archived ? 'btn-ghost' : 'btn-primary'), onclick: async () => {
          archiveBtn.disabled = true;
          const { error } = await db.from('communications').update({ archived_at: archived ? null : new Date().toISOString() }).eq('id', comm.id);
          if (error) { archiveBtn.disabled = false; return toast(error.message, 'err'); }
          toast(archived ? t('newsUnarchived') : t('newsArchived'));
          go(communicationsView(), { reset: true });
        } }, archived ? t('unarchive') : t('archive'));
        app.append(el('div', { class: 'comm-detail-actions' }, archiveBtn));

        const target = communicationTargetUsers(comm);
        const { data: readRows = [] } = await db.from('communication_reads').select('user_id,read_at').eq('communication_id', comm.id);
        const readMap = new Map((readRows || []).map(r => [r.user_id, r.read_at]));
        const readCount = target.filter(id => readMap.has(id)).length;
        app.append(el('div', { class: 'kpi-section-h' }, `${t('readReceipts')} · ${t('readByCount', { read: readCount, total: target.length })}`));
        const listHost = el('div', { class: 'comm-read-list' });
        target.map(id => state.profiles.find(p => p.id === id)).filter(Boolean)
          .sort((a, b) => (readMap.has(b.id) ? 1 : 0) - (readMap.has(a.id) ? 1 : 0) || labelOf(a).localeCompare(labelOf(b)))
          .forEach(p => {
            const at = readMap.get(p.id);
            listHost.append(el('div', { class: 'comm-read-row' }, [
              el('span', { class: 'grow' }, labelOf(p)),
              at ? el('span', { class: 'time-pill' }, fmt(at)) : el('span', { class: 'pill' }, t('notYetRead')),
            ]));
          });
        if (!target.length) listHost.append(el('p', { class: 'miss-sub' }, t('notYetRead')));
        app.append(listHost);
      },
    };
  }

  function communicationCompose() {
    return {
      title: t('newNews'), tab: 'groups', side: 'communications',
      async render(app) {
        await loadProfiles(); await loadDepartments(); await loadUserDepartments();
        const title = el('input', { type: 'text', placeholder: t('commTitle') });
        const body = el('textarea', { placeholder: t('commBody') });
        const image = el('input', { type: 'file', accept: 'image/*' });
        const files = el('input', { type: 'file', multiple: 'multiple' });
        const safetyBox = el('input', { type: 'checkbox' });

        const audSel = el('select', { class: 'kpi-filter' }, [opt('all', t('audienceEveryone')), opt('department', t('audienceDepartments'))]);
        const deptBox = el('div', { class: 'comm-pick hidden' });
        state.departments.forEach(d => deptBox.append(el('label', { class: 'check-item' }, [el('input', { type: 'checkbox', value: d.id }), el('span', {}, d.name)])));
        audSel.addEventListener('change', () => deptBox.classList.toggle('hidden', audSel.value !== 'department'));

        const sendBtn = el('button', { class: 'btn btn-primary comm-send', onclick: send }, t('send'));
        app.append(el('div', { class: 'card' }, [
          labeled(t('commTitle'), title),
          labeled(t('commBody'), body),
          labeled(t('commImage'), fileButton(image)),
          labeled(t('commAttachments'), fileButton(files)),
          el('label', { class: 'check-item' }, [safetyBox, el('span', {}, t('safetyNewsToggle'))]),
          el('div', {}, [labeled(t('broadcastAudience'), audSel), deptBox]),
          sendBtn,
        ]));

        async function send() {
          const titleVal = title.value.trim();
          const bodyVal = body.value.trim();
          if (!titleVal && !bodyVal) return toast(t('messageBodyRequired'), 'err');
          const audience = audSel.value;
          let departmentIds = [];
          if (audience === 'department') {
            departmentIds = [...deptBox.querySelectorAll('input:checked')].map(x => x.value);
            if (!departmentIds.length) return toast(t('pickAtLeastOneDepartment'), 'err');
          }
          sendBtn.disabled = true; sendBtn.textContent = t('sending');
          try {
            const uid = () => (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);
            const safe = (n) => (n || 'file').replace(/[^\w.\-]+/g, '_');
            let imagePath = null;
            if (image.files[0]) {
              const f = image.files[0];
              const path = `news/${uid()}-${safe(f.name)}`;
              const { error } = await db.storage.from('communications').upload(path, f);
              if (error) throw error;
              imagePath = path;
            }
            const attachments = [];
            for (const f of [...files.files]) {
              const path = `news/${uid()}-${safe(f.name)}`;
              const { error } = await db.storage.from('communications').upload(path, f);
              if (error) throw error;
              attachments.push({ path, name: f.name, type: f.type, size: f.size });
            }
            const { error } = await db.from('communications').insert({
              author_id: state.profile.id, kind: 'news', title: titleVal || null, body: bodyVal || null,
              image_path: imagePath, attachments, audience, department_ids: departmentIds,
              is_safety: safetyBox.checked,
            });
            if (error) throw error;
            // Fire-and-forget push to the audience (no-op until send-push is deployed).
            db.functions.invoke('send-push', { body: {
              all: audience === 'all',
              department_ids: audience === 'department' ? departmentIds : undefined,
              title: titleVal || t('news'),
              body: (bodyVal || '').slice(0, 200),
              url: './user.html',
            } }).then(() => {}, () => {});
            toast(t('communicationSent'));
            go(communicationsView(), { reset: true });
          } catch (err) {
            sendBtn.disabled = false; sendBtn.textContent = t('send');
            toast(err.message || String(err), 'err');
          }
        }
      },
    };
  }

  function openModal(title, build) {
    const bg = el('div', { class: 'modal-bg', onclick: e => { if (e.target === bg) close(); } });
    const body = el('div', {});
    const modal = el('div', { class: 'modal' }, [el('h2', {}, title), body]);
    bg.append(modal); document.body.append(bg);
    const close = () => bg.remove();
    build(body, close);
  }
  </script>
</body>

        el('p', { class: 'muted' }, t('trashRetentionHint')),
      ]),
      items.length ? el('button', { class: 'btn btn-danger', onclick: () => purgeTrashNow(close) }, t('deleteNow')) : null,
    ]));
    if (trash.error) {
      body.append(el('p', { class: 'muted' }, `${t('runTrashMigration')} (${trash.error.message})`));
      return;
    }
    if (!items.length) {
      body.append(el('p', { class: 'muted' }, t('trashEmpty')));
      return;
    }
    items.forEach(row => body.append(trashRow(row, close)));
  }
  function trashRow(row, close) {
    const meta = [trashTypeLabel(row.item_type), row.deleted_at ? fmt(row.deleted_at) : '', trashDaysLeft(row)].filter(Boolean).join(' - ');
    return el('div', { class: 'hidden-group-row trash-row' }, [
      el('span', { style: 'flex:1' }, [
        document.createTextNode(`${row.icon || '\u{1F5D1}'} ${row.title || t('deleted')}`),
        el('span', { class: 'sub', style: 'display:block;margin-top:3px' }, meta),
      ]),
      el('button', { class: 'btn btn-ghost', onclick: () => restoreTrashItem(row, close) }, t('recover')),
    ]);
  }
  function sidebarGroupLink(g, active, opts = {}) {
    return el('button', {
      class: `sidebar-link ${opts.draggable ? 'sidebar-link-draggable ' : ''}${active === `group:${g.id}` ? 'active' : ''}`,
      draggable: opts.draggable ? 'true' : null,
      onclick: opts.onclick || (() => go(groupView(g))),
    }, [
      el('span', { class: 'ic' }, g.icon || '•'),
      el('span', { class: 'label' }, groupName(g)),
      el('span', { class: 'sidebar-hide', title: t('hideGroup'),
        onclick: e => { e.stopPropagation(); setGroupHidden(g.id, true); toast(t('groupHidden')); go(homeView(), { reset: true }); } }, '🛇'),
    ]);
  }
  async function restoreTrashItem(row, close) {
    const { error } = await db.rpc('restore_deleted_item', { p_item_type: row.item_type, p_item_id: row.item_id });
    if (error) return toast(error.message + ' - run migration_trash_soft_delete.sql first.', 'err');
    close(); toast(t('restoredFromTrash')); go(homeView(), { reset: true });
  }
  async function purgeTrashNow(close) {
    if (!confirm(t('confirmDeleteTrashNow'))) return;
    const { error } = await db.rpc('purge_deleted_items', { p_only_expired: false });
    if (error) return toast(error.message + ' - run migration_trash_soft_delete.sql first.', 'err');
    close(); toast(t('trashDeleted')); go(homeView(), { reset: true });
  }

  const DAYMS = 86400000;

  function previousBounds(period) {
    const { start, end } = periodBounds(period);
    const len = new Date(end) - new Date(start);
    return { start: new Date(new Date(start) - len).toISOString(), end: start };
  }

  // How many days in [from..until] fall on a counted weekday.
  function qualifyingDays(period, weekdays) {
    const set = new Set((weekdays || [0,1,2,3,4,5,6]).map(Number));
    let n = 0;
    const d = new Date(period.from + 'T00:00:00');
    const end = new Date(period.until + 'T00:00:00');
    for (; d <= end; d.setDate(d.getDate() + 1)) if (set.has(d.getDay())) n++;
    return n;
  }

  function pctChange(cur, prev) { return prev > 0 ? Math.round((cur - prev) / prev * 100) : 0; }
  function isGood(cur, prev, dir) { return dir == null ? null : ((cur >= prev) === (dir === 'up')); }

  function deltaPill(delta, good) {
    const cls = good == null ? 'neutral' : (good ? 'good' : 'bad');
    const arrow = delta >= 0 ? '▲' : '▼';
    return el('span', { class: 'delta-pill delta-' + cls }, `${arrow} ${Math.abs(delta)}%`);
  }

  // o: { label, value, delta, good, live, hint, onClick }
  function metricCard(o) {
    const top = o.live
      ? el('span', { class: 'kpi-live' }, [el('span', { class: 'kpi-dot' }), 'LIVE'])
      : (o.delta == null ? null : deltaPill(o.delta, o.good));
    const card = el('div', { class: 'kpi-card metric-card' + (o.onClick ? ' kpi-clickable' : '') }, [
      el('div', { class: 'metric-head' }, [el('span', { class: 'kpi-label' }, o.label), top]),
      el('div', { class: 'kpi-value' }, o.value == null ? '–' : String(o.value)),
      o.hint ? el('div', { class: 'kpi-period' }, o.hint) : null,
    ]);
    if (o.onClick) card.addEventListener('click', o.onClick);
    return card;
  }

  function medianDays(rows) {
    const xs = rows.map(r => (new Date(r.resolved_at) - new Date(r.created_at)) / DAYMS)
                   .filter(x => x >= 0).sort((a, b) => a - b);
    if (!xs.length) return null;
    const m = Math.floor(xs.length / 2);
    const v = xs.length % 2 ? xs[m] : (xs[m - 1] + xs[m]) / 2;
    return Math.round(v * 10) / 10;
  }

  async function renderAdminKpiDashboard(app) {
    const periodKey = 'adminKpiPeriod', typeKey = 'adminKpiType', filterKey = 'adminKpiChecklist', adminKey = 'adminKpiAdmin', presetKey = 'adminKpiPreset';
    const reportTypeKey = 'adminKpiIncidentReportType', consequenceKey = 'adminKpiIncidentConsequence';
    const statusKey = 'adminKpiIncidentStatus', rootCauseKey = 'adminKpiRootCause';
    const activityKey = 'adminKpiOverviewActivity'; // Overview "Reports by type" → Latest-activity drilldown

    // The dashboard re-renders IN PLACE on every filter change (no router hop / skeleton /
    // route fade), and the Incidents dataset is fetched ONCE per period and cached here —
    // so toggling a report-type / consequence / root-cause / status filter recomputes the
    // cards, bars and activity feed straight from memory with zero network. The cache is
    // keyed by the period window, so switching Day/Week/Month or the calendar range (or
    // navigating away and back) transparently refetches. Trade-off: rows filed while the
    // admin sits on the page won't appear until the period changes or the page reloads.
    const mount = el('div', { class: 'kpi-dashboard' });
    app.append(mount);
    let incCache = null; // { key, all, cats, rootCauseCats, live }
    let clCache = null;

    const ensureIncidents = async (key, cur, prev) => {
      if (incCache && incCache.key === key) return incCache;
      const [allRes, catsRes, rcRes, live] = await Promise.all([
        db.from('incidents')
          .select('id,report_type,consequence_ids,root_cause_ids,is_anonymous,status,created_at,resolved_at,reporter_id,assigned_to,what_happened')
          .or(`and(created_at.gte.${prev.start},created_at.lt.${cur.end}),and(resolved_at.gte.${prev.start},resolved_at.lt.${cur.end})`)
          .limit(5000),
        db.from('incident_categories').select('id,name').eq('kind', 'consequence'),
        db.from('incident_categories').select('id,name').eq('kind', 'root_cause'),
        liveIncidentState(),
      ]);
      incCache = { key, all: allRes.data || [], cats: catsRes.data || [], rootCauseCats: rcRes.data || [], live };
      return incCache;
    };

    const ensureChecklistRuns = async (key, cur, prev, todayB) => {
      if (clCache && clCache.key === key) return clCache;
      const [runsRes, todayRes] = await Promise.all([
        db.from('checklist_runs')
          .select('id,checklist_id,user_id,submitted_at,completed')
          .not('submitted_at', 'is', null)
          .eq('completed', true)
          .or(`and(submitted_at.gte.${prev.start},submitted_at.lt.${cur.end})`)
          .limit(10000),
        db.from('checklist_runs')
          .select('checklist_id')
          .eq('completed', true)
          .gte('submitted_at', todayB.start)
          .lt('submitted_at', todayB.end)
      ]);
      clCache = {
        key,
        runs: runsRes.data || [],
        todayRuns: todayRes.data || [],
      };
      return clCache;
    };

    // Overview has no per-click filters — only the period changes it. To make Day/Week/Month
    // switch instantly, one superset covering all three presets AND their comparison windows
    // is fetched once and cached; each preset's cur/prev counts are computed client-side.
    // A custom calendar range caches its own [prev.start, cur.end] window.
    let ovCache = null;
    const ensureOverview = async (preset, period) => {
      const canSeeVarsling = isSuperPlus(state.profile) && canAccessVarsling(state.profile);
      let start, end, key;
      if (preset === 'custom') {
        const c = periodBounds(period), pr = previousBounds(period);
        start = pr.start; end = c.end; key = `custom|${period.from}|${period.until}`;
      } else {
        let minStart = Infinity, maxEnd = -Infinity;
        for (const k of ['today', 'week', 'month']) {
          const p = presetBounds(k), c = periodBounds(p), pr = previousBounds(p);
          minStart = Math.min(minStart, +new Date(pr.start));
          maxEnd = Math.max(maxEnd, +new Date(c.end));
        }
        start = new Date(minStart).toISOString(); end = new Date(maxEnd).toISOString();
        key = `presets|${localDateString()}`;
      }
      if (ovCache && ovCache.key === key) return ovCache;
      const rows = (q) => q.then(r => r.data || [], () => []);
      const win = (q, col) => q.gte(col, start).lt(col, end).limit(10000);
      const titleMap = (table) => db.from(table).select('id,title').then(
        r => new Map((r.data || []).map(x => [x.id, x.title])), () => new Map());
      const [
        incidents, runs, courses, procs, docs, members, vars,
        clTitles, coTitles, prTitles, seriousIds, live,
      ] = await Promise.all([
        rows(db.from('incidents')
          .select('id,report_type,is_anonymous,reporter_id,assigned_to,status,created_at,resolved_at,consequence_ids')
          .or(`and(created_at.gte.${start},created_at.lt.${end}),and(resolved_at.gte.${start},resolved_at.lt.${end})`).limit(5000)),
        rows(win(db.from('checklist_runs').select('id,checklist_id,user_id,submitted_at').eq('completed', true).not('submitted_at', 'is', null), 'submitted_at')),
        rows(win(db.from('course_submissions').select('id,course_id,user_id,passed,score,created_at'), 'created_at')),
        rows(win(db.from('procedure_submissions').select('id,procedure_id,user_id,created_at'), 'created_at')),
        rows(win(db.from('documents').select('name,uploaded_by,created_at'), 'created_at')),
        rows(win(db.from('profiles').select('id,full_name,username,email,created_at'), 'created_at')),
        canSeeVarsling ? rows(win(db.from('varslinger').select('id,created_at'), 'created_at')) : Promise.resolve([]),
        titleMap('checklists'), titleMap('courses'), titleMap('procedures'),
        seriousConsequenceIds(),
        liveIncidentState(),
      ]);
      ovCache = {
        key, incidents, runs, courses, procs, docs, members, vars,
        clTitles, coTitles, prTitles, seriousIds, live, canSeeVarsling,
      };
      return ovCache;
    };

    const paint = async () => {
      const preset = storageValue(presetKey, 'today');
      // Day/Week/Month presets recompute live so the window always tracks the current
      // date; only a custom calendar range is read back from storage.
      const period = preset === 'custom' ? kpiPeriod(periodKey) : presetBounds(preset);
      const prev = previousBounds(period);
      const cur = periodBounds(period);
      let type = storageValue(typeKey, 'overview');
      if (type === 'admin_performance' && !isAdminPlus(state.profile)) type = 'overview';
      const refresh = paint;
      const setPreset = (k) => { setStorageValue(presetKey, k); refresh(); };

      // Incidents/Overview tabs: load (or reuse) the cached dataset up front so the body
      // (and the incidents root-cause dropdown) render from the same in-memory rows.
      const inc = type === 'incidents' ? await ensureIncidents(`${period.from}|${period.until}`, cur, prev) : null;
      const ov = type === 'overview' ? await ensureOverview(preset, period) : null;

      // ── toolbar: type (left) · checklist filter · period chip + calendar (right) ──
      const typeOptions = [opt('overview', t('kpiOverview')), opt('incidents', t('kpiIncidents')), opt('checklists', t('kpiChecklists'))];
      if (isAdminPlus(state.profile)) typeOptions.push(opt('admin_performance', t('kpiAdminPerformance')));
      const typeSel = el('select', { class: 'kpi-filter', onchange: e => {
        setStorageValue(typeKey, e.target.value); refresh();
      } }, typeOptions);
      typeSel.value = type;

      // checklists (with quotas) loaded up front; also feeds the filter dropdown
      let checklists = [];
      let runsData = null;
      if (type === 'checklists') {
        const todayB = todayBounds();
        const [clRes, runsRes] = await Promise.all([
          db.from('checklists').select('id,title,daily_quota,quota_weekdays'),
          ensureChecklistRuns(`${period.from}|${period.until}`, cur, prev, todayB)
        ]);
        checklists = (clRes.data || []).filter(c => c.daily_quota > 0);
        runsData = runsRes;
      }
      const selectedCls = new Set((storageValue(filterKey, '') || '').split(',').filter(x => checklists.some(c => c.id === x)));
      const saveChecklists = (set) => { set.size ? setStorageValue(filterKey, [...set].join(',')) : removeStorageValue(filterKey); refresh(); };

      const selectedAdmin = storageValue(adminKey, 'all');
      const saveAdmin = (val) => {
        if (val === 'all') removeStorageValue(adminKey);
        else setStorageValue(adminKey, val);
        refresh();
      };

      const from = el('input', { type: 'date', value: period.from });
      const until = el('input', { type: 'date', value: period.until });
      const panel = el('div', { class: 'kpi-date-panel hidden' }, [
        labeled(t('dateFrom'), from), labeled(t('dateUntil'), until),
        el('div', { class: 'kpi-date-actions' }, [
          el('button', { class: 'btn btn-ghost', onclick: () => { removeStorageValue(periodKey); setPreset('today'); } }, t('today')),
          el('button', { class: 'btn btn-primary', onclick: () => { setStorageValue(presetKey, 'custom'); saveKpiPeriod(periodKey, from.value, until.value, refresh); } }, t('apply')),
        ]),
      ]);
      const calBtn = el('button', { class: 'iconbtn', title: t('dashboardPeriod'), onclick: () => panel.classList.toggle('hidden') }, '📅');

      // Day / Week / Month quick presets — the common ranges without opening the calendar.
      const presetIcons = { today: '⏱️', week: '📅', month: '🗓️' };
      const presetSeg = el('div', { class: 'kpi-seg' }, ['today', 'week', 'month'].map(k =>
        el('button', { class: 'kpi-seg-btn' + (preset === k ? ' on' : ''), onclick: () => setPreset(k) }, [
          el('span', { style: 'font-size: 0.95rem; line-height: 1;' }, presetIcons[k]),
          t('period' + k.charAt(0).toUpperCase() + k.slice(1))
        ])));

      // Incident status quick-filters — sit horizontally to the right of the type dropdown,
      // and only on the incidents view. Selection persists like the other KPI filters.
      const VALID_STATUSES = ['open', 'in_progress', 'resolved'];
      const incidentStatuses = new Set((storageValue(statusKey, '') || '').split(',').filter(x => VALID_STATUSES.includes(x)));
      const saveStatuses = (set) => { set.size ? setStorageValue(statusKey, [...set].join(',')) : removeStorageValue(statusKey); refresh(); };
      const statusFilter = el('div', { class: 'kpi-status-filter' }, [
        el('button', { class: 'chip' + (incidentStatuses.size === 0 ? ' on' : ''), onclick: () => {
          removeStorageValue(statusKey); refresh();
        } }, t('all')),
        ...VALID_STATUSES.map(s =>
          el('button', { class: 'chip' + (incidentStatuses.has(s) ? ' on' : ''), onclick: () => {
            const next = new Set(incidentStatuses);
            if (next.has(s)) next.delete(s);
            else next.add(s);
            saveStatuses(next);
          } }, statusLabel(s)))
      ]);

      const rootCauseCats = inc ? inc.rootCauseCats : [];
      const incidentRootCauses = new Set((storageValue(rootCauseKey, '') || '').split(',').filter(x => x && rootCauseCats.some(c => c.id === x)));

      const INC_TYPES = ['incident', 'hazard', 'suggestion'];
      const incidentReportTypes = new Set((storageValue(reportTypeKey, '') || '').split(',').filter(x => INC_TYPES.includes(x)));
      const incidentConsequences = new Set((storageValue(consequenceKey, '') || '').split(',').filter(Boolean));

      // Overview "Reports by type" bar → Latest-activity drilldown. Multi-select: a
      // comma-joined set of the five types (empty/absent = show everything).
      const OV_TYPES = ['incident', 'hazard', 'suggestion', 'checklist', 'procedure'];
      const overviewActivity = new Set((storageValue(activityKey, '') || '').split(',').filter(x => OV_TYPES.includes(x)));

      // Reset all drilldown/quick filters — the bar drilldowns persist in localStorage,
      // so without this a refresh keeps them stuck. Shown next to the type selector on
      // the two tabs that carry filters.
      const anyFilterActive = (type === 'overview' && overviewActivity.size > 0)
        || (type === 'incidents' && (incidentReportTypes.size > 0 || incidentConsequences.size > 0 || incidentRootCauses.size > 0 || incidentStatuses.size > 0))
        || (type === 'checklists' && selectedCls.size > 0)
        || (type === 'admin_performance' && selectedAdmin !== 'all');
      const resetFiltersBtn = el('button', {
        class: 'btn btn-ghost btn-sm kpi-reset-btn',
        onclick: () => {
          [reportTypeKey, consequenceKey, rootCauseKey, statusKey, activityKey, filterKey, adminKey].forEach(removeStorageValue);
          refresh();
        },
      }, t('resetFilters'));
      resetFiltersBtn.disabled = !anyFilterActive;

      // Build the whole dashboard off-DOM, then swap it in atomically so filter changes
      // update with no flash (the old view stays until the new one is fully built).
      const frag = el('div');
      frag.append(el('div', { class: 'kpi-control-wrap' }, [
        el('div', { class: 'kpi-toolbar-row' }, [
          typeSel,
          ['overview', 'incidents', 'checklists', 'admin_performance'].includes(type) ? resetFiltersBtn : null,
          type === 'incidents' ? statusFilter : null,
          el('span', { class: 'spacer' }),
          type !== 'admin_performance' ? presetSeg : null,
          type !== 'admin_performance' ? el('div', { class: 'kpi-period-chip' }, periodLabel(period)) : null,
          type !== 'admin_performance' ? calBtn : null,
        ]),
        panel,
      ]));

      const host = el('div', {});
      frag.append(host);

      if (type === 'overview') renderOverviewKpi(host, { cur, prev, data: ov, activitySet: overviewActivity, activityKey, refresh });
      else if (type === 'incidents') renderIncidentsKpi(host, {
        cur, prev, data: inc, refresh,
        statusSet: incidentStatuses, rootCauseSet: incidentRootCauses,
        reportTypeSet: incidentReportTypes, consequenceSet: incidentConsequences,
      });
      else if (type === 'checklists') await renderChecklistsKpi(host, { period, prev, checklists, selectedCls, saveChecklists, refresh, runsData });
      else await renderAdminPerformanceKpi(host, { adminId: selectedAdmin, saveAdmin });

      mount.replaceChildren(...Array.from(frag.childNodes));
    };

    await paint();
  }

  // ── OVERVIEW — everything that happened in the period ───────
  // Synchronous: computes every card, bar and the activity feed from the cached Overview
  // superset (see ensureOverview), so switching Day/Week/Month recomputes with zero network.
  function renderOverviewKpi(host, { cur, prev, data, activitySet = new Set(), activityKey, refresh = () => {} }) {
    const {
      incidents = [], runs = [], courses = [], procs = [], docs = [], members = [], vars = [],
      seriousIds = [], live, canSeeVarsling = false,
    } = data || {};
    const curS = +new Date(cur.start), curE = +new Date(cur.end);
    const prevS = +new Date(prev.start), prevE = +new Date(prev.end);
    const inW = (ts, s, e) => { if (!ts) return false; const t = +new Date(ts); return t >= s && t < e; };
    const cCur = (arr, col = 'created_at') => arr.filter(r => inW(r[col], curS, curE)).length;
    const cPrev = (arr, col = 'created_at') => arr.filter(r => inW(r[col], prevS, prevE)).length;

    const rowsCur = incidents.filter(r => inW(r.created_at, curS, curE));
    const rowsPrev = incidents.filter(r => inW(r.created_at, prevS, prevE));
    const inSet = (ids) => (ids || []).some(id => seriousIds.includes(id));
    const filedCur = rowsCur.length, filedPrev = rowsPrev.length;
    const serCur = rowsCur.filter(r => inSet(r.consequence_ids)).length;
    const serPrev = rowsPrev.filter(r => inSet(r.consequence_ids)).length;
    const resCur = incidents.filter(r => r.status === 'resolved' && inW(r.resolved_at, curS, curE)).length;
    const resPrev = incidents.filter(r => r.status === 'resolved' && inW(r.resolved_at, prevS, prevE)).length;
    const clCur = cCur(runs, 'submitted_at'), clPrev = cPrev(runs, 'submitted_at');
    const coCur = courses.filter(r => r.passed && inW(r.created_at, curS, curE)).length;
    const coPrev = courses.filter(r => r.passed && inW(r.created_at, prevS, prevE)).length;
    const prCur = cCur(procs), prPrev = cPrev(procs);
    const docCur = cCur(docs), docPrev = cPrev(docs);
    const memCur = cCur(members), memPrev = cPrev(members);
    const vrCur = cCur(vars), vrPrev = cPrev(vars);
    const s = live || { backlog: 0, unassigned: 0, oldestDays: 0 };

    // ── Right now (live, point-in-time) ──
    host.append(el('div', { class: 'kpi-section-h' }, t('rightNow')));
    host.append(el('div', { class: 'kpi-grid' }, [
      metricCard({ label: t('openBacklog'), value: s.backlog, live: true }),
      metricCard({ label: t('unassigned'), value: s.unassigned, live: true }),
      metricCard({ label: t('oldestOpen'), value: s.oldestDays + 'd', live: true }),
    ]));

    // ── In this period (vs the previous equal-length window) ──
    host.append(el('div', { class: 'kpi-section-h' }, t('inThisPeriod')));
    const cards = [
      metricCard({ label: t('reportsFiled'), value: filedCur, delta: pctChange(filedCur, filedPrev), good: null }),
      metricCard({ label: t('reportsResolved'), value: resCur, delta: pctChange(resCur, resPrev), good: isGood(resCur, resPrev, 'up') }),
      metricCard({ label: t('serious'), value: serCur, delta: pctChange(serCur, serPrev), good: isGood(serCur, serPrev, 'down') }),
      metricCard({ label: t('checklistsDone'), value: clCur, delta: pctChange(clCur, clPrev), good: isGood(clCur, clPrev, 'up') }),
      metricCard({ label: t('coursesPassed'), value: coCur, delta: pctChange(coCur, coPrev), good: isGood(coCur, coPrev, 'up') }),
      metricCard({ label: t('proceduresFiled'), value: prCur, delta: pctChange(prCur, prPrev), good: null }),
      metricCard({ label: t('documentsAdded'), value: docCur, delta: pctChange(docCur, docPrev), good: null }),
      metricCard({ label: t('newMembers'), value: memCur, delta: pctChange(memCur, memPrev), good: null }),
    ];
    if (canSeeVarsling) cards.push(metricCard({ label: t('varslingerFiled'), value: vrCur, delta: pctChange(vrCur, vrPrev), good: null }));
    host.append(el('div', { class: 'kpi-grid' }, cards));

    // ── Reports by type — five activity types; clicking one filters Latest activity ──
    const typeCounts = [
      { id: 'incident', name: t('reportTypeIncidents'), n: rowsCur.filter(r => (r.report_type || 'incident') === 'incident').length },
      { id: 'hazard', name: t('reportTypeHazards'), n: rowsCur.filter(r => r.report_type === 'hazard').length },
      { id: 'suggestion', name: t('reportTypeSuggestions'), n: rowsCur.filter(r => r.report_type === 'suggestion').length },
      { id: 'checklist', name: t('kpiChecklists'), n: clCur },
      { id: 'procedure', name: t('procedures'), n: prCur },
    ].map(c => ({ ...c, color: OVERVIEW_TYPE_PALETTE[c.id] }));
    // Multi-select: clicking a segment toggles it in/out of the selected set; an empty
    // set means "show everything". Persisted as a comma-joined list.
    const saveActivity = (set) => { set.size ? setStorageValue(activityKey, [...set].join(',')) : removeStorageValue(activityKey); refresh(); };
    renderOverviewTypeBar(host, typeCounts, { activeIds: activitySet, onSelect: c => {
      const next = new Set(activitySet);
      next.has(c.id) ? next.delete(c.id) : next.add(c.id);
      saveActivity(next);
    }});

    // ── Latest activity (merged timeline across surfaces), optionally drilled to the selected types ──
    if (activitySet.size) {
      host.append(el('div', { class: 'kpi-drillbar' }, [
        el('span', { class: 'kpi-drill-label' }, `${t('filteredBy')}:`),
        ...typeCounts.filter(c => activitySet.has(c.id)).map(c => el('button', { class: 'kpi-drill-chip', onclick: () => {
          const next = new Set(activitySet); next.delete(c.id); saveActivity(next);
        } }, `x ${c.name}`)),
        activitySet.size > 1 ? el('button', { class: 'btn btn-ghost btn-sm', onclick: () => saveActivity(new Set()) }, t('clearFilter')) : null,
      ]));
    }
    renderActivityFeed(host, cur, data, activitySet);
  }

  // Merge recent events from every surface into one time-sorted "what happened" feed,
  // computed from the cached Overview dataset (no network). When `activitySet` is non-empty,
  // the feed is drilled to just those bar types' events (report-type reports, their
  // resolutions, checklist completions or procedure submissions).
  function renderActivityFeed(host, cur, data, activitySet = new Set()) {
    const { incidents = [], runs = [], courses = [], procs = [], docs = [], members = [], vars = [],
      clTitles = new Map(), coTitles = new Map(), prTitles = new Map(), canSeeVarsling = false } = data || {};
    const curS = +new Date(cur.start), curE = +new Date(cur.end);
    const inWin = (ts) => { if (!ts) return false; const t = +new Date(ts); return t >= curS && t < curE; };
    const top = (arr, col) => arr.filter(r => inWin(r[col])).sort((a, b) => +new Date(b[col]) - +new Date(a[col])).slice(0, 14);

    const incs = top(incidents, 'created_at');
    const resolved = top(incidents.filter(r => r.status === 'resolved'), 'resolved_at');
    const runsW = top(runs, 'submitted_at');
    const coursesW = top(courses, 'created_at');
    const procsW = top(procs, 'created_at');
    const docsW = top(docs, 'created_at');
    const membersW = top(members, 'created_at');
    const varsW = canSeeVarsling ? top(vars, 'created_at') : [];

    const who = (id) => whoName(id);
    const reportTitle = { incident: t('actIncidentReported'), hazard: t('actHazardReported'), suggestion: t('actSuggestionSent') };
    const ev = [];
    // `cat` places each event under one of the five bar types (or null = only shown when
    // the feed isn't drilled) so a bar click can filter the feed.
    const push = (ts, type, ico, title, sub, id, cat = null) => { if (ts) ev.push({ ts: +new Date(ts), type, ico, title, sub, id, cat }); };

    incs.forEach(r => push(r.created_at, r.report_type || 'incident', '📣', reportTitle[r.report_type || 'incident'] || reportTitle.incident, r.is_anonymous ? 'Anonymous' : who(r.reporter_id), r.id, r.report_type || 'incident'));
    resolved.forEach(r => push(r.resolved_at, 'resolved', '✅', t('actReportResolved'), `${typeLabel(r.report_type)}${r.assigned_to ? ' · ' + who(r.assigned_to) : ''}`, r.id, r.report_type || 'incident'));
    runsW.forEach(r => push(r.submitted_at, 'checklist', '☑️', t('actChecklistDone'), `${clTitles.get(r.checklist_id) || t('checklist')} · ${who(r.user_id)}`, r.id, 'checklist'));
    coursesW.forEach(r => push(r.created_at, r.passed ? 'course-passed' : 'course-attempt', r.passed ? '🎓' : '📚', r.passed ? t('actCoursePassed') : t('actCourseAttempt'), `${coTitles.get(r.course_id) || t('course')} · ${who(r.user_id)}${r.passed ? '' : ' · ' + num0(r.score) + '%'}`, r.user_id));
    procsW.forEach(r => push(r.created_at, 'procedure', '📋', t('actProcedureFiled'), `${prTitles.get(r.procedure_id) || t('procedure')} · ${who(r.user_id)}`, r.id, 'procedure'));
    docsW.forEach(r => push(r.created_at, 'document', '📄', t('actDocumentAdded'), `${r.name || ''}${r.uploaded_by ? ' · ' + who(r.uploaded_by) : ''}`.trim()));
    membersW.forEach(r => push(r.created_at, 'member', '👤', t('actMemberJoined'), labelOf(r), r.id));
    varsW.forEach(r => push(r.created_at, 'varsling', '🔒', t('actVarslingFiled'), t('confidential'), r.id));

    const shown = (activitySet.size === 0 ? ev : ev.filter(e => activitySet.has(e.cat))).sort((a, b) => b.ts - a.ts);

    host.append(el('div', { class: 'kpi-section-h' }, t('latestActivity')));
    if (!shown.length) {
      host.append(el('div', { class: 'kpi-card' }, el('p', { class: 'miss-sub' }, t('noActivityYet'))));
      return;
    }
    const feed = el('div', { class: 'act-feed' });
    shown.slice(0, 18).forEach(e => feed.append(activityRow(e)));
    host.append(feed);
  }
  const num0 = (x) => Number(x || 0);
  const whoName = (id) => { const p = state.profiles.find(u => u.id === id); return p ? labelOf(p) : '—'; };

  // Latest-activity rows for reports/varslinger jump straight to that report's
  // detail view, wherever it currently lives (active Reports section or archived
  // Logs) — incidentView/varslingDetailView fetch by id regardless of archive state.
  function activityRowTarget(e) {
    if (!e.id) return null;
    if (e.type === 'varsling') return () => go(varslingDetailView(e.id));
    if (e.type === 'resolved' || ['incident', 'hazard', 'suggestion'].includes(e.type)) return () => go(incidentView(e.id));
    if (e.type === 'checklist') return () => go(checklistLogDetailByIdView(e.id));
    if (e.type === 'procedure') return () => go(procedureSubmissionByIdView(e.id));
    if (['course-passed', 'course-attempt', 'member'].includes(e.type)) return () => go(userDetailView(e.id));
    return null;
  }
  function activityRow(e) {
    const onclick = activityRowTarget(e);
    return el('div', { class: `act-row act-${e.type}` + (onclick ? ' act-clickable' : ''), onclick }, [
      el('span', { class: 'act-ico' }, e.ico),
      el('div', { class: 'act-main' }, [
        el('div', { class: 'act-title' }, e.title),
        e.desc ? el('div', { class: 'act-desc', style: 'font-size: .82rem; color: var(--steel); margin: 3px 0 4px 0; line-height: 1.3;' }, e.desc) : null,
        el('div', { class: 'act-sub' }, e.sub),
      ]),
      el('span', { class: 'time-pill' }, fmt(new Date(e.ts).toISOString())),
    ]);
  }

  function checklistLogDetailByIdView(runId) {
    return {
      title: t('checklist'), tab: 'groups',
      async render(app) {
        app.append(el('div', { class: 'loading' }, 'Loading log details...'));
        const { data: run, error } = await db.from('checklist_runs').select('*').eq('id', runId).single();
        if (error || !run) {
          app.innerHTML = '';
          app.append(emptyState(t('error'), 'Log not found'));
          return;
        }
        const { data: checklist } = await db.from('checklists').select('*').eq('id', run.checklist_id).single();
        app.innerHTML = '';
        const view = checklistLogDetailView(run, checklist);
        await view.render(app);
      }
    };
  }

  function procedureSubmissionByIdView(submissionId) {
    return {
      title: 'Procedure entry', tab: 'groups',
      async render(app) {
        app.append(el('div', { class: 'loading' }, 'Loading submission...'));
        const { data: s, error } = await db.from('procedure_submissions').select('*').eq('id', submissionId).single();
        if (error || !s) {
          app.innerHTML = '';
          app.append(emptyState(t('error'), 'Entry not found'));
          return;
        }
        const { data: p } = await db.from('procedures').select('*').eq('id', s.procedure_id).single();
        if (!p) {
          app.innerHTML = '';
          app.append(emptyState(t('error'), 'Procedure not found'));
          return;
        }
        app.innerHTML = '';
        app.append(el('h2', { class: 'display', style: 'margin-top:0' }, p.title));
        const card = el('div', { class: 'card' }, [
          el('div', { class: 'muted', style: 'font-size:.8rem;margin-bottom:8px' }, `${nameOf(s.user_id)} · ${fmt(s.created_at)}`),
        ]);
        for (const f of p.fields || []) {
          const v = s.answers[f.key];
          card.append(el('div', { style: 'margin-bottom:6px' }, [
            el('span', { class: 'muted', style: 'font-size:.82rem' }, f.label + ': '),
            el('span', {}, v === true ? 'Yes' : v === false ? 'No'
              : Array.isArray(v) ? (v.length ? v.join(', ') : '—') : String(v ?? '—')),
          ]));
        }
        app.append(card);
      }
    };
  }

  // Render a pre-built, scoped event list as the shared "Latest activity" feed.
  // (Overview builds its own multi-surface feed in renderActivityFeed; the other
  // tabs feed this their own already-fetched rows so the look stays identical.)
  function renderEventFeed(host, ev) {
    ev.sort((a, b) => b.ts - a.ts);
    host.append(el('div', { class: 'kpi-section-h' }, t('latestActivity')));
    if (!ev.length) {
      host.append(el('div', { class: 'kpi-card' }, el('p', { class: 'miss-sub' }, t('noActivityYet'))));
      return;
    }
    const feed = el('div', { class: 'act-feed' });
    ev.slice(0, 18).forEach(e => feed.append(activityRow(e)));
    host.append(feed);
  }

  // Point-in-time incident workload — drives the "RIGHT NOW" live cards on the
  // incidents + admin-performance tabs (mirrors overview's live trio).
  async function liveIncidentState() {
    const [backlog, unassigned, oldestRow] = await Promise.all([
      countRows(db.from('incidents').select('id', { count: 'exact', head: true }).neq('status', 'resolved')),
      countRows(db.from('incidents').select('id', { count: 'exact', head: true }).eq('status', 'open').is('assigned_to', null)),
      db.from('incidents').select('created_at').neq('status', 'resolved').order('created_at', { ascending: true }).limit(1),
    ]);
    const oldestDays = oldestRow.data?.[0]
      ? Math.floor((Date.now() - new Date(oldestRow.data[0].created_at)) / DAYMS) : 0;
    return { backlog, unassigned, oldestDays };
  }
  function liveStateCards(s) {
    return el('div', { class: 'kpi-grid' }, [
      metricCard({ label: t('openBacklog'), value: s.backlog, live: true }),
      metricCard({ label: t('unassigned'), value: s.unassigned, live: true }),
      metricCard({ label: t('oldestOpen'), value: s.oldestDays + 'd', live: true }),
    ]);
  }

  // Shared "breakdown bar" for consequence/root-cause severity strips — renders a
  // proportional bar + legend from already-fetched incident rows, and makes each
  // segment jump to the Reports list pre-filtered to that value (Executive Analytics
  // consequence/root-cause click-through).
  function renderBreakdownBar(host, rows, cats, idsField, palette, labelKey, filterKind, options = {}) {
    const { activeIds = new Set(), onSelect = null } = options;
    const counts = (cats || []).map(c => ({
      id: c.id, name: c.name, color: palette[c.name] || '#888780',
      n: rows.filter(r => (r[idsField] || []).includes(c.id)).length,
    })).filter(c => c.n > 0).sort((a, b) => b.n - a.n);
    const total = counts.reduce((a, c) => a + c.n, 0);
    if (!total) {
      host.append(el('div', { class: 'kpi-card', style: 'margin-top:14px' }, [
        el('div', { class: 'kpi-label', style: 'margin-bottom:10px' }, t(labelKey)),
        el('p', { class: 'muted', style: 'margin:0' }, t('noReports')),
      ]));
      return;
    }
    const nameKey = filterKind === 'consequenceId' ? 'consequenceName' : 'rootCauseName';
    const goFiltered = (c) => {
      const g = firstGroup('reports');
      if (!g) return toast(t('noIncidentsHint'), 'err');
      go(reportsGroupView(g, { [filterKind]: c.id, [nameKey]: c.name }));
    };
    const choose = (c) => onSelect ? onSelect(c) : goFiltered(c);
    const bar = el('div', { class: 'sev-bar' }, counts.map(c =>
      el('div', { class: 'sev-segment' + (activeIds.has(c.id) ? ' sev-active' : ''), style: `width:${c.n / total * 100}%;background:${c.color}`, title: `${c.name}: ${c.n}`, onclick: () => choose(c) })));
    const legend = el('div', { class: 'sev-legend' }, counts.map(c =>
      el('span', { class: activeIds.has(c.id) ? 'sev-active' : '', onclick: () => choose(c) }, [el('i', { style: `background:${c.color}` }), `${c.name} ${c.n}`])));
    host.append(el('div', { class: 'kpi-card', style: 'margin-top:14px' }, [
      el('div', { class: 'kpi-label', style: 'margin-bottom:10px' }, t(labelKey)), bar, legend,
    ]));
  }
  const REPORT_TYPE_PALETTE = { incident: '#D85A30', hazard: '#BA7517', suggestion: '#1D9E75' };
  function renderTypeBreakdownBar(host, rows, options = {}) {
    const { activeIds = new Set(), onSelect = null } = options;
    const counts = [
      ['incident', t('reportTypeIncidents')],
      ['hazard', t('reportTypeHazards')],
      ['suggestion', t('reportTypeSuggestions')],
    ].map(([id, name]) => ({
      id, name, color: REPORT_TYPE_PALETTE[id],
      n: rows.filter(r => (r.report_type || 'incident') === id).length,
    })).filter(c => c.n > 0);
    const total = counts.reduce((a, c) => a + c.n, 0);
    if (!total) {
      host.append(el('div', { class: 'kpi-card', style: 'margin-top:14px' }, [
        el('div', { class: 'kpi-label', style: 'margin-bottom:10px' }, t('reportsByType')),
        el('p', { class: 'muted', style: 'margin:0' }, t('noReports')),
      ]));
      return;
    }
    const goFiltered = (c) => {
      const g = firstGroup('reports');
      if (!g) return toast(t('noIncidentsHint'), 'err');
      go(reportsGroupView(g, { reportType: c.id, reportTypeName: c.name }));
    };
    const choose = (c) => onSelect ? onSelect(c) : goFiltered(c);
    const bar = el('div', { class: 'sev-bar' }, counts.map(c =>
      el('div', { class: 'sev-segment' + (activeIds.has(c.id) ? ' sev-active' : ''), style: `width:${c.n / total * 100}%;background:${c.color}`, title: `${c.name}: ${c.n}`, onclick: () => choose(c) })));
    const legend = el('div', { class: 'sev-legend' }, counts.map(c =>
      el('span', { class: activeIds.has(c.id) ? 'sev-active' : '', onclick: () => choose(c) }, [el('i', { style: `background:${c.color}` }), `${c.name} ${c.n}`])));
    host.append(el('div', { class: 'kpi-card', style: 'margin-top:14px' }, [
      el('div', { class: 'kpi-label', style: 'margin-bottom:10px' }, t('reportsByType')), bar, legend,
    ]));
  }
  const CONSEQUENCE_PALETTE = { 'Operational disruption': '#888780', 'Financial loss': '#BA7517',
    'Environmental impact': '#1D9E75', 'Injury or sick leave': '#D85A30', 'Death': '#A32D2D' };
  const ROOT_CAUSE_PALETTE = { 'Faulty procedures': '#6C5CE7', 'Human error': '#E17055',
    'Equipment failure': '#0984E3', 'Lack of training': '#00B894' };

  // Overview "Reports by type" spans five surfaces (reports + checklists + procedures), so
  // it needs its own palette and a renderer fed pre-computed counts (unlike renderTypeBreakdownBar
  // which counts report_type from incident rows). Clicking a segment drills the feed below.
  const OVERVIEW_TYPE_PALETTE = { incident: '#D85A30', hazard: '#BA7517', suggestion: '#1D9E75', checklist: '#0984E3', procedure: '#6C5CE7' };
  function renderOverviewTypeBar(host, counts, { activeIds = new Set(), onSelect }) {
    const items = counts.filter(c => c.n > 0);
    const total = items.reduce((a, c) => a + c.n, 0);
    if (!total) {
      host.append(el('div', { class: 'kpi-card', style: 'margin-top:14px' }, [
        el('div', { class: 'kpi-label', style: 'margin-bottom:10px' }, t('reportsByType')),
        el('p', { class: 'muted', style: 'margin:0' }, t('noReports')),
      ]));
      return;
    }
    const bar = el('div', { class: 'sev-bar' }, items.map(c =>
      el('div', { class: 'sev-segment' + (activeIds.has(c.id) ? ' sev-active' : ''), style: `width:${c.n / total * 100}%;background:${c.color}`, title: `${c.name}: ${c.n}`, onclick: () => onSelect(c) })));
    const legend = el('div', { class: 'sev-legend' }, items.map(c =>
      el('span', { class: activeIds.has(c.id) ? 'sev-active' : '', onclick: () => onSelect(c) }, [el('i', { style: `background:${c.color}` }), `${c.name} ${c.n}`])));
    host.append(el('div', { class: 'kpi-card', style: 'margin-top:14px' }, [
      el('div', { class: 'kpi-label', style: 'margin-bottom:10px' }, t('reportsByType')), bar, legend,
    ]));
  }

  // ── INCIDENTS ───────────────────────────────────────────────
  // Renders the Incidents KPI block synchronously from an already-fetched, in-memory
  // dataset (`data` = { all, cats, rootCauseCats, live } from ensureIncidents), so every
  // filter change recomputes the cards, bars and activity feed with zero network.
  function renderIncidentsKpi(host, { cur, prev, statusSet = new Set(), rootCauseSet = new Set(), reportTypeSet = new Set(), consequenceSet = new Set(), data, refresh = () => {} }) {
    const reportTypeKey = 'adminKpiIncidentReportType';
    const consequenceKey = 'adminKpiIncidentConsequence';
    const rootCauseKey = 'adminKpiRootCause';
    const { all = [], cats = [], rootCauseCats = [], live } = data || {};

    // Validate sets against existing options
    const validStatuses = new Set(['open', 'in_progress', 'resolved']);
    for (const x of statusSet) {
      if (!validStatuses.has(x)) statusSet.delete(x);
    }
    const validReportTypes = new Set(['incident', 'hazard', 'suggestion']);
    for (const x of reportTypeSet) {
      if (!validReportTypes.has(x)) reportTypeSet.delete(x);
    }
    for (const x of consequenceSet) {
      if (!cats.some(c => c.id === x)) consequenceSet.delete(x);
    }
    for (const x of rootCauseSet) {
      if (!rootCauseCats.some(c => c.id === x)) rootCauseSet.delete(x);
    }

    const seriousNames = ['Death', 'Injury or sick leave', 'Environmental impact'];
    const seriousIds = cats.filter(c => seriousNames.includes(c.name)).map(c => c.id);

    // Window bounds as epoch ms — robust against timestamptz formatting (+00:00 vs Z).
    const curS = +new Date(cur.start), curE = +new Date(cur.end);
    const prevS = +new Date(prev.start), prevE = +new Date(prev.end);
    const inWin = (ts, s, e) => { if (!ts) return false; const t = +new Date(ts); return t >= s && t < e; };

    // Client-side equivalent of the old server-side scope() (status + report type +
    // jsonb-array consequence/root-cause membership).
    const matches = (r) =>
      (statusSet.size === 0 || statusSet.has(r.status)) &&
      (reportTypeSet.size === 0 || reportTypeSet.has(r.report_type || 'incident')) &&
      (consequenceSet.size === 0 || (r.consequence_ids || []).some(id => consequenceSet.has(id))) &&
      (rootCauseSet.size === 0 || (r.root_cause_ids || []).some(id => rootCauseSet.has(id)));

    const matchesExcludingType = (r) =>
      (statusSet.size === 0 || statusSet.has(r.status)) &&
      (consequenceSet.size === 0 || (r.consequence_ids || []).some(id => consequenceSet.has(id))) &&
      (rootCauseSet.size === 0 || (r.root_cause_ids || []).some(id => rootCauseSet.has(id)));

    const matchesExcludingConsequence = (r) =>
      (statusSet.size === 0 || statusSet.has(r.status)) &&
      (reportTypeSet.size === 0 || reportTypeSet.has(r.report_type || 'incident')) &&
      (rootCauseSet.size === 0 || (r.root_cause_ids || []).some(id => rootCauseSet.has(id)));

    const matchesExcludingRootCause = (r) =>
      (statusSet.size === 0 || statusSet.has(r.status)) &&
      (reportTypeSet.size === 0 || reportTypeSet.has(r.report_type || 'incident')) &&
      (consequenceSet.size === 0 || (r.consequence_ids || []).some(id => consequenceSet.has(id)));

    const filtered = all.filter(matches);
    const rows = filtered.filter(r => inWin(r.created_at, curS, curE));
    const typeRows = all.filter(matchesExcludingType).filter(r => inWin(r.created_at, curS, curE));
    const consequenceRows = all.filter(matchesExcludingConsequence).filter(r => inWin(r.created_at, curS, curE));
    const rootCauseRows = all.filter(matchesExcludingRootCause).filter(r => inWin(r.created_at, curS, curE));

    const prevRows = filtered.filter(r => inWin(r.created_at, prevS, prevE));
    const inSet = (ids, set) => (ids || []).some(id => set.includes(id));
    const repCur = rows.length, repPrev = prevRows.length;
    const serCur = rows.filter(r => inSet(r.consequence_ids, seriousIds)).length;
    const serPrev = prevRows.filter(r => inSet(r.consequence_ids, seriousIds)).length;
    const anonCur = repCur ? Math.round(rows.filter(r => r.is_anonymous).length / repCur * 100) : 0;
    const anonPrev = repPrev ? Math.round(prevRows.filter(r => r.is_anonymous).length / prevRows.length * 100) : 0;
    const resolvedCur = filtered.filter(r => r.status === 'resolved' && inWin(r.resolved_at, curS, curE));
    const resCur = resolvedCur.length;
    const resPrev = filtered.filter(r => r.status === 'resolved' && inWin(r.resolved_at, prevS, prevE)).length;

    // ── Right now (live, point-in-time workload) ──
    host.append(el('div', { class: 'kpi-section-h' }, t('rightNow')));
    const resetDrill = () => {
      [reportTypeKey, consequenceKey, rootCauseKey].forEach(removeStorageValue);
      refresh();
    };
    const reportTypeLabel = (id) => ({
      incident: t('reportTypeIncidents'),
      hazard: t('reportTypeHazards'),
      suggestion: t('reportTypeSuggestions'),
    }[id] || id);

    // Save helper functions
    const saveReportTypes = (set) => { set.size ? setStorageValue(reportTypeKey, [...set].join(',')) : removeStorageValue(reportTypeKey); refresh(); };
    const saveConsequences = (set) => { set.size ? setStorageValue(consequenceKey, [...set].join(',')) : removeStorageValue(consequenceKey); refresh(); };
    const saveRootCauses = (set) => { set.size ? setStorageValue(rootCauseKey, [...set].join(',')) : removeStorageValue(rootCauseKey); refresh(); };

    // Build active chips for multi-select
    const activeChips = [];
    for (const id of reportTypeSet) {
      activeChips.push({
        label: reportTypeLabel(id),
        onclick: () => {
          const next = new Set(reportTypeSet);
          next.delete(id);
          saveReportTypes(next);
        }
      });
    }
    for (const id of consequenceSet) {
      const name = cats.find(c => c.id === id)?.name;
      if (name) {
        activeChips.push({
          label: name,
          onclick: () => {
            const next = new Set(consequenceSet);
            next.delete(id);
            saveConsequences(next);
          }
        });
      }
    }
    for (const id of rootCauseSet) {
      const name = rootCauseCats.find(c => c.id === id)?.name;
      if (name) {
        activeChips.push({
          label: name,
          onclick: () => {
            const next = new Set(rootCauseSet);
            next.delete(id);
            saveRootCauses(next);
          }
        });
      }
    }

    if (activeChips.length) {
      host.append(el('div', { class: 'kpi-drillbar' }, [
        el('span', { class: 'kpi-drill-label' }, `${t('filteredBy')}:`),
        ...activeChips.map(c => el('button', { class: 'kpi-drill-chip', onclick: c.onclick }, `x ${c.label}`)),
        activeChips.length > 1 ? el('button', { class: 'btn btn-ghost btn-sm', onclick: resetDrill }, t('clearFilter')) : null,
      ]));
    }

    host.append(liveStateCards(live || { backlog: 0, unassigned: 0, oldestDays: 0 }));

    // ── In this period (vs the previous equal-length window) ──

      if (next.has(c.id)) next.delete(c.id);
      else next.add(c.id);
      saveRootCauses(next);

  async function renderChecklistsKpi(host, { period, prev, checklists, selectedCls = new Set(), saveChecklists = () => {}, refresh = () => {}, runsData }) {
    const cur = periodBounds(period);
    const scope = selectedCls.size === 0 ? checklists : checklists.filter(c => selectedCls.has(c.id));
    const scopeIds = scope.map(c => c.id);

    // expected = Σ quota × qualifying days
    const expected = scope.reduce((sum, c) => sum + c.daily_quota * qualifyingDays(period, c.quota_weekdays), 0);

    // Completion events for the range, current and previous. We count completed
    // checklist_runs (checklist_completions is not reliably written), normalising
    // each submission to its date so the per-day shortfall maths is unchanged.
    const getEvents = (b) => {
      const filtered = (runsData?.runs || []).filter(r => r.submitted_at >= b.start && r.submitted_at < b.end && scopeIds.includes(r.checklist_id));
      return filtered.map(r => ({ checklist_id: r.checklist_id, completed_on: localDateString(new Date(r.submitted_at)) }));
    };
    const ev = getEvents(cur);
    const evPrev = getEvents(prev);

    // Build active chips for multi-select
    const activeChips = [];
    for (const id of selectedCls) {
      const title = checklists.find(c => c.id === id)?.title;
      if (title) {
        activeChips.push({
          label: title,
          onclick: () => {
            const next = new Set(selectedCls);
            next.delete(id);
            saveChecklists(next);
          }
        });
      }
    }

    const completions = ev.length;
    const prevPeriod = { from: prev.start.slice(0, 10), until: new Date(new Date(prev.end) - DAYMS).toISOString().slice(0, 10) };
    const expectedPrev = scope.reduce((sum, c) => sum + c.daily_quota * qualifyingDays(prevPeriod, c.quota_weekdays), 0);
    const rateCur = expected ? Math.round(completions / expected * 100) : 0;
    const ratePrev = expectedPrev ? Math.round(evPrev.length / expectedPrev * 100) : 0;

    // per checklist, per day → shortfalls
    const got = {}; // got[checklistId][YYYY-MM-DD] = count
    ev.forEach(e => { (got[e.checklist_id] ||= {})[e.completed_on] = ((got[e.checklist_id]?.[e.completed_on]) || 0) + 1; });
    const shortfalls = [];
    scope.forEach(c => {
      const set = new Set((c.quota_weekdays || [0,1,2,3,4,5,6]).map(Number));
      const d = new Date(period.from + 'T00:00:00'); const end = new Date(period.until + 'T00:00:00');
      for (; d <= end; d.setDate(d.getDate() + 1)) {
        if (!set.has(d.getDay())) continue;
        const key = localDateString(d);
        const n = got[c.id]?.[key] || 0;
        if (n < c.daily_quota) shortfalls.push({ title: c.title, date: new Date(d), exp: c.daily_quota, got: n, short: c.daily_quota - n });
      }
    });
    const missed = shortfalls.reduce((a, s) => a + s.short, 0);

    const drillHost = el('div', { style: 'margin-top:12px' });
    let open = false;
    let showAllMissed = false;
    const drawDrill = () => {
      drillHost.innerHTML = '';
      if (!open) return;
      if (!missed) { drillHost.append(el('div', { class: 'kpi-card' }, '✓ ' + t('everyChecklistHitQuota'))); return; }
      const card = el('div', { class: 'kpi-card' }, [
        el('div', { class: 'kpi-label' }, t('belowQuotaAcross', { missed, days: shortfalls.length })),
      ]);
      const limit = showAllMissed ? shortfalls.length : 12;
      shortfalls.slice(0, limit).forEach(s => card.append(el('div', { class: 'miss-row' }, [
        el('div', { class: 'miss-top' }, [
          el('span', { style: 'flex:1' }, s.title),
          el('span', { class: 'miss-pill' }, t('shortCount', { count: s.short })),
        ]),
        el('p', { class: 'miss-sub' }, `${s.date.getDate()} ${s.date.toLocaleString(currentLanguage(), { month: 'short' })} - ${t('expectedGot', { expected: s.exp, got: s.got })}`),
      ])));
      if (shortfalls.length > 12) {
        card.append(showAllMissed
          ? el('button', { class: 'miss-more', onclick: () => { showAllMissed = false; drawDrill(); } }, t('showLess'))
          : el('button', { class: 'miss-more', onclick: () => { showAllMissed = true; drawDrill(); } }, `+ ${shortfalls.length - 12} ${t('more')}`));
      }
      card.append(el('p', { class: 'miss-sub', style: 'padding-top:10px' }, t('expectedNote')));
      drillHost.append(card);
    };

    // ── Right now (live, today's quota state for the selected scope) ──
    const todayB = todayBounds();
    const todayDow = new Date().getDay();
    const dueToday = scope.reduce((s, c) => {
      const set = new Set((c.quota_weekdays || [0, 1, 2, 3, 4, 5, 6]).map(Number));
      return s + (set.has(todayDow) ? c.daily_quota : 0);
    }, 0);
    const doneToday = (runsData?.todayRuns || []).filter(r => scopeIds.includes(r.checklist_id)).length;
    const pendingToday = Math.max(0, dueToday - doneToday);

    host.append(el('div', { class: 'kpi-section-h' }, t('rightNow')));

    if (activeChips.length) {
      host.append(el('div', { class: 'kpi-drillbar' }, [
        el('span', { class: 'kpi-drill-label' }, `${t('filteredBy')}:`),
        ...activeChips.map(c => el('button', { class: 'kpi-drill-chip', onclick: c.onclick }, `x ${c.label}`)),
        activeChips.length > 1 ? el('button', { class: 'btn btn-ghost btn-sm', onclick: () => saveChecklists(new Set()) }, t('clearFilter')) : null,
      ]));
    }

    host.append(el('div', { class: 'kpi-grid' }, [
      metricCard({ label: t('activeChecklists'), value: scope.length, live: true }),
      metricCard({ label: t('dueToday'), value: dueToday, live: true }),
      metricCard({ label: t('completedToday'), value: doneToday, live: true }),
      metricCard({ label: t('pendingToday'), value: pendingToday, live: true }),
    ]));

    // ── In this period (vs the previous equal-length window) ──
    host.append(el('div', { class: 'kpi-section-h' }, t('inThisPeriod')));
    host.append(el('div', { class: 'kpi-grid' }, [
      metricCard({ label: t('checklistsCompletedInPeriod'), value: completions, delta: pctChange(completions, evPrev.length), good: isGood(completions, evPrev.length, 'up') }),
      metricCard({ label: t('completionRate'), value: rateCur + '%', delta: pctChange(rateCur, ratePrev), good: isGood(rateCur, ratePrev, 'up') }),
      metricCard({ label: t('missed'), value: missed, delta: pctChange(missed, 0), good: isGood(missed, 0, 'down'), hint: t('seeWhich') + ' ▾', onClick: () => { open = !open; drawDrill(); } }),
    ]));
    host.append(drillHost);

    const titleOf = (id) => (checklists.find(c => c.id === id)?.title) || t('checklist');
    const userName = (id) => { const p = state.profiles.find(u => u.id === id); return p ? labelOf(p) : '—'; };

    const allPeriodRuns = (runsData?.runs || [])
      .filter(r => r.submitted_at >= cur.start && r.submitted_at < cur.end)
      .sort((a, b) => b.submitted_at.localeCompare(a.submitted_at));
    const periodRuns = allPeriodRuns.filter(r => scopeIds.includes(r.checklist_id));
    const filedByChecklist = {};
    periodRuns.forEach(r => (filedByChecklist[r.checklist_id] ||= []).push(r));

    const split = el('div', { class: 'cl-split' });

    // ── Latest activity — checklist submissions in this window/scope ──
    const latestCard = el('div', { class: 'kpi-card cl-latest' });
    latestCard.append(el('div', { class: 'kpi-label', style: 'margin-bottom:8px' }, t('latestActivity')));

    const feedEv = periodRuns.slice(0, 18).map(r => ({
      ts: +new Date(r.submitted_at), type: 'checklist', ico: '☑️',
      title: t('actChecklistDone'), sub: `${titleOf(r.checklist_id)} · ${userName(r.user_id)}`,
    }));

    if (!feedEv.length) {
      latestCard.append(el('p', { class: 'miss-sub' }, t('noActivityYet')));
    } else {
      const feed = el('div', { class: 'act-feed' });
      feedEv.forEach(e => feed.append(activityRow(e)));
      latestCard.append(feed);
    }

    // ── Expected vs received — one row per checklist that has a daily quota ──
    const expCard = el('div', { class: 'kpi-card cl-expected' });
    expCard.append(el('div', { class: 'kpi-label', style: 'margin-bottom:8px' }, t('expectedVsReceived')));
    if (!scope.length) expCard.append(el('p', { class: 'miss-sub' }, t('noRecentChecklists')));
    else scope.slice().sort((a, b) => a.title.localeCompare(b.title)).forEach(c => {
      const filed = filedByChecklist[c.id] || [];
      const got = filed.length;
      // Expected across the whole selected range, not per day: daily quota × the
      // number of qualifying days (e.g. 1/day over 28 days → 28 expected).
      const expRange = c.daily_quota * qualifyingDays(period, c.quota_weekdays);
      const drill = el('div', { class: 'cl-filed hidden' });
      const drawDrill = () => {
        drill.innerHTML = '';
        if (!filed.length) { drill.append(el('p', { class: 'miss-sub' }, t('noRecentChecklists'))); return; }
        filed.slice(0, 20).forEach(r => drill.append(el('div', { class: 'cl-filed-row' }, [
          el('span', { class: 'miss-sub', style: 'flex:1' }, userName(r.user_id)),
          el('span', { class: 'time-pill' }, fmt(r.submitted_at)),
        ])));
        if (filed.length > 20) drill.append(el('p', { class: 'miss-sub', style: 'padding-top:6px' }, `+ ${filed.length - 20} more`));
      };
      const row = el('div', { class: 'exp-row', title: t('whenFiled'), onclick: () => {
        if (drill.classList.toggle('hidden') === false && !drill.childElementCount) drawDrill();
      } }, [
        el('div', { class: 'exp-head' }, [
          el('span', { class: 'exp-name' }, c.title),
          el('span', { class: 'exp-got', title: t('receivedLabel') }, String(got)),
          el('span', { class: 'exp-quota', title: t('expectedInRange') }, `/${expRange}`),
        ]),
        drill,
      ]);
      expCard.append(row);
    });

    const CHECKLIST_COLORS = ['#0984E3', '#6C5CE7', '#00B894', '#E17055', '#D85A30', '#BA7517', '#1D9E75', '#A32D2D'];
    const counts = checklists.map((c, i) => ({
      id: c.id, name: c.title, color: CHECKLIST_COLORS[i % CHECKLIST_COLORS.length],
      n: allPeriodRuns.filter(r => r.checklist_id === c.id).length
    })).filter(c => c.n > 0).sort((a, b) => b.n - a.n);

    const total = counts.reduce((a, c) => a + c.n, 0);
    const drawBreakdownBar = () => {
      if (!total) return null;
      const bar = el('div', { class: 'sev-bar' }, counts.map(c =>
        el('div', {
          class: 'sev-segment' + (selectedCls.has(c.id) ? ' sev-active' : ''),
          style: `width:${c.n / total * 100}%;background:${c.color}`,
          title: `${c.name}: ${c.n}`,
          onclick: () => {
            const next = new Set(selectedCls);
            if (next.has(c.id)) next.delete(c.id);
            else next.add(c.id);
            saveChecklists(next);
          }
        })));

      const legend = el('div', { class: 'sev-legend' }, counts.map(c =>
        el('span', {
          class: selectedCls.has(c.id) ? 'sev-active' : '',
          onclick: () => {
            const next = new Set(selectedCls);
            if (next.has(c.id)) next.delete(c.id);
            else next.add(c.id);
            saveChecklists(next);
          }
        }, [el('i', { style: `background:${c.color}` }), `${c.name} ${c.n}`])));

      return el('div', { class: 'kpi-card', style: 'margin-top:14px' }, [
        el('div', { class: 'kpi-label', style: 'margin-bottom:10px' }, t('kpiChecklists')),
        bar,
        legend
      ]);
    };

    const breakdown = drawBreakdownBar();
    if (breakdown) host.append(breakdown);

    split.append(latestCard, expCard);
    host.append(split);
  }

  async function renderAdminPerformanceKpi(host, { adminId, saveAdmin }) {
    const admins = state.profiles.filter(p => isAdminPlus(p));
    if (!admins.length) {
      host.append(emptyState(t('noAdminsFound'), t('createOrPromoteAdmin')));
      return;
    }
    const today = todayBounds();
    const rpc = await db.rpc('admin_performance_kpi', {
      p_today_start: today.start,
      p_today_end: today.end,
    });
    let stats;
    if (!rpc.error && Array.isArray(rpc.data)) {
      const byId = new Map(rpc.data.map(s => [s.id, s]));
      stats = admins.map(p => {
        const s = byId.get(p.id) || {};
        return {
          id: p.id,
          name: labelOf(p),
          assigned: Number(s.assigned || 0),
          completed: Number(s.completed || 0),
          completedToday: Number(s.completedToday || 0),
        };
      });
    } else {
      const statFor = async (id) => {
        const [assigned, completed, completedToday] = await Promise.all([
          countRows(db.from('incidents').select('id', { count: 'exact', head: true }).eq('assigned_to', id)),
          countRows(db.from('incidents').select('id', { count: 'exact', head: true }).eq('assigned_to', id).eq('status', 'resolved')),
          countRows(db.from('incidents').select('id', { count: 'exact', head: true }).eq('assigned_to', id).eq('status', 'resolved').gte('resolved_at', today.start).lt('resolved_at', today.end)),
        ]);
        return { assigned: assigned || 0, completed: completed || 0, completedToday: completedToday || 0 };
      };
      stats = await Promise.all(admins.map(async p => ({ id: p.id, name: labelOf(p), ...(await statFor(p.id)) })));
    }

    // metric cards — aggregate across everyone for "all", else the selected admin
    const pick = adminId === 'all'
      ? stats.reduce((a, s) => ({ assigned: a.assigned + s.assigned, completed: a.completed + s.completed, completedToday: a.completedToday + s.completedToday }), { assigned: 0, completed: 0, completedToday: 0 })
      : (stats.find(x => x.id === adminId) || { assigned: 0, completed: 0, completedToday: 0 });
    const completionRate = pick.assigned ? Math.round(pick.completed / pick.assigned * 100) : 0;

    // ── Right now (live, point-in-time workload waiting on admins) ──
    host.append(el('div', { class: 'kpi-section-h' }, t('rightNow')));
    host.append(liveStateCards(await liveIncidentState()));

    // ── Workload (totals for the selected admin / everyone) ──
    host.append(el('div', { class: 'kpi-section-h' }, t('kpiWorkload')));
    host.append(el('div', { class: 'kpi-grid' }, [
      metricCard({ label: t('assignedReports'), value: pick.assigned }),
      metricCard({ label: t('completedTotal'), value: pick.completed }),
      metricCard({ label: t('completionRate'), value: completionRate + '%' }),
      metricCard({ label: t('completedToday'), value: pick.completedToday }),
    ]));

    // graph — completed vs assigned per admin, tallest bar normalises the width
    const max = Math.max(1, ...stats.map(s => s.assigned));
    const chart = el('div', { class: 'kpi-card', style: 'margin-top:14px' }, [
      el('div', { class: 'kpi-label', style: 'margin-bottom:12px' }, t('completionByAdmin')),
    ]);
    stats.slice().sort((a, b) => b.completed - a.completed).forEach(s => {
      const rate = s.assigned ? Math.round(s.completed / s.assigned * 100) : 0;
      chart.append(el('div', {
        class: 'perf-row' + (s.id === adminId ? ' perf-row-active' : ''),
        onclick: () => {
          saveAdmin(adminId === s.id ? 'all' : s.id);
        }
      }, [
        el('div', { class: 'perf-name', title: s.name }, s.name),
        el('div', { class: 'perf-track' }, [
          el('div', { class: 'perf-fill', style: `width:${s.completed / max * 100}%` }),
        ]),
        el('div', { class: 'perf-val' }, `${s.completed}/${s.assigned} · ${rate}%`),
      ]));
    });
    host.append(chart);

    // ── Latest activity — most recent resolutions by admins ──
    const feedRows = (q) => q.then(r => r.data || [], () => []);
    let rq = db.from('incidents').select('id,report_type,assigned_to,resolved_at')
      .eq('status', 'resolved').not('resolved_at', 'is', null).not('assigned_to', 'is', null)
      .order('resolved_at', { ascending: false }).limit(18);
    if (adminId !== 'all') rq = rq.eq('assigned_to', adminId);
    const resolvedRows = await feedRows(rq);
    const ev = resolvedRows.map(r => ({
      ts: +new Date(r.resolved_at), type: 'resolved', ico: '✅',
      title: t('actReportResolved'), sub: `${typeLabel(r.report_type)} · ${whoName(r.assigned_to)}`, id: r.id,
    }));
    renderEventFeed(host, ev);
  }

  // ── shared incident helpers ─────────────────────────────────
  async function seriousConsequenceIds() {
    if (cache.seriousIds && fresh(cache.seriousIdsAt)) return cache.seriousIds;
    const { data: cats } = await db.from('incident_categories').select('id,name').eq('kind', 'consequence');
    const names = ['Death', 'Injury or sick leave', 'Environmental impact'];
    cache.seriousIds = (cats || []).filter(c => names.includes(c.name)).map(c => c.id);
    cache.seriousIdsAt = Date.now();
    return cache.seriousIds;
  }
  async function seriousCount(bounds, seriousIds) {
    if (!seriousIds.length) return 0;
    const { data = [] } = await db.from('incidents').select('consequence_ids').gte('created_at', bounds.start).lt('created_at', bounds.end);
    return data.filter(r => (r.consequence_ids || []).some(id => seriousIds.includes(id))).length;
  }
  async function resolveTimes(bounds) {
    const { data = [] } = await db.from('incidents').select('created_at,resolved_at')
      .eq('status', 'resolved').gte('resolved_at', bounds.start).lt('resolved_at', bounds.end);
    return data;
  }

  async function countRows(query) {
    const { count, error } = await query;
    return error ? null : (count || 0);
  }

  async function saveSortOrder(table, rows) {
    const payload = rows.map((row, idx) => ({ id: row.id, sort_order: (idx + 1) * 10 }));
    if (!payload.length) return true;
    const bulk = await db.from(table).upsert(payload, { onConflict: 'id' });
    if (!bulk.error) return true;

    for (const [idx, row] of rows.entries()) {
      const { error } = await db.from(table).update({ sort_order: (idx + 1) * 10 }).eq('id', row.id);
      if (error) {
        toast(error.message + ' - run migration_reorderable_content.sql if this list cannot save order.', 'err');
        return false;
      }
    }
    return true;
  }



  function todayBounds() {
    const start = new Date();
    start.setHours(0, 0, 0, 0);
    const end = new Date(start);
    end.setDate(end.getDate() + 1);
    return { start: start.toISOString(), end: end.toISOString() };
  }

  function localDateString(date = new Date()) {
    const yyyy = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  function kpiPeriod(storageKey) {
    const today = localDateString();
    const saved = storageJson(storageKey, null);
    if (saved?.from && saved?.until) return saved;
    return { from: today, until: today };
  }

  function periodBounds(period) {
    const start = new Date(`${period.from}T00:00:00`);
    const end = new Date(`${period.until}T00:00:00`);
    end.setDate(end.getDate() + 1);
    return { start: start.toISOString(), end: end.toISOString() };
  }

  // Day/Week/Month → a {from, until} range ending today, computed live.
  function presetBounds(kind) {
    const now = new Date();
    const today = localDateString(now);
    if (kind === 'week') {
      const d = new Date(now);
      d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); // back to Monday
      return { from: localDateString(d), until: today };
    }
    if (kind === 'month') {
      return { from: localDateString(new Date(now.getFullYear(), now.getMonth(), 1)), until: today };
    }
    return { from: today, until: today };
  }

  function periodLabel(period) {
    return period.from === period.until ? period.from : `${period.from} - ${period.until}`;
  }

  function saveKpiPeriod(storageKey, from, until, refreshHome) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(from || '') || !/^\d{4}-\d{2}-\d{2}$/.test(until || '')) {
      toast(t('invalidPeriod'), 'err');
      return;
    }
    const ordered = from <= until ? { from, until } : { from: until, until: from };
    setStorageJson(storageKey, ordered);
    refreshHome();
  }

  function changeKpiPeriod(storageKey) {
    const current = kpiPeriod(storageKey);
    const raw = prompt(`${t('dashboardPeriod')}\n${t('periodPrompt')}`, `${current.from}..${current.until}`);
    if (!raw) return;
    const normalized = raw.trim().replace(/\s+to\s+/i, '..').replace(/\s*,\s*/g, '..');
    const parts = (normalized.includes('..') ? normalized.split('..') : normalized.split(/\s+/)).map(p => p.trim()).filter(Boolean);
    const from = parts[0];
    const until = parts[1] || parts[0];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(from || '') || !/^\d{4}-\d{2}-\d{2}$/.test(until || '')) {
      toast(t('invalidPeriod'), 'err');
      return;
    }
    const ordered = from <= until ? { from, until } : { from: until, until: from };
    setStorageJson(storageKey, ordered);
    go(homeView(), { reset: true });
  }

  // Inclusive date-range test against an ISO timestamp; bounds are YYYY-MM-DD strings.
  function inDateRange(iso, fromStr, untilStr) {
    if (!fromStr && !untilStr) return true;
    if (!iso) return false;
    const ms = new Date(iso).getTime();
    if (fromStr && ms < new Date(fromStr + 'T00:00:00').getTime()) return false;
    if (untilStr && ms > new Date(untilStr + 'T23:59:59.999').getTime()) return false;
    return true;
  }

    return ({
      check: t('checklistTypeCheck'),

  function answerValueText(type, answer) {
    if (type === 'check') return answer.value || answer.done ? t('completed') : '-';
    const value = answer.value;
    if (Array.isArray(value)) return value.length ? value.join(', ') : '-';
    if (value === true) return t('yes');
    if (value === false) return t('no');
    return value == null || value === '' ? '-' : String(value);
  }

  function expectedText(item) {
    const rule = item.expected || null;
    if (!rule && !item.fixOnNo) return '';
    const parts = [];
    if (Array.isArray(rule?.values) && rule.values.length) parts.push(rule.values.join(', '));
    if (rule?.min != null) parts.push(`${t('expectedMin')}: ${rule.min}`);
    if (rule?.max != null) parts.push(`${t('expectedMax')}: ${rule.max}`);
    if (rule?.checked != null) parts.push(`${t('expectedChecked')}: ${rule.checked ? t('yes') : t('no')}`);
    if (item.fixOnNo) parts.push(t('fixOnNo'));
    return parts.join(' - ');
  }

  function checklistAnswerNeedsFix(item, answer = {}) {
    if (!answer || answer.value == null || answer.value === '') return !!answer.needs_fix;
    if (item.type === 'choice' && item.fixOnNo && ['no', 'nei'].includes(String(answer.value).trim().toLowerCase())) return true;
    return answerOutsideExpected(item, answer.value) || !!answer.needs_fix;
  }

  function procedureFieldIssues(fields = [], answers = {}) {
    return (fields || []).map(f => {
      const value = answers?.[f.key];
      if (f.required && emptyProcedureAnswer(f, value)) return { field: f, reason: t('missing') };
      if (answerOutsideExpected(f, value)) return { field: f, reason: t('outsideExpected') };
      return null;
    }).filter(Boolean);
  }

  function emptyProcedureAnswer(field, value) {
    if (field.type === 'checkbox') return value !== true;
    if (field.type === 'slider') return value == null || value === '';
    if (field.type === 'checkboxes') return !Array.isArray(value) || !value.length;
    return value == null || String(value).trim() === '';
  }

  function answerOutsideExpected(def, value) {
    const rule = def?.expected || null;
    if (!rule) return false;
    if (rule.checked != null) return !!value !== !!rule.checked;
    if (value == null || value === '') return false;
    if (rule.min != null || rule.max != null) {
      const n = Number(value);
      if (Number.isNaN(n)) return false;
      if (rule.min != null && n < Number(rule.min)) return true;
      if (rule.max != null && n > Number(rule.max)) return true;
      return false;
    }
    if (Array.isArray(rule.values) && rule.values.length) {
      const expected = rule.values.map(v => String(v).trim().toLowerCase()).filter(Boolean);
      if (!expected.length) return false;
      if (Array.isArray(value)) {
        const actual = value.map(v => String(v).trim().toLowerCase()).filter(Boolean);
        return expected.some(v => !actual.includes(v)) || actual.some(v => !expected.includes(v));
      }
      return !expected.includes(String(value).trim().toLowerCase());
    }
    return false;
  }

  // A submitted checklist photo is either a legacy inline data-URL (old rows) or
  // a Storage path (new rows). Resolve it to something an <img> can show.
  async function signedUrls(bucket, paths, expires = 300) {
    const clean = [...new Set((paths || []).filter(Boolean))];
    if (!clean.length) return new Map();
    try {
      const store = db.storage.from(bucket);
      if (typeof store.createSignedUrls === 'function') {
        const { data, error } = await store.createSignedUrls(clean, expires);
        if (!error) {
          return new Map((data || [])
            .map((row, idx) => [row.path || clean[idx], row.signedUrl])
            .filter(([, url]) => !!url));
        }
      }
      const entries = await Promise.all(clean.map(async path => {
        try {
          const { data, error } = await store.createSignedUrl(path, expires);
          return (!error && data?.signedUrl) ? [path, data.signedUrl] : null;
        } catch (err) {
          return null;
        }
      }));
      return new Map(entries.filter(Boolean));
    } catch (err) {
      return new Map();
    }
  }

  async function resolveChecklistPhoto(photo) {
    if (!photo) return '';

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }

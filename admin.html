        async function loadDocs() {
          listHost.innerHTML = '';
          await loadDepartments();
          const q = await fetchGroupItems('documents', g.id, { desc: true });
          let rows = q.data || [];
          if (!rows.length) {
            const genDept = state.departments.find(d => d.name?.toLowerCase() === 'general') || state.departments[0] || { id: 'general', name: 'General' };
            listHost.append(renderDepartmentRow(
              { id: genDept.id, name: genDept.name, items: [] },
              t('noDocumentsHint') || 'Nothing shared here yet.',
              [
                importBtn(g, { table: 'documents', titleOf: d2 => d2.name, onDone: () => loadDocs() }),
              ]
            ));
            return;
          }
          let dragIdx = null;

          const draw = () => {
            listHost.innerHTML = '';
            const depts = state.departments;
            const deptBuckets = depts.map(d => ({ id: d.id, name: d.name, items: [] }));
            const unassignedBucket = { id: 'unassigned', name: t('unassigned') || 'Unassigned', items: [], isUnassigned: true };

            rows.forEach((d, idx) => {
              let itemDepts = normalizeDepartmentIds(d.department_ids);
              if (!itemDepts.length) {
                const genId = generalDepartmentId();
                if (genId) itemDepts = [genId];
              }
              const linked = isLinkedItem(d, g.id);
              const card = libraryCard({
                kind: 'document',
                title: d.name,
                meta: `${(d.size_bytes / 1024 | 0)} KB`,
                sub: linked ? `${t('linked')} · ${fmt(d.created_at)}` : fmt(d.created_at),
                className: linked ? 'item-linked' : '',
                hideKind: true,
                actions: [
                  el('button', { class: 'btn btn-ghost', onclick: e => { e.stopPropagation(); openDoc(d); } }, t('open')),
                  el('button', { class: 'btn btn-danger', title: linked ? t('removeFromGroup') : '', onclick: e => { e.stopPropagation(); removeDoc(d); } }, '×'),
                ],
              });
              card.setAttribute('draggable', 'true');
              card.addEventListener('dragstart', e => {
                dragIdx = idx;
                e.dataTransfer.effectAllowed = 'move';
                card.classList.add('dragging');
              });
              card.addEventListener('dragend', () => { dragIdx = null; card.classList.remove('dragging'); });
              card.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
              card.addEventListener('drop', async e => {
                e.preventDefault();
                if (dragIdx === null || dragIdx === idx) return;
                const [moved] = rows.splice(dragIdx, 1);
                rows.splice(idx, 0, moved);
                dragIdx = null;
                draw();
                await saveSortOrder('documents', rows);
              });

              let placed = false;
              if (itemDepts.length) {
                itemDepts.forEach(did => {
                  const bucket = deptBuckets.find(b => b.id === did);
                  if (bucket) { bucket.items.push(card); placed = true; }
                });
              }
              if (!placed) unassignedBucket.items.push(card);
            });

            const makeRowActions = () => [
              importBtn(g, { table: 'documents', titleOf: d2 => d2.name, onDone: () => loadDocs() }),
            ];
            deptBuckets.forEach(b => listHost.append(renderDepartmentRow(b, '', makeRowActions())));
            if (unassignedBucket.items.length > 0) listHost.append(renderDepartmentRow(unassignedBucket, ''));
          };
          draw();
        }
        async function upload() {
          const f = file.files[0];
          if (!f) return toast(t('chooseFileFirst'), 'err');
          const path = `${g.id}/${crypto.randomUUID()}-${f.name}`;
          const { error: upErr } = await db.storage.from('documents').upload(path, f);
          if (upErr) return toast(upErr.message, 'err');
          const { error } = await db.from('documents').insert({
            group_id: g.id, name: f.name, storage_path: path, mime_type: f.type, size_bytes: f.size,
            department_ids: visibility.get(), uploaded_by: state.profile.id });
          if (error) return toast(error.message, 'err');
          file.value = ''; toast(t('uploaded')); loadDocs();
        }
        async function openDoc(d) {
          const { data, error } = await db.storage.from('documents').createSignedUrl(d.storage_path, 60);
          if (error) return toast(error.message, 'err');
          window.open(data.signedUrl, '_blank');
        }
        async function removeDoc(d) {
          if (isLinkedItem(d, g.id)) {
            const { error } = await unlinkItemFromGroup('documents', d, g.id);
            if (error) return toast(error.message, 'err');
            toast(t('removedFromGroup')); return loadDocs();
          }
          if (!confirm(`Delete "${d.name}"?`)) return;
          await db.storage.from('documents').remove([d.storage_path]);
          const { error } = await db.from('documents').delete().eq('id', d.id);
          if (error) return toast(error.message, 'err');
          loadDocs();
        }
      },
    };
  }

  // ─── PROCEDURES (generic form builder) ──────────────────
  const FIELD_TYPES = [
    ['short', 'selectTypeShort'], ['long', 'selectTypeLong'], ['number', 'selectTypeNumber'],
    ['dropdown', 'selectTypeDropdown'], ['checkbox', 'selectTypeCheckbox'],
    ['checkboxes', 'selectTypeCheckboxes'], ['slider', 'selectTypeSlider'],
  ];
  function proceduresGroupView(g) {
    return {
      title: groupName(g), tab: 'groups',
      action: [], // buttons moved into dept row headers
      async render(app) {
        await loadDepartments();
        const q = await fetchGroupItems('procedures', g.id);
        const data = q.data || [];
        const listHost = el('div', { class: 'dept-group-container' });
        app.append(listHost);
        if (!data?.length) {
          const genDept = state.departments.find(d => d.name?.toLowerCase() === 'general') || state.departments[0] || { id: 'general', name: 'General' };
          listHost.append(renderDepartmentRow(
            { id: genDept.id, name: genDept.name, items: [] },
            t('noProceduresHint') || 'Create readable procedures users can follow.',
            [
              importBtn(g, { table: 'procedures', titleOf: p => p.title, onDone: () => go(proceduresGroupView(g), { reset: true }) }),
              el('button', { class: 'iconbtn', title: t('newProcedure'), onclick: () => go(procedureBuild(g, null)) }, '+'),
            ]
          ));
          return;
        }
        let rows = data.slice();
        let dragIdx = null;
        const draw = () => {
          listHost.innerHTML = '';
          const depts = state.departments;
          const deptBuckets = depts.map(d => ({ id: d.id, name: d.name, items: [] }));
          const unassignedBucket = { id: 'unassigned', name: t('unassigned') || 'Unassigned', items: [], isUnassigned: true };

          rows.forEach((p, idx) => {
            let itemDepts = normalizeDepartmentIds(p.department_ids);
            if (!itemDepts.length) {
              const genId = generalDepartmentId();
              if (genId) itemDepts = [genId];
            }
            const linked = isLinkedItem(p, g.id);
            const card = libraryCard({
              kind: 'procedure',
              title: p.title,
              meta: `${(p.fields || []).length} ${t('procedureSteps')}`,
              sub: linked ? `${t('linked')} · ${p.is_draft ? t('draft') : t('published')}` : (p.is_draft ? t('draft') : t('published')),
              className: linked ? 'item-linked' : '',
              image: p.image || null,
              icon: p.icon || null,
              hideKind: true,
              actions: [
                el('button', { class: 'btn btn-ghost', onclick: e => { e.stopPropagation(); go(submissionsView(p)); } }, t('entries')),
                el('button', { class: 'btn btn-ghost', onclick: e => { e.stopPropagation(); go(procedureBuild(g, p)); } }, t('edit')),
                linked ? el('button', { class: 'btn btn-ghost', title: t('removeFromGroup'), onclick: async e => {
                  e.stopPropagation();
                  const { error } = await unlinkItemFromGroup('procedures', p, g.id);
                  if (error) return toast(error.message, 'err');
                  toast(t('removedFromGroup')); go(proceduresGroupView(g), { reset: true });
                } }, '×') : null,
              ].filter(Boolean),
            });
            card.setAttribute('draggable', 'true');
            card.addEventListener('dragstart', e => {
              dragIdx = idx;
              e.dataTransfer.effectAllowed = 'move';
              card.classList.add('dragging');
            });
            card.addEventListener('dragend', () => { dragIdx = null; card.classList.remove('dragging'); });
            card.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
            card.addEventListener('drop', async e => {
              e.preventDefault();
              if (dragIdx === null || dragIdx === idx) return;
              const [moved] = rows.splice(dragIdx, 1);
              rows.splice(idx, 0, moved);
              dragIdx = null;
              draw();
              await saveSortOrder('procedures', rows);
            });

            let placed = false;
            if (itemDepts.length) {
              itemDepts.forEach(did => {
                const bucket = deptBuckets.find(b => b.id === did);
                if (bucket) { bucket.items.push(card); placed = true; }
              });
            }
            if (!placed) unassignedBucket.items.push(card);
          });

          const makeRowActions = () => [
            importBtn(g, { table: 'procedures', titleOf: p => p.title, onDone: () => go(proceduresGroupView(g), { reset: true }) }),
            el('button', { class: 'iconbtn', title: t('newProcedure'), onclick: () => go(procedureBuild(g, null)) }, '+'),
          ];
          deptBuckets.forEach(b => listHost.append(renderDepartmentRow(b, '', makeRowActions())));
          if (unassignedBucket.items.length > 0) listHost.append(renderDepartmentRow(unassignedBucket, ''));
        };
        draw();
      },
    };
  }

  function procedureBuild(g, existing, draft = null) {
    return {
      title: existing ? t('editProcedure') : t('newProcedure'), tab: 'groups',
      render(app) {
        const title = el('input', { type: 'text', value: existing?.title || draft?.title || '', placeholder: 'Procedure title' });
        const desc = el('textarea', { placeholder: 'Short description (optional)' }); desc.value = existing?.description || draft?.description || '';
        const logo = { image: existing?.image || draft?.image || null, icon: existing?.icon || draft?.icon || null };
        const visibility = departmentPicker(existing?.department_ids || draft?.department_ids);
        let fields = (existing?.fields || draft?.fields || []).map(f => ({ ...f }));
        let dragIdx = null;
        const list = el('div', {});
        const draw = () => {
          list.innerHTML = '';
          fields.forEach((f, idx) => {
            const labelInp = el('input', { type: 'text', value: f.label, placeholder: t('label'),
              oninput: e => f.label = e.target.value });
            const typeSel = el('select', { onchange: e => { f.type = e.target.value; draw(); } },
              FIELD_TYPES.map(([v, key]) => opt(v, t(key))));
            typeSel.value = f.type;
            const reqBox = el('label', { class: 'req-toggle' }, [
              el('input', { type: 'checkbox', onchange: e => f.required = e.target.checked }),
              document.createTextNode(t('required')),
            ]);
            reqBox.querySelector('input').checked = !!f.required;
            const handle = el('span', { class: 'drag-handle', draggable: 'true', title: t('dragReorder') }, '⠿');
            const card = el('div', { class: 'card' }, [
              el('div', { class: 'section-head' }, [
                el('div', { style: 'display:flex;align-items:center;gap:8px;min-width:0' }, [
                  handle, el('strong', {}, t('procedureStep') + ` ${idx + 1}`),
                ]),
                el('button', { class: 'btn btn-danger', onclick: () => { fields.splice(idx, 1); draw(); } }, '✕'),
              ]),
              labeled(t('label'), labelInp), labeled(t('type'), typeSel), reqBox,
            ]);

            // Drag to reorder: only the handle starts a drag, so the inputs stay editable.
            handle.addEventListener('dragstart', e => {
              dragIdx = idx;
              e.dataTransfer.effectAllowed = 'move';
              e.dataTransfer.setData('text/plain', String(idx));
              try { e.dataTransfer.setDragImage(card, 20, 20); } catch (_) {}
              card.classList.add('dragging');
            });
            handle.addEventListener('dragend', () => { card.classList.remove('dragging'); dragIdx = null; });
            card.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
            card.addEventListener('drop', e => {
              e.preventDefault();
              if (dragIdx === null || dragIdx === idx) return;
              const [moved] = fields.splice(dragIdx, 1);
              fields.splice(idx, 0, moved);
              dragIdx = null;
              draw();
            });

            if (f.type === 'dropdown' || f.type === 'checkboxes') {
              const optsInp = el('input', { type: 'text', value: (f.options || []).join(', '),
                placeholder: 'Option A, Option B, Option C',
                oninput: e => f.options = e.target.value.split(',').map(s => s.trim()).filter(Boolean) });
              card.append(labeled(t('optionsComma'), optsInp));
            }
            if (f.type === 'slider') {
              if (f.min == null) f.min = 1;
              if (f.max == null) f.max = 5;
              if (f.round == null) f.round = 'nearest';
              const minInp = el('input', { type: 'number', value: f.min, oninput: e => f.min = Number(e.target.value) });
              const maxInp = el('input', { type: 'number', value: f.max, oninput: e => f.max = Number(e.target.value) });
              const leftInp = el('input', { type: 'text', value: f.leftLabel || '',
                placeholder: 'e.g. Not at all', oninput: e => f.leftLabel = e.target.value });
              const rightInp = el('input', { type: 'text', value: f.rightLabel || '',
                placeholder: 'e.g. Very much', oninput: e => f.rightLabel = e.target.value });
              const roundSel = el('select', { onchange: e => f.round = e.target.value }, [
                opt('nearest', t('roundNearest')), opt('up', t('roundUp')),
              ]);
              roundSel.value = f.round;
              card.append(
                el('div', { style: 'display:flex;gap:10px' }, [
                  el('div', { style: 'flex:1' }, labeled(t('sliderMin'), minInp)),
                  el('div', { style: 'flex:1' }, labeled(t('sliderMax'), maxInp)),
                ]),
                labeled(t('sliderLeft'), leftInp),
                labeled(t('sliderRight'), rightInp),
                labeled(t('sliderRound'), roundSel),
              );
            }
            appendExpectedFieldControls(card, f);
            list.append(card);
          });
        };
        draw();
        app.append(
          labeled(t('title'), title, true), labeled(t('profileImage'), logoPicker(logo)), visibility.field, labeled(t('description'), desc), list,
          el('button', { class: 'btn btn-ghost btn-block', style: 'margin-bottom:16px', onclick: () => {
            fields.push({ key: crypto.randomUUID(), type: 'short', label: '', required: false, options: [] }); draw();
          } }, t('addProcedureStep')),
          el('div', { style: 'display:flex;gap:10px;flex-wrap:wrap' }, [
            el('button', { class: 'btn btn-ghost btn-block', onclick: previewProc }, 'Preview'),
            el('button', { class: 'btn btn-ghost btn-block', onclick: () => saveProc(true) }, t('saveDraft')),
            el('button', { class: 'btn btn-primary btn-block', onclick: () => saveProc(false) }, t('publish')),
          ]),
          existing && g?.id && isLinkedItem(existing, g.id)
            ? el('button', { class: 'btn btn-ghost btn-block', style: 'margin-top:10px', onclick: async () => {
                const { error } = await unlinkItemFromGroup('procedures', existing, g.id);
                if (error) return toast(error.message, 'err');
                toast(t('removedFromGroup')); back();
              } }, t('removeFromGroup'))
            : existing ? el('button', { class: 'btn btn-danger btn-block', style: 'margin-top:10px', onclick: del }, t('deleteProcedure')) : null,
        );
        // Read-confirmation matrix for the current version (existing procedures only).
        if (existing) {
          const readsCard = el('div', { class: 'card', style: 'margin-top:16px' });
          app.append(readsCard);
          (async () => {
            const v = existing.version || 1;
            const res = await db.from('procedure_reads').select('user_id, confirmed_at')
              .eq('procedure_id', existing.id).eq('version', v)
              .then(r => r, () => ({ error: true }));
            if (res.error) {
              readsCard.append(el('h3', {}, t('readConfirmations')),
                el('p', { class: 'muted' }, t('procedureReadsMigrationHint')));
              return;
            }
            await loadProfiles();
            const byUser = new Map((res.data || []).map(r => [r.user_id, r.confirmed_at]));
            const people = state.profiles.filter(p => p.is_verified && !p.is_suspended);
            readsCard.append(
              el('div', { class: 'section-head' }, [
                el('h3', { style: 'margin:0' }, t('readConfirmations')),
                el('span', { class: 'pill' }, `${byUser.size}/${people.length} · ${t('versionLabel')} ${v}`),
              ]),
              el('p', { class: 'sub' }, t('readConfirmationsHint')),
            );
            for (const p of people) {
              const at = byUser.get(p.id);
              readsCard.append(el('div', { style: 'display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--soft-line);font-size:.88rem' }, [
                el('span', {}, labelOf(p)),
                at ? el('span', { style: 'color:#2f9e5b' }, `✓ ${fmt(at)}`)
                   : el('span', { class: 'muted' }, t('notConfirmed')),
              ]));
            }
          })();
        }
        function cleanProcFields() {
          return cleanReportFormFields(fields);
        }
        function previewProc() {
          showProcedurePreview({
            title: title.value.trim() || t('newProcedure'),
            description: desc.value.trim(),
            fields: cleanProcFields(),
          });
        }
        async function saveProc(is_draft) {
          const clean = cleanProcFields();
          if (!title.value.trim() || !clean.length) return toast(t('addTitleAndField'), 'err');
          const homeGroup = procedureHomeGroup(g, existing);
          if (!homeGroup?.id) return toast('No procedure group found. Create a procedure group first.', 'err');
          const payload = { group_id: homeGroup.id, title: title.value.trim(), description: desc.value.trim() || null,
            fields: clean, is_draft, image: logo.image || null, icon: logo.icon || null,
            department_ids: visibility.get(), created_by: state.profile.id };
          // Content edits invalidate old "read and understood" confirmations, so
          // bump the version (pre-migration DBs lack the column — retry without).
          const contentChanged = existing && (
            (existing.title || '') !== payload.title ||
            (existing.description || null) !== payload.description ||
            JSON.stringify(existing.fields || []) !== JSON.stringify(clean));
          if (contentChanged) payload.version = (existing.version || 1) + 1;
          const run = (body) => existing ? db.from('procedures').update(body).eq('id', existing.id)
                                         : db.from('procedures').insert(body);
          let { error } = await run(payload);
          if (error && payload.version && /version/.test(error.message || '')) {
            delete payload.version;
            ({ error } = await run(payload));
          }
          if (error) return toast(error.message, 'err');
          toast(is_draft ? t('draftSaved') : t('published')); back();
        }
        async function del() {
          if (!confirm('Delete this procedure?')) return;
          const { error } = await db.from('procedures').delete().eq('id', existing.id);
          if (error) return toast(error.message, 'err');
          toast(t('deleted')); back();
        }
      },
    };
  }

  function appendExpectedFieldControls(card, field) {
    const rule = field.expected || {};
    if (['short', 'long', 'dropdown', 'checkboxes'].includes(field.type)) {
      const expectedInp = el('input', { type: 'text', value: (field.expectedValues || rule.values || []).join(', '),
        placeholder: field.type === 'checkboxes' ? 'Option A, Option B' : 'OK, Complete',
        oninput: e => field.expectedValues = e.target.value.split(',').map(s => s.trim()).filter(Boolean) });
      card.append(labeled(t('expectedValues'), expectedInp));
      return;
    }
    if (field.type === 'number' || field.type === 'slider') {
      const minInp = el('input', { type: 'number', value: field.expectedMin ?? rule.min ?? '',
        oninput: e => field.expectedMin = e.target.value });
      const maxInp = el('input', { type: 'number', value: field.expectedMax ?? rule.max ?? '',
        oninput: e => field.expectedMax = e.target.value });
      card.append(el('div', { class: 'expected-grid' }, [
        labeled(t('expectedMin'), minInp),
        labeled(t('expectedMax'), maxInp),
      ]));
      return;
    }
    if (field.type === 'checkbox') {
      const current = field.expectedChecked ?? rule.checked;
      const sel = el('select', { onchange: e => {
        field.expectedChecked = e.target.value === '' ? '' : e.target.value === 'true';
      } }, [
        opt('', '-'),
        opt('true', t('yes')),
        opt('false', t('no')),
      ]);
      sel.value = current === true ? 'true' : current === false ? 'false' : '';
      card.append(labeled(t('expectedChecked'), sel));
    }
  }

  function showProcedurePreview(p) {
    openModal('Preview', (body) => {
      const shell = el('div', { class: 'preview-shell' }, [
        el('h2', { class: 'display preview-title' }, p.title || t('procedures')),
        p.description ? el('p', { class: 'muted', style: 'margin-top:0' }, p.description) : null,
      ]);
      if (p.fields?.length) {
        shell.append(el('div', { class: 'procedure-step-list' }, p.fields.map((f, idx) => {
          const options = (f.options || []).filter(Boolean);
          const card = el('div', { class: 'card procedure-step-card' }, [
            el('div', { class: 'procedure-step-kicker' }, `${t('procedureStep')} ${idx + 1}`),
            el('h3', {}, f.label),
          ]);
          if (options.length) {
            card.append(el('ul', { class: 'procedure-option-list' }, options.map(o => el('li', {}, o))));
          }
          if (f.type === 'slider') {
            card.append(el('p', { class: 'muted' },
              `${t('sliderMin')}: ${f.min ?? 1} - ${t('sliderMax')}: ${f.max ?? 5}`));
            if (f.leftLabel || f.rightLabel) card.append(el('p', { class: 'muted' },
              [f.leftLabel, f.rightLabel].filter(Boolean).join(' - ')));
          }
          if (f.required) card.append(el('span', { class: 'pill' }, t('required')));
          return card;
        })));
      } else {
        shell.append(emptyState(t('noProcedures'), t('addProcedureStep')));
      }
      body.append(shell);
    });
  }

  function submissionsView(p) {
    return {
      title: 'Entries', tab: 'groups',
      async render(app) {
        const { data, error } = await db.from('procedure_submissions').select('*').eq('procedure_id', p.id).order('created_at', { ascending: false });
        app.append(el('h2', { class: 'display', style: 'margin-top:0' }, p.title));
        if (error) return app.append(emptyState('Could not load entries', error.message));
        if (!data?.length) return app.append(emptyState('No entries yet', 'Submissions from users appear here.'));
        const fields = p.fields || [];
        for (const s of data) {
          const issues = procedureFieldIssues(fields, s.answers);
          const issueKeys = new Set(issues.map(i => i.field.key));
          const card = el('div', { class: 'card log-card' + (issues.length ? ' log-warning' : '') }, [
            el('div', { class: 'muted', style: 'font-size:.8rem;margin-bottom:8px' }, `${nameOf(s.user_id)} · ${fmt(s.created_at)}`),
          ]);
          if (issues.length) card.append(el('span', { class: 'pill inspection-status-pill', style: 'margin-bottom:8px' }, t('checklistLogNeedsAttention')));
          for (const f of fields) {
            const v = s.answers?.[f.key];
            const isIssue = issueKeys.has(f.key);
            if (isIssue || expectedText(f)) {
              card.append(el('div', { class: 'sub', style: 'margin:4px 0' }, [
                isIssue ? el('span', { class: 'pill inspection-status-pill', style: 'margin-right:8px' }, t('outsideExpected')) : null,
                expectedText(f) ? document.createTextNode(`${t('expected')}: ${expectedText(f)}`) : null,
              ]));
            }
            card.append(el('div', { class: isIssue ? 'inspection-row inspection-bad' : '', style: 'margin-bottom:6px;padding:6px 8px;border-radius:8px' }, [
              el('span', { class: 'muted', style: 'font-size:.82rem' }, f.label + ': '),
              el('span', {}, v === true ? 'Yes' : v === false ? 'No'
                : Array.isArray(v) ? (v.length ? v.join(', ') : '—') : String(v ?? '—')),
            ]));
          }
          if (issues.length) card.append(el('ul', { class: 'log-missing' }, issues.map(i => el('li', {}, `${i.field.label}: ${i.reason}`))));
          app.append(card);
        }
      },
    };
  }

  // ════════════════════════════════════════════════════════
  //  SETTINGS — user roles + categories shortcut
  // ════════════════════════════════════════════════════════
  function settingsView() {
    return {
      title: t('settings'), tab: 'settings',
      async render(app) {
        await loadProfiles();
        const fresh = await db.from('profiles').select('*').eq('id', state.profile.id).single();
        if (!fresh.error && fresh.data) state.profile = { ...state.profile, ...fresh.data };
        const p = state.profile;
        const requests = await loadProfileChangeRequests(p.id, false);
        const hasPending = requests.some(r => r.status === 'pending');
        const safeFullName = displayName(p);
        const fullName = el('input', { type: 'text', autocomplete: 'off', placeholder: safeFullName ? '' : maskEmail(p.full_name) });
        fullName.value = safeFullName || '';
        const username = el('input', { type: 'text', autocomplete: 'username' }); username.value = p.username || '';
        const email = el('input', { type: 'email', autocomplete: 'off', placeholder: maskEmail(p.email) || t('email') });
        const mobile = el('input', { type: 'tel', autocomplete: 'tel' }); mobile.value = p.mobile_number || '';

        app.append(el('div', { class: 'card settings-card' }, [
          el('h3', {}, t('yourDetails')),
          languageSelect(() => go(settingsView(), { reset: true })),
          el('div', { class: 'settings-current' }, [
            kv('Name', safeFullName || maskEmail(p.full_name) || '—'),
            kv('Username', p.username ? `@${p.username}` : '—'),
            emailKv(p),
            kv('Mobile', p.mobile_number || '—'),
          ]),
          kv('Access', roleName(p.role)),
          el('hr', { class: 'soft' }),
          labeled('Name', fullName),
          labeled('Username', username),
          labeled('Email', email),
          labeled('Mobile number', mobile),
          hasPending ? el('p', { class: 'muted' }, 'You already have a pending profile change. Wait for it to be approved or rejected before sending another one.') : null,
          el('button', { class: 'btn btn-primary btn-block', disabled: hasPending ? 'disabled' : null, onclick: async () => {
            const requestedFullName = fullName.value.trim() || (safeFullName ? '' : (p.full_name || ''));
            const next = { full_name: requestedFullName, username: username.value.trim(), email: email.value.trim() || p.email || '', mobile_number: mobile.value.trim() };
            if (!next.username || !next.email) return toast(t('usernameEmailRequired'), 'err');
            const unchanged = (p.full_name || '') === next.full_name && (p.username || '') === next.username && (p.email || '') === next.email && (p.mobile_number || '') === next.mobile_number;
            if (unchanged) return toast(t('nothingChanged'), 'err');
            if ((p.username || '') !== next.username) {
              const { data: free, error: freeErr } = await db.rpc('username_available', { p_username: next.username });
              if (!freeErr && free === false) return toast(t('usernameTaken'), 'err');
            }
            const rpc = await db.rpc('request_profile_change', { p_full_name: next.full_name || null, p_username: next.username, p_email: next.email, p_mobile_number: next.mobile_number || null });
            if (rpc.error && !missingOptionalRpc(rpc.error)) return toast(rpc.error.message, 'err');

  function missingOptionalColumn(error) {

  async function importUsersExcel(file) {
    const rows = await readExcelRows(file, USER_COLUMNS, 'Users');
    if (!rows) return;
    const parseRole = (v) => {
      const s = String(v || '').trim().toLowerCase().replace(/[\s-]+/g, '_');
      return ({ user: 'user', verneombud: 'verneombud', safety_rep: 'verneombud', safetyrep: 'verneombud',
        admin: 'admin', administrator: 'admin', superuser: 'superuser', superbruker: 'superuser',
        sysadmin: 'sysadmin', sys_admin: 'sysadmin', super_admin: 'sysadmin', superadmin: 'sysadmin' }[s] || null);
    };
    const parseApproved = (v) => {
      const s = String(v || '').trim().toLowerCase();
      return ['yes', 'true', '1', 'approved', 'ja'].includes(s);
    };
    await loadProfiles();
    const existingEmails = new Set(state.profiles.map(p => String(p.email || '').trim().toLowerCase()).filter(Boolean));
    const existingUsernames = new Set(state.profiles.map(p => String(p.username || '').trim().toLowerCase()).filter(Boolean));
    const seenEmails = new Set();
    const seenUsernames = new Set();
    for (const [idx, r] of rows.entries()) {
      const role = parseRole(r.Role);
      const email = String(r.Email || '').trim().toLowerCase();
      const username = String(r.Username || '').trim().toLowerCase();
      const fullName = String(r['Full name'] || '').trim();
      if (!email || !fullName || !username || !String(r['Temporary password'] || '').trim()) {
        return toast(`Row ${idx + 2} needs Full name, Email, Username, and Temporary password.`, 'err');
      }
      if (existingEmails.has(email)) return toast(`Row ${idx + 2}: email "${email}" already exists.`, 'err');
      if (existingUsernames.has(username)) return toast(`Row ${idx + 2}: username "${username}" already exists.`, 'err');
      if (seenEmails.has(email)) return toast(`Row ${idx + 2}: email "${email}" appears more than once in this file.`, 'err');
      if (seenUsernames.has(username)) return toast(`Row ${idx + 2}: username "${username}" appears more than once in this file.`, 'err');
      seenEmails.add(email);
      seenUsernames.add(username);
      if (!role) return toast(`Row ${idx + 2} has an invalid Role. Use User, Safety rep, Admin, Superuser, or Sys-admin.`, 'err');
      if (!isSysadmin(state.profile) && roleRank(role) >= roleRank(state.profile)) {
        return toast(t('importBelowRoleOnly'), 'err');
      }
      if (String(r['Temporary password']).trim().length < 6) {
        return toast(`Row ${idx + 2} temporary password must be at least 6 characters.`, 'err');
      }
    }

    const auth = newAuthClient();
    let created = 0;
    for (const [idx, r] of rows.entries()) {
      const email = String(r.Email || '').trim();
      const username = String(r.Username || '').trim();
      const fullName = String(r['Full name'] || '').trim();
      const mobile = String(r['Mobile number'] || '').trim();
      const role = parseRole(r.Role);
      const password = String(r['Temporary password'] || '').trim();
      const { data: free, error: freeErr } = await db.rpc('username_available', { p_username: username });
      if (!freeErr && free === false) {
        await auth.auth.signOut();
        return toast(`Row ${idx + 2}: username "${username}" is taken.`, 'err');
      }
      const { data, error } = await signUpWithProfile(auth, {
        email, password, full_name: fullName, username, mobile_number: mobile,
        emailRedirectTo: new URL('confirmed.html', location.href).href,
      });
      if (error) {
        await auth.auth.signOut();
        return toast(`Row ${idx + 2}: ${error.message}`, 'err');
      }
      const id = data?.user?.id;
      if (!id) {
        await auth.auth.signOut();
        return toast(`Row ${idx + 2}: user created, but Supabase did not return an id.`, 'err');
      }
      // The profile row is created by the handle_new_user trigger from the
      // sign-up metadata; role/approval go through the rank-checked RPCs so the
      // privileged columns are never written directly from the browser (audit V3).
      let profileErr = null;
      if (role !== 'user') {
        ({ error: profileErr } = await db.rpc('set_role', { target: id, new_role: role }));
      } else if (parseApproved(r.Approved)) {
        ({ error: profileErr } = await db.rpc('set_verification', { target: id, verified: true }));
      }
      if (profileErr) {
        await auth.auth.signOut();
        return toast(`Row ${idx + 2}: ${profileErr.message}`, 'err');
      }
      created++;
    }
    await auth.auth.signOut();
    toast(`${created} user${created === 1 ? '' : 's'} imported.`);
    await loadProfiles();
    refresh();
  }

  // ── Risk assessment (risikovurdering) — 5×5 probability × consequence ───
  const riskColor = (score) => score <= 4 ? '#2f9e5b' : score <= 9 ? '#f2c94c' : score <= 14 ? '#e8862e' : '#a32d2d';
  const riskText = (score) => score > 4 && score <= 9 ? '#17212b' : '#fff';

  function risksView() {
    return {
      title: t('riskAssessment'), tab: 'groups', side: 'risks',
      action: el('button', { class: 'iconbtn', title: t('newRisk'),
        onclick: () => riskModal(null, () => go(risksView())) }, '+'),
      async render(app) {
        await loadProfiles(); await loadDepartments();
        const res = await db.from('risks').select('*')
          .order('created_at', { ascending: false })
          .then(r => r, () => ({ error: true }));
        if (res.error) { app.append(emptyState(t('riskAssessment'), t('risksMigrationHint'))); return; }
        const all = res.data || [];
        let deptFilter = '';
        let cellFilter = null; // { p, c } — click a matrix cell to drill the list
        const deptSel = el('select', {}, [opt('', t('allDepartments')), ...state.departments.map(d => opt(d.id, d.name))]);
        deptSel.addEventListener('change', () => { deptFilter = deptSel.value; cellFilter = null; draw(); });
        app.append(el('div', { style: 'display:flex;justify-content:flex-end;margin-bottom:4px' }, deptSel));
        const matrixHost = el('div', { class: 'card' });
        const listHost = el('div', {});
        app.append(matrixHost, listHost);
        const visible = () => all.filter(r => r.status === 'active' && (!deptFilter || r.department_id === deptFilter));
        function draw() {
          matrixHost.innerHTML = ''; listHost.innerHTML = '';
          const rows = visible();
          const grid = el('div', { class: 'risk-matrix' });
          for (let p = 5; p >= 1; p--) {
            grid.append(el('div', { class: 'risk-axis' }, String(p)));
            for (let c = 1; c <= 5; c++) {
              const n = rows.filter(r => r.probability === p && r.consequence === c).length;
              const score = p * c;
              const sel = cellFilter && cellFilter.p === p && cellFilter.c === c;
              grid.append(el('div', { class: 'risk-cell' + (sel ? ' sel' : cellFilter ? ' dim' : ''),
                style: `background:${riskColor(score)};color:${riskText(score)}`,
                onclick: () => { cellFilter = sel ? null : { p, c }; draw(); } }, n ? String(n) : ''));
            }
          }
          grid.append(el('div', {}, ''));
          for (let c = 1; c <= 5; c++) grid.append(el('div', { class: 'risk-axis' }, String(c)));
          matrixHost.append(grid,
            el('div', { class: 'risk-axis-label' }, `↑ ${t('probability')} · → ${t('consequence')} · ${t('riskScaleHint')}`));
          const listRows = cellFilter
            ? rows.filter(r => r.probability === cellFilter.p && r.consequence === cellFilter.c)
            : [...rows].sort((a, b) => b.probability * b.consequence - a.probability * a.consequence);
          listHost.append(el('h3', { style: 'margin:16px 0 8px' }, t('highestRisks')));
          if (!listRows.length) { listHost.append(el('p', { class: 'muted' }, t('noRisks'))); return; }
          for (const r of listRows) listHost.append(riskRow(r));
        }
        function riskRow(r) {
          const score = r.probability * r.consequence;
          return el('div', { class: 'card', style: 'cursor:pointer;margin-bottom:10px',
            onclick: () => riskModal(r, () => go(risksView())) }, [
            el('div', { class: 'section-head' }, [
              el('h3', { style: 'margin:0' }, r.title),
              el('span', { class: 'pill', style: `background:${riskColor(score)};color:${riskText(score)};border-color:${riskColor(score)}` },
                `${r.probability}×${r.consequence} = ${score}`),
            ]),
            el('div', { class: 'sub' },
              [r.department_id ? departmentName(r.department_id) : t('allDepartments'),
               r.description ? r.description.slice(0, 100) : null].filter(Boolean).join(' · ')),
          ]);
        }
        draw();
      },
    };
  }

          const assignBtn = unassigned.length ? el('button', {

          }, `+ ${t('addMember')}`) : null;

            onclick: () => changeDeptEmoji(d)
          }, deptIcon);
